name: AEGIS Daily

# Zero-cost scheduler for the AEGIS v2 architecture:
#   GitHub Actions (this) -> run engine + recommendation DB -> regenerate Excel
#   -> commit back to the repo -> (optional) push to Google Sheets (the live view).
#
# Runs 03:00 UTC = 08:30 IST, Mon-Fri (pre-market). Also runnable on demand (workflow_dispatch).
#
# NOTE ON DATA: the engine reads the committed parquet panels in data/raw/india/.
# Until a live data-pull step is added (yfinance/Angel), a daily run reproduces the
# same output on unchanged data + advances the recommendation DB lifecycle. Add a
# refresh step under "Refresh market data" to make it truly daily.
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON  -> full contents of the service-account .json   (optional, for Sheets)
#   AEGIS_SPREADSHEET_ID         -> target Google Sheet id                       (optional, for Sheets)

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 03:00 UTC = 08:30 IST, weekdays (pre-market)
  workflow_dispatch:

permissions:
  contents: write          # allow committing the regenerated workbook back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Linux-safe subset)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dashboard.txt gspread google-auth yfinance

      - name: Refresh market data (append latest bars)
        run: python india/refresh_data.py || echo "data refresh issue; using last committed data"

      - name: Run AEGIS engine + recommendation database (resilient — Telegram still fires)
        run: |
          python india/recommendation_generator.py || echo "engine refresh issue; will send last snapshot"
          python india/recommendation_db.py || echo "db update skipped"

      - name: Push to Google Sheets (live view) — no-ops if secrets absent
        env:
          AEGIS_SPREADSHEET_ID: ${{ secrets.AEGIS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/prism-sheets-sa.json
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > secrets/prism-sheets-sa.json
          python india/sheets_sync.py || echo "sheets sync skipped/failed (non-fatal)"
          rm -f secrets/prism-sheets-sa.json

      - name: Telegram daily notification — no-ops if secrets absent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AEGIS_SPREADSHEET_ID: ${{ secrets.AEGIS_SPREADSHEET_ID }}
        run: python india/telegram_notify.py || echo "telegram skipped (non-fatal)"

      - name: Commit regenerated report + database
        run: |
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add reports/AEGIS_*.xlsx data/aegis_*.csv data/raw/india/*_D1.parquet || true
          git diff --cached --quiet || git commit -m "AEGIS daily: append market data + refresh report + DB [skip ci]"
          git push || true
