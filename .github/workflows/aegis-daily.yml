name: AEGIS Daily

# Daily automation: refresh market data (yfinance) -> freshness gate -> engine -> DB snapshot ->
# scorecard -> Google Sheets -> Telegram -> commit. Every weekday, automatically.
#
# WHY MULTIPLE TIMES: GitHub scheduled runs are BEST-EFFORT — often delayed, sometimes dropped
# entirely under load. We attempt several times each morning and use a once-per-IST-day guard
# so the work runs exactly once. Missed days self-heal: refresh_data uses a 1-month lookback.
#
# 2026-07-17 morning-cadence restoration (operator request 2026-07-17):
#   Evening delivery is not useful — the operator plans the trading day at
#   ~06:00 IST before markets open. The daily brief must land THEN, dated for
#   TODAY IST, using YESTERDAY's session close as the reference bar (normal
#   morning-brief pattern in Indian institutional flow).
#
# Attempts (IST): ~06:00 (primary) · ~06:30 (backup 1) · ~07:00 (backup 2) · ~08:00 (backup 3).
# Cron UTC = IST - 05:30. All slots after 00:00 UTC so datetime.now().date()
# in the UTC runner and $(TZ=Asia/Kolkata date +%F) both return TODAY IST.
# Manual dispatch always runs.
#
# Required repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Optional:              GOOGLE_SERVICE_ACCOUNT_JSON, AEGIS_SPREADSHEET_ID.
# Missing optional secrets are skipped gracefully.

on:
  schedule:
    # Morning-IST slots. Yesterday's NSE close (15:30 IST) has published to
    # yfinance by now; the generator uses that bar and stamps picks with
    # today's IST date (`Generated = datetime.now().date()`).
    - cron: "30 0 * * 1-5"    # ~06:00 IST — primary (before market open)
    - cron: "0 1 * * 1-5"     # ~06:30 IST — backup 1
    - cron: "30 1 * * 1-5"    # ~07:00 IST — backup 2
    - cron: "30 2 * * 1-5"    # ~08:00 IST — backup 3 (last morning slot)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard — run at most once per IST day (manual always runs)
        id: guard
        run: |
          IST=$(TZ=Asia/Kolkata date +%F)
          echo "ist=$IST" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(cat data/.published 2>/dev/null)" = "$IST" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Already published for $IST — this backup attempt no-ops."
          else
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Running for $IST."
          fi

      - name: Install dependencies (Linux-safe subset)
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dashboard.txt gspread google-auth yfinance

      - name: Refresh market data (append latest bars via yfinance)
        if: steps.guard.outputs.run == 'true'
        run: python india/refresh_data.py || echo "data refresh issue; will let freshness gate decide"

      - name: Freshness gate — abort if data is stale
        if: steps.guard.outputs.run == 'true'
        id: freshness
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/check_data_freshness.py
          echo "fresh=true" >> $GITHUB_OUTPUT

      # OPS001-F: recommendation_generator failure MUST fail the workflow.
      # No `|| echo` masking here — that mask allowed 17 days of silent stale-Telegram.
      # See docs/OPS001E_ROOT_CAUSE_REPORT.md + docs/OPS001F_IMPLEMENTATION.md.
      - name: Delete stale outputs (defense-in-depth pre-generator)
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.fresh == 'true'
        run: rm -f data/aegis_today.csv data/aegis_candidates.csv reports/AEGIS_LATEST.xlsx

      - name: Run AEGIS engine (fail-fast — no mask)
        id: engine
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.fresh == 'true'
        run: python india/recommendation_generator.py

      - name: Verify aegis_today.csv is fresh (blocks stale Telegram)
        id: freshcheck
        if: steps.guard.outputs.run == 'true' && steps.engine.outcome == 'success'
        run: |
          test -f data/aegis_today.csv || (echo "FAIL: data/aegis_today.csv missing after generator"; exit 1)
          GEN=$(head -2 data/aegis_today.csv | tail -1 | cut -d, -f1)
          TODAY_IST=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          if [ "$GEN" != "$TODAY_IST" ]; then
            echo "FAIL: aegis_today.csv Generated=$GEN but today IST=$TODAY_IST"
            exit 1
          fi
          echo "aegis_today.csv Generated=$GEN matches today IST=$TODAY_IST — proceeding"
          echo "verified=true" >> $GITHUB_OUTPUT

      - name: Run database + scorecard + ops check (non-critical — masked)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        run: |
          python india/recommendation_db.py || echo "db update skipped"
          python india/scorecard.py || echo "scorecard skipped"
          python india/ops_check.py || echo "ops-check reported issues (see board above)"

      - name: Push to Google Sheets (no-ops if secrets absent)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          AEGIS_SPREADSHEET_ID: ${{ secrets.AEGIS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/prism-sheets-sa.json
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > secrets/prism-sheets-sa.json
          python india/sheets_sync.py || echo "sheets sync skipped/failed (non-fatal)"
          rm -f secrets/prism-sheets-sa.json

      # 2026-07-15 reliability upgrade: pre-notify health check + retry wrapper.
      # See docs/TELEGRAM_RELIABILITY_PLAN.md for root causes fixed here.
      - name: Telegram health check (getMe + getChat)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_health_check.py

      - name: Telegram daily notification (retry + delivery ledger)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AEGIS_SPREADSHEET_ID: ${{ secrets.AEGIS_SPREADSHEET_ID }}
        run: python scripts/telegram_send_with_retry.py --attempts 4

      - name: Upload Telegram delivery ledger (artifact)
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-log
          path: reports/telegram_delivery_*.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark published + commit report/data
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        run: |
          echo "${{ steps.guard.outputs.ist }}" > data/.published
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add reports/AEGIS_*.xlsx data/aegis_*.csv data/raw/india/*_D1.parquet data/.published docs/ || true
          git diff --cached --quiet || git commit -m "AEGIS daily: append market data + refresh report + DB [skip ci]"
          git push || true
