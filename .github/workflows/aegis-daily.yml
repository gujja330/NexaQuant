name: AEGIS Daily

# Daily automation: refresh market data (yfinance) -> freshness gate -> engine -> DB snapshot ->
# scorecard -> Google Sheets -> Telegram -> commit. Every weekday, automatically.
#
# WHY MULTIPLE TIMES: GitHub scheduled runs are BEST-EFFORT — often delayed, sometimes dropped
# entirely under load. We attempt several times each morning and use a once-per-IST-day guard
# so the work runs exactly once. Missed days self-heal: refresh_data uses a 1-month lookback.
#
# 2026-07-17 morning-cadence restoration (operator request 2026-07-17):
#   Evening delivery is not useful — the operator plans the trading day at
#   ~06:00 IST before markets open. The daily brief must land THEN, dated for
#   TODAY IST, using YESTERDAY's session close as the reference bar (normal
#   morning-brief pattern in Indian institutional flow).
#
# 2026-08-14 · operator directive: "every day trigger should happen for
# india should be between 6am to 7am". Locked to 3 slots inside that window.
# Removed the 08:00 IST slot (was outside the 6-7 AM window).
#
# Attempts (IST): ~06:00 (primary) · ~06:30 (backup 1) · ~07:00 (backup 2)
# Cron UTC = IST - 05:30. All slots after 00:00 UTC so datetime.now().date()
# in the UTC runner and $(TZ=Asia/Kolkata date +%F) both return TODAY IST.
# Manual dispatch always runs.
#
# Required repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Optional:              GOOGLE_SERVICE_ACCOUNT_JSON, AEGIS_SPREADSHEET_ID.
# Missing optional secrets are skipped gracefully.

on:
  schedule:
    # Morning-IST slots · 6-7 AM per operator lock 2026-08-14.
    # Yesterday's NSE close (15:30 IST) has published to yfinance by 06:00 IST.
    - cron: "30 0 * * 1-5"    # ~06:00 IST — primary (2h 15m before market open)
    - cron: "0 1 * * 1-5"     # ~06:30 IST — backup 1
    - cron: "30 1 * * 1-5"    # ~07:00 IST — backup 2 (last of morning window)
  workflow_dispatch:
  # 2026-08-18 · TEMPORARY · fire on next main push to force a fresh CI-built
  # XLSX after the gujja330 account switch. REVERT this section in follow-up
  # commit once Telegram delivery confirmed.
  push:
    branches: [main]

# Wave Y · Constitution Article 45: workflows touching shared state MUST
# declare concurrency. Fixes v2.2 T1/Sch1 (duplicate scheduler+Telegram sends).
# Mirrors mon001-daily.yml pattern. In-progress runs cancel newer duplicates
# so only ONE aegis-daily is active at a time.
concurrency:
  group: aegis-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard — run at most once per IST day (manual always runs)
        id: guard
        run: |
          IST=$(TZ=Asia/Kolkata date +%F)
          echo "ist=$IST" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(cat data/.published 2>/dev/null)" = "$IST" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Already published for $IST — this backup attempt no-ops."
          else
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Running for $IST."
          fi

      - name: Install dependencies (Linux-safe subset)
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dashboard.txt gspread google-auth yfinance pyyaml

      - name: Refresh market data (append latest bars via yfinance)
        if: steps.guard.outputs.run == 'true'
        run: python india/refresh_data.py || echo "data refresh issue; will let freshness gate decide"

      - name: Freshness gate — abort if data is stale
        if: steps.guard.outputs.run == 'true'
        id: freshness
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/check_data_freshness.py
          echo "fresh=true" >> $GITHUB_OUTPUT

      # OPS001-F: recommendation_generator failure MUST fail the workflow.
      # No `|| echo` masking here — that mask allowed 17 days of silent stale-Telegram.
      # See docs/OPS001E_ROOT_CAUSE_REPORT.md + docs/OPS001F_IMPLEMENTATION.md.
      - name: Delete stale outputs (defense-in-depth pre-generator)
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.fresh == 'true'
        run: rm -f data/aegis_today.csv data/aegis_candidates.csv reports/AEGIS_LATEST.xlsx

      - name: Run AEGIS engine (fail-fast — no mask)
        id: engine
        if: steps.guard.outputs.run == 'true' && steps.freshness.outputs.fresh == 'true'
        run: python india/recommendation_generator.py

      - name: Verify aegis_today.csv is fresh (blocks stale Telegram)
        id: freshcheck
        if: steps.guard.outputs.run == 'true' && steps.engine.outcome == 'success'
        run: |
          test -f data/aegis_today.csv || (echo "FAIL: data/aegis_today.csv missing after generator"; exit 1)
          GEN=$(head -2 data/aegis_today.csv | tail -1 | cut -d, -f1)
          TODAY_IST=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          if [ "$GEN" != "$TODAY_IST" ]; then
            echo "FAIL: aegis_today.csv Generated=$GEN but today IST=$TODAY_IST"
            exit 1
          fi
          echo "aegis_today.csv Generated=$GEN matches today IST=$TODAY_IST — proceeding"
          echo "verified=true" >> $GITHUB_OUTPUT

      - name: Run database + scorecard + ops check (non-critical — masked)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        run: |
          python india/recommendation_db.py || echo "db update skipped"
          python india/scorecard.py || echo "scorecard skipped"
          python india/ops_check.py || echo "ops-check reported issues (see board above)"

      - name: Push to Google Sheets (no-ops if secrets absent)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          AEGIS_SPREADSHEET_ID: ${{ secrets.AEGIS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: secrets/prism-sheets-sa.json
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > secrets/prism-sheets-sa.json
          python india/sheets_sync.py || echo "sheets sync skipped/failed (non-fatal)"
          rm -f secrets/prism-sheets-sa.json

      # 2026-07-18 · Phase 2 v2 engines orchestrator.
      # Runs Adaptive Rec v2.0 -> Validation v2.0 -> Risk & Capital v2.0 ->
      # DNA feedback v1.5 -> Knowledge Graph v1.6 -> Fusion v2.1.
      # Telegram (UX030) is the last step of aegis_daily_v2.py itself and
      # is skipped there because we prefer the sealed retry wrapper below
      # for delivery reliability. --continue means a Phase 2 failure
      # cannot block the base pipeline's Telegram delivery.
      - name: Run Phase 2 v2 orchestrator (Adaptive Rec v2.0 -> Fusion v2.1)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          # deliberately NOT passing TELEGRAM_* so the Phase 2 telegram step
          # skips gracefully -- delivery is owned by the sealed wrapper below.
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID:   ""
        run: python scripts/aegis_daily_v2.py --continue || echo "Phase 2 orchestrator reported issues (non-fatal)"

      # 2026-07-15 reliability upgrade: pre-notify health check + retry wrapper.
      # See docs/TELEGRAM_RELIABILITY_PLAN.md for root causes fixed here.
      - name: Telegram health check (getMe + getChat)
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_health_check.py

      # ─────────────────────────────────────────────────────────
      # Telegram delivery · v2.4 · SINGLE-SOURCE-OF-TRUTH cutover
      # ─────────────────────────────────────────────────────────
      # Per operator's consistency-audit directive (2026-07-29):
      #   "one source of truth: every UI (Telegram, Dashboard, PDF, API)
      #    must read from the same recommendations.json"
      #   "no legacy renderers: remove or retire the old Telegram/Champion
      #    pipeline so there is only one daily report"
      #
      # Retired here (kept as scripts on disk · sealed contracts untouched):
      #   scripts/telegram_send_with_retry.py  (legacy MON001 paper portfolio
      #     · read data/aegis_today.csv · caused "Hold 2M" hardcoded static
      #     display + duplicate messages)
      #   scripts/telegram_send_ux030.py       (UX030 · read a different
      #     context bundle · disagreed with new SSoT on regime/cash/BUYs)
      #
      # Only sender that runs is the Command Center. If ever needed, either
      # legacy sender can be re-enabled by uncommenting its step block.
      - name: Telegram Command Center (India · SINGLE SENDER · cycle 6)
        id: send
        # Consumes reports/recommendations.json enriched by cycles 3-4
        # (ceo_summary + rotation_intelligence + evolution + investor_action
        # + position_plan.time_horizon_days from dynamic_holding.json +
        # ai_scorecard + attribution_summary from v2.4).
        # This is the ONLY Telegram delivery path — no more two-pipeline drift.
        # 2026-08-10 · added id=send so mark-published can gate on outcome.
        if: steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_command_center_send.py --market india

      - name: Upload Telegram delivery ledger (artifact)
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-log
          path: |
            reports/telegram_delivery_*.jsonl
            reports/telegram_command_center_*.jsonl
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark published + commit report/data
        # 2026-08-10 BUGFIX: previously mark-published fired regardless of
        # Telegram send outcome. When Guard 8 blocked (exit 2) · mark still
        # set for today · subsequent backup retries no-op'd via the guard
        # check at line 61 · operator never received notification.
        #
        # FIX: only write data/.published when Telegram send actually succeeded
        # (steps.send.outcome == 'success'). Data commit still happens on
        # engine success (independent path · below).
        if: always() && steps.engine.outcome == 'success' && steps.guard.outputs.run == 'true' && steps.freshcheck.outputs.verified == 'true'
        run: |
          if [ "${{ steps.send.outcome }}" = "success" ]; then
            echo "${{ steps.guard.outputs.ist }}" > data/.published
            echo "[mark_published] send succeeded · mark set for retry-suppression"
          else
            echo "[mark_published] send failed/skipped · mark NOT set · next backup will retry"
          fi
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add reports/AEGIS_*.xlsx data/aegis_*.csv data/raw/india/*_D1.parquet data/.published docs/ || true
          # Unified daily XLSX (aegis_history.xlsx + per-day snapshots). If
          # this isn't committed each run, next day's CI starts from the last
          # committed baseline and Aug-3-style single-day gaps appear even
          # when the workflow succeeded. Operator flagged 2026-08-04.
          git add reports/telegram/aegis_history.xlsx reports/telegram/aegis_daily_*.xlsx 2>/dev/null || true
          # Core recommendation payloads · same 2026-08-04 commit-back gap
          # caused stale dynamic_holding.json (2026-07-29 · 6 days old) which
          # forced R2's time_horizon_days to fallback=60 for all tickers not
          # already in the stale dh.json snapshot. Committing these ensures
          # tomorrow's CI reads TODAY's canonical horizons + recs.
          git add reports/recommendations.json reports/dynamic_holding.json 2>/dev/null || true
          git add reports/research/portfolio_snapshot_*.json reports/research/portfolio_ledger.jsonl reports/research/rotation_ledger.jsonl 2>/dev/null || true
          # 2026-08-20 · Sprint K Part 30 · Registry MUST persist across CI runs
          # or every fresh checkout treats every ticker as first-time NEW (bug).
          git add reports/research/opportunity_registry.jsonl 2>/dev/null || true
          git add reports/context/opportunity_violations.json reports/context/daily_opportunity_discovery.json 2>/dev/null || true
          # 2026-08-20 · commit per-market XLSX too · so local devs pulling
          # the repo get freshest India+USA delivered files (was Aug-14 stale).
          git add reports/telegram/aegis_history_india.xlsx reports/telegram/aegis_history_usa.xlsx 2>/dev/null || true
          # Phase 2 v2 artifacts (best-effort; skip if any are missing on a given day)
          git add reports/investment_intelligence.json reports/intelligence_summary.json reports/intelligence_conflicts.json reports/intelligence_explanation.json reports/investment_intelligence.parquet 2>/dev/null || true
          git add reports/adaptive_rec_v2_signal.json reports/adaptive_rec_v2_scoreboard.json reports/adaptive_rec_v2_feature_importance.json reports/adaptive_rec_v2_reliability.json reports/adaptive_rec_v2_signal.parquet reports/adaptive_rec_v2_migration.md 2>/dev/null || true
          git add reports/validation_v2_latest.json reports/validation_v2_daily_*.json reports/validation_v2_daily_*.md 2>/dev/null || true
          git add reports/risk_capital_v2_latest.json reports/risk_capital_v2_*.json reports/risk_capital_v2_explanation_*.md reports/risk_capital_v2_sizing.parquet 2>/dev/null || true
          git add reports/recommendation_dna_feedback.json 2>/dev/null || true
          git add reports/knowledge_graph.json reports/knowledge_graph.parquet reports/community_clusters.json reports/stress_scenarios.json reports/graph_statistics.json reports/entity_network.json reports/company_network.json reports/sector_network.json reports/relationship_matrix.json reports/recommendation_paths.json reports/influence_propagation.json reports/graph_timeline.json 2>/dev/null || true
          git add reports/aegis_daily_v2_history.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AEGIS daily: append market data + refresh report + DB [skip ci]"
          git push || true

      # ═══════════════════════════════════════════════════════════════════════
      # Research post-processing (2026-08-11 · CEO final wiring)
      # Runs AFTER production commit · never blocks the pipeline · alerts on failure.
      # NEVER feeds research findings back into R1/R2 automatically.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Research P0 · rebuild canonical Outcome Dataset
        # ENG003 discipline: no `|| echo` mask. `continue-on-error: true` gives
        # non-blocking behavior; a real failure surfaces as a red step visibly.
        if: always() && steps.engine.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_outcome_dataset.py

      - name: Research P1 · rebuild Attribution Analysis
        # ENG003 discipline: no `|| echo` mask. See P0 step rationale above.
        if: always() && steps.engine.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_attribution.py

      - name: Research staleness guard
        if: always() && steps.engine.outcome == 'success'
        continue-on-error: true
        run: |
          python -c "
          from pathlib import Path
          from datetime import datetime, timedelta
          import os
          for p in ['reports/research/outcome_dataset.parquet', 'reports/research/attribution_analysis.json']:
              f = Path(p)
              if not f.exists():
                  print(f'[research:guard] MISSING {p}')
                  continue
              age_hrs = (datetime.now().timestamp() - f.stat().st_mtime) / 3600
              status = 'FRESH' if age_hrs < 25 else 'STALE'
              print(f'[research:guard] {p}: age={age_hrs:.1f}h {status}')
          "

      - name: Commit research post-processing outputs
        if: always() && steps.engine.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add reports/research/outcome_dataset.parquet reports/research/outcome_dataset_summary.json 2>/dev/null || true
          git add reports/research/attribution_analysis.json reports/research/attribution_report.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AEGIS research: refresh P0 outcome + P1 attribution [skip ci]"
          git push || true
