name: ENG001 Regression

# Runs the ENG001/ENG002 regression harness on every push + PR + weekly cron.
# The harness executes all 6 test suites AND verifies the sealed invariants
# (MON001 fingerprint, production constants, cumulative_strategy_search,
#  forward boundary, no sealed-file modifications).
#
# This workflow does NOT modify production behaviour. It is monitoring-only.
#
# ENG003 fix: added pyarrow to the install list. LAB009 tests call
# india.feature_engine.load_panels() which uses pd.read_parquet on the tracked
# NIFTY200 parquets in data/raw/india/. Without pyarrow the parquet read fails
# with 'No module named pyarrow' and the whole regression aborts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 5 * * 0"   # Sunday 11:07 IST — sanity check while nobody's editing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng001-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install regression deps
        run: |
          python -m pip install --upgrade pip
          # pyarrow is REQUIRED for pd.read_parquet used inside india.feature_engine
          # (called by LAB009 tests). Do NOT remove without also removing every
          # parquet-reading test path.
          pip install pyyaml pandas numpy pyarrow

      - name: Validate workflow discipline (no || echo masks, no continue-on-error abuse)
        run: python nexaquant/tests/test_ci_discipline.py

      - name: nexaquant/lib unit tests
        run: python nexaquant/tests/test_lib.py

      - name: Full regression + invariance guards
        run: python nexaquant/tests/test_regression.py

      - name: MON001 health check
        run: python -m india.monitoring.MON001_Forward_Validation.ops.health_check

      - name: Governance validation
        run: python nexaquant/tests/test_governance.py
