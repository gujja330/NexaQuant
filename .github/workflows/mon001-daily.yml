name: MON001 Daily

# Monitoring-only workflow. Does NOT modify production strategy behaviour.
# Runs the resilient MON001 daily runner on a schedule so forward evidence accumulates
# even if the operator's laptop is offline.
#
# On failure the workflow COMMITS the diagnostics + dashboard + alert log anyway so
# the operator has a paper trail. It never modifies production files.
#
# Required repo secrets: none (MON001 is broker-agnostic and does not send Telegram).
# Optional: `MON001_DASHBOARD_TELEGRAM=true` env — reserved for a future forwarder.

on:
  schedule:
    # Trading days only. MON001 must run AFTER aegis-daily has committed today's
    # registry/picks so the ledger ingests them. Aegis-daily slots (post-close):
    # 16:15 / 18:30 / 21:00 IST. MON001 chases each with a ~30-45 min buffer to
    # let the [skip ci] auto-commit propagate to origin/main.
    - cron: "0 11 * * 1-5"    # ~16:30 IST primary (after aegis 16:15)
    - cron: "15 13 * * 1-5"   # ~18:45 IST backup 1 (after aegis 18:30)
    - cron: "45 15 * * 1-5"   # ~21:15 IST backup 2 (after aegis 21:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mon001-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitoring deps (narrow subset)
        run: |
          python -m pip install --upgrade pip
          # Transitive dependencies of MON001 daily_runner:
          #   pyarrow      — feature_engine.load_panels() reads parquets
          #   scipy        — deflated-sharpe (validation.py)
          #   scikit-learn — HRP kernel (arjuna_v2.py) imported by any test
          #                    subprocess spawned by test_regression.py
          # (ENG003 fix + 2026-07-15 CI-failure follow-up.)
          pip install pyyaml pandas numpy pyarrow scipy scikit-learn

      - name: Guard — MON001 already ran today (manual dispatch bypasses)
        id: guard
        run: |
          IST=$(TZ=Asia/Kolkata date +%F)
          echo "ist=$IST" >> "$GITHUB_OUTPUT"
          MARK="india/monitoring/MON001_Forward_Validation/reports/.mon001_published"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(cat "$MARK" 2>/dev/null)" = "$IST" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "MON001 already published for $IST — no-op."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running MON001 for $IST."
          fi

      - name: MON001 daily runner
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m india.monitoring.MON001_Forward_Validation.ops.daily_runner || \
            echo "daily_runner returned non-zero — capturing evidence anyway"
          mkdir -p india/monitoring/MON001_Forward_Validation/reports
          echo "${{ steps.guard.outputs.ist }}" > india/monitoring/MON001_Forward_Validation/reports/.mon001_published

      - name: Commit MON001 outputs
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "mon001-bot"
          git config user.email "mon001-bot@users.noreply.github.com"
          git add india/monitoring/MON001_Forward_Validation/ledger/ \
                  india/monitoring/MON001_Forward_Validation/reports/ || true
          git diff --cached --quiet || \
            git commit -m "MON001 daily: forward ledger + diagnostics + dashboard [skip ci]"
          git push || true
