name: AEGIS USA

# USA parallel deployment. Runs the 13-step USA pipeline on a schedule
# and on manual dispatch. Completely independent from India's aegis-daily.yml.
#
# 2026-08-14 · operator directive: "usa u can decide best time zone but
# before market starts only?"  Answer: PRE-MARKET so operator sees results
# during evening IST (convenient) instead of 2:30 AM IST (old post-market
# 20:30 UTC slot was 4:00 AM IST · inconvenient for review).
#
# Attempts (US pre-market): 12:00 · 12:30 · 13:00 UTC  (IST: 5:30 · 6:00 · 6:30 PM)
#   · 12:00 UTC = 08:00 EDT / 07:00 EST = 1.5h before 9:30 EDT open
#   · Uses YESTERDAY's close data (already in yfinance from prior 20:00 UTC close)
#   · Three slots handle GitHub's schedule flakiness (best-effort · often delayed)
#   · Manual dispatch always runs

on:
  schedule:
    - cron: "0 12 * * 1-5"    # 12:00 UTC = 5:30 PM IST · 8:00 AM EDT (primary)
    - cron: "30 12 * * 1-5"   # 12:30 UTC = 6:00 PM IST (backup 1)
    - cron: "0 13 * * 1-5"    # 13:00 UTC = 6:30 PM IST (backup 2)
  workflow_dispatch:
  # 2026-08-18 · TEMPORARY · fire on next main push to force a fresh CI-built
  # XLSX after the gujja330 account switch. REVERT this section in follow-up
  # commit once Telegram delivery confirmed.
  push:
    branches: [main]

# Wave Y · Constitution Article 45: concurrency block prevents overlapping runs.
concurrency:
  group: aegis-usa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  usa-pipeline:
    runs-on: ubuntu-latest
    # 2026-08-04: bumped 20 → 75 min. Universe grew to ~918 tickers
    # (S&P 500 + MidCap 400 per v3.0 Article 2) and orchestrator has 45
    # steps. 20 min was cancelling before recommendations.json got written,
    # producing "not appending since 2026-07-29" gap. Local wall-clock ~40
    # min · giving 75 min headroom for yfinance retries + macro fetch spikes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # openpyxl 2026-08-06 · required by rotation_outcome_tracker.detect_rotations_today
          # (reads XLSX via build_and_stamp_all → telegram_command_center_send)
          pip install pandas numpy pyarrow pyyaml yfinance scikit-learn openpyxl scipy

      - name: Run USA daily orchestrator
        # CEO cycle 4: pass Telegram secrets so usa/scripts/telegram_send.py
        # (STEPS[40]) actually delivers instead of silently no-op skipping.
        # Same TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets as India — one
        # bot serves both markets; sender emits USD-labelled USA content.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python usa/scripts/usa_daily.py

      - name: Run USA ops check
        run: python usa/scripts/usa_ops_check.py

      - name: Generate USA Runner 1 defensive orphans (Sprint H · release-blocker)
        # Belt-and-suspenders: build_and_stamp_all in the sender also runs
        # this, but we invoke it EXPLICITLY here so USA R1 is guaranteed
        # generated even if the sender step fails · operator directive
        # 2026-08-06 · "verify this happens on every scheduled run rather
        # than being a one-off"
        if: always()
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from datetime import date
          from backend.recommendation.usa_runner1 import derive as _r
          p = _r.derive(Path('.'), date.today().isoformat())
          if p.get('available'):
              _r.emit(Path('.'), p)
              print(f'[usa_runner1] emitted {p[\"n_r1_orphans\"]} defensive orphans')
          else:
              print(f'[usa_runner1] skipped · {p.get(\"reason\")}')
          "

      # 2026-08-25 · MANDATORY delivery-tests gate · mirrors India.
      - name: Delivery classifier tests (blocks Telegram if red)
        id: delivery_tests_usa
        if: always()
        continue-on-error: true
        run: python -m pytest tests/delivery/ -v --tb=short

      - name: Telegram Command Center (USA · cycle 6 · single crisp message)
        # Consumes usa/reports/recommendations.json enriched by cycles 3-4.
        # First USA-side Telegram delivery · matches India parity.
        # 2026-08-25 · gated on delivery_tests_usa outcome per product-grade fix.
        id: send_usa
        if: always() && steps.delivery_tests_usa.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true
        run: python scripts/telegram_command_center_send.py --market usa

      # 2026-08-25 · SILENT-RED-ALERT · operator directive:
      # "yesterday i havent received usa notification too. usa is completely
      # thrown away". USA CI had been failing silently for 4 days. This step
      # sends a plain-text Telegram alert whenever ANY earlier step failed
      # OR the delivery-tests gate blocked the send · so a silent red day
      # can never happen again.
      - name: USA CI failure Telegram alert
        if: always() && (failure() || steps.delivery_tests_usa.outcome != 'success' || steps.send_usa.outcome != 'success')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🇺🇸 AEGIS USA CI FAILED · run ${{ github.run_id }}%0A"
          MSG="$MSG · delivery_tests: ${{ steps.delivery_tests_usa.outcome || 'skipped' }}%0A"
          MSG="$MSG · send: ${{ steps.send_usa.outcome || 'skipped' }}%0A"
          MSG="$MSG · commit: ${{ github.sha }}%0A"
          MSG="$MSG · URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MSG" \
              -d "disable_web_page_preview=true" || true
            echo "[usa_ci_alert] sent"
          else
            echo "[usa_ci_alert] TELEGRAM secrets missing · alert skipped"
          fi

      - name: Upload USA morning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usa-morning-report
          path: |
            usa/reports/morning_latest.html
            usa/reports/morning_latest.md
          retention-days: 30

      - name: Summarise verdict
        if: always()
        run: |
          if [ -f usa/reports/ops_check.json ]; then
            VERDICT=$(python -c "import json; print(json.load(open('usa/reports/ops_check.json'))['verdict'])")
            echo "## AEGIS USA verdict: $VERDICT" >> $GITHUB_STEP_SUMMARY
            python -c "import json; d = json.load(open('usa/reports/ops_check.json')); print(f\"Artifacts: {d['artifacts']['n_present']}/{d['artifacts']['n_required']} present\"); print(f\"Schemas: {d['schemas']['n_pass']}/{d['schemas']['n_schemas']} pass\")" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit USA artifacts
        if: success()
        run: |
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add usa/reports/*.json usa/reports/*.md usa/reports/*.html usa/reports/*.jsonl 2>/dev/null || true
          # Unified daily XLSX (see aegis-daily.yml commit-back fix) · same
          # file appended by both markets · India workflow commits first · USA
          # commits after adding its rows. Without this, USA rows never reach
          # main and next-day CI loses them (same bug as India Aug-3 gap).
          git add reports/telegram/aegis_history.xlsx reports/telegram/aegis_daily_*.xlsx 2>/dev/null || true
          # 2026-08-20 · Sprint K Part 30 · Registry MUST persist across CI runs
          # or every fresh checkout treats every ticker as first-time NEW (bug).
          git add reports/research/opportunity_registry.jsonl 2>/dev/null || true
          git add reports/context/opportunity_violations.json reports/context/daily_opportunity_discovery.json 2>/dev/null || true
          # 2026-08-20 · commit per-market XLSX too · so local devs pulling
          # the repo get freshest India+USA delivered files (was Aug-14 stale).
          git add reports/telegram/aegis_history_india.xlsx reports/telegram/aegis_history_usa.xlsx 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AEGIS USA daily: refresh reports [skip ci]"
          git push || true

      # ═══════════════════════════════════════════════════════════════════════
      # Research post-processing (2026-08-11 · CEO final wiring)
      # After USA production run · rebuild P0 outcome dataset + P1 attribution
      # Non-blocking · never feeds back into runners automatically
      # ═══════════════════════════════════════════════════════════════════════
      - name: Research P0 · rebuild canonical Outcome Dataset (USA context)
        # ENG003 discipline: no `|| echo` mask. `continue-on-error: true` gives
        # non-blocking behavior; a real failure surfaces as a red step visibly.
        if: always()
        continue-on-error: true
        run: python scripts/build_outcome_dataset.py

      - name: Research P1 · rebuild Attribution Analysis (USA context)
        # ENG003 discipline: no `|| echo` mask. See P0 step rationale above.
        if: always()
        continue-on-error: true
        run: python scripts/run_attribution.py

      - name: Commit research post-processing outputs (USA)
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add reports/research/outcome_dataset.parquet reports/research/outcome_dataset_summary.json 2>/dev/null || true
          git add reports/research/attribution_analysis.json reports/research/attribution_report.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AEGIS research USA: refresh P0 + P1 [skip ci]"
          git push || true
