<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS · Investment Dashboard</title>
<style>
:root {
  --ink:       #080D18;
  --panel:     #0F1626;
  --panel-hi:  #141E33;
  --rule:      #233152;
  --rule-hi:   #3A4E7A;
  --paper:     #EDE7D6;
  --type-1:    #F2EDD9;
  --type-2:    #8E97AC;
  --type-3:    #4C566F;
  --accent:    #C4A055;
  --accent-hi: #E6C273;
  --pos:       #7BAF7F;
  --neg:       #C77A73;
  --warn:      #D9A85E;
  --info:      #5B7BB0;
}
:root[data-theme="light"] {
  --ink: #F7F3E9; --panel: #EFEADB; --panel-hi: #E4DEC9;
  --rule: #C7BEA1; --rule-hi: #8B7F5A;
  --paper: #0F1626;
  --type-1: #0A0F1C; --type-2: #4C566F; --type-3: #8A8C90;
  --accent: #8B6F2D; --accent-hi: #6E5620;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #F7F3E9; --panel: #EFEADB; --panel-hi: #E4DEC9;
    --rule: #C7BEA1; --rule-hi: #8B7F5A;
    --paper: #0F1626;
    --type-1: #0A0F1C; --type-2: #4C566F; --type-3: #8A8C90;
    --accent: #8B6F2D; --accent-hi: #6E5620;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ink);
  color: var(--type-1);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "Helvetica Neue", sans-serif;
  font-feature-settings: "kern" 1;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Top bar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  background: color-mix(in srgb, var(--panel) 80%, var(--ink));
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(6px);
  gap: 20px;
}
.topbar .brand {
  font-family: ui-serif, "Iowan Old Style", Baskerville, "Times New Roman", serif;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--type-1);
}
.topbar .brand .dot { color: var(--accent); }
.topbar .brand small {
  display: inline-block;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--type-2);
  margin-left: 12px;
  text-transform: uppercase;
}
.topbar .search {
  flex: 1;
  max-width: 420px;
  position: relative;
}
.topbar input {
  width: 100%;
  padding: 8px 14px 8px 32px;
  background: color-mix(in srgb, var(--panel-hi) 90%, transparent);
  border: 1px solid var(--rule);
  color: var(--type-1);
  border-radius: 4px;
  font: 13px -apple-system, sans-serif;
  outline: none;
}
.topbar input:focus { border-color: var(--accent); }
.topbar .search::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--type-3); font-size: 14px;
}
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.topbar button {
  background: transparent;
  color: var(--type-2);
  border: 1px solid var(--rule);
  padding: 6px 12px;
  font: 10px ui-monospace, monospace;
  letter-spacing: 0.12em;
  cursor: pointer;
  border-radius: 3px;
  transition: color 150ms;
}
.topbar button:hover { color: var(--accent-hi); border-color: var(--accent); }
.topbar .status {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.08em;
  text-align: right;
  min-width: 120px;
}
.topbar .status strong { color: var(--accent-hi); }

/* Main container */
main { padding: 24px 32px 48px; max-width: 1600px; margin: 0 auto; }

.section {
  margin-bottom: 32px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.section-head h2 {
  font-family: ui-serif, Baskerville, serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--type-1);
  letter-spacing: -0.01em;
}
.section-head .meta {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* KPI strip */
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.tile {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 14px 16px;
  min-width: 0;
  overflow: hidden;
}
.tile .label {
  font: 9px ui-monospace, monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--type-2);
  margin-bottom: 6px;
  display: block;
}
.tile .value {
  font-family: ui-serif, Baskerville, serif;
  font-size: 22px;
  color: var(--type-1);
  letter-spacing: -0.015em;
  line-height: 1.1;
}
.tile .value.mono { font-family: ui-monospace, monospace; font-size: 16px; letter-spacing: 0; }
.tile .value .unit { font: 10px ui-monospace, monospace; color: var(--type-3); margin-left: 4px; }
.tile .sub {
  font: 10px ui-monospace, monospace;
  color: var(--type-2);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.tile .sub.pos { color: var(--pos); }
.tile .sub.neg { color: var(--neg); }
.tile .sub.warn { color: var(--warn); }

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 18px 20px;
  margin-bottom: 20px;
  min-width: 0;
  overflow: hidden;
}
.card > h3 {
  font-family: ui-serif, Baskerville, serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--type-1);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 14px;
}
.card h3 .count {
  font: 11px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.08em;
  margin-left: 6px;
}

/* Grids */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }

/* Tables — the primary decision surface */
table.decision {
  width: 100%;
  border-collapse: collapse;
  font: 12px ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.scroll-x { overflow-x: auto; }
table.decision thead th {
  font-family: -apple-system, sans-serif;
  font-weight: 500;
  font-size: 10px;
  color: var(--type-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--rule-hi);
  background: color-mix(in srgb, var(--panel-hi) 60%, var(--panel));
  position: sticky; top: 0;
}
table.decision td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  vertical-align: middle;
}
table.decision tbody tr { cursor: pointer; transition: background 150ms; }
table.decision tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
table.decision tbody tr:last-child td { border-bottom: none; }
table.decision td.right { text-align: right; }
table.decision td.center { text-align: center; }
table.decision td.pos { color: var(--pos); }
table.decision td.neg { color: var(--neg); }
table.decision td.warn { color: var(--warn); }
table.decision td.mute { color: var(--type-3); }
table.decision td.ticker {
  color: var(--type-1);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
}
table.decision td.company {
  color: var(--type-2);
  font-family: -apple-system, sans-serif;
  font-size: 11px;
  font-weight: normal;
}
table.decision td.rank {
  color: var(--type-3);
  font-family: ui-serif, Baskerville, serif;
  font-size: 15px;
  width: 32px;
}

/* Pills / badges */
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 3px;
  font: 10px ui-monospace, monospace;
  letter-spacing: 0.06em;
  font-weight: 500;
  border: 1px solid transparent;
}
.pill.strong-buy { background: color-mix(in srgb, var(--pos) 18%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
.pill.buy       { background: color-mix(in srgb, var(--pos) 12%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 25%, transparent); }
.pill.accumulate{ background: color-mix(in srgb, var(--pos) 8%, transparent);  color: var(--pos); border-color: color-mix(in srgb, var(--pos) 20%, transparent); }
.pill.hold      { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.pill.watchlist { background: color-mix(in srgb, var(--info) 12%, transparent); color: var(--info); border-color: color-mix(in srgb, var(--info) 25%, transparent); }
.pill.reduce    { background: color-mix(in srgb, var(--neg) 10%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 25%, transparent); }
.pill.sell      { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
.pill.avoid     { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
.pill.regime-on  { background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 30%, transparent); }
.pill.regime-off { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 30%, transparent); }
.pill.regime-neu { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }

/* Score badge (0-100) */
.score {
  display: inline-block;
  min-width: 36px;
  padding: 3px 8px;
  border-radius: 3px;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.02em;
}
.score.hi  { background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos); }
.score.med { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.score.lo  { background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); }
.score.na  { color: var(--type-3); background: transparent; }

.arrow-up { color: var(--pos); }
.arrow-dn { color: var(--neg); }

/* Alerts */
.alert-list { list-style: none; padding: 0; margin: 0; }
.alert-list li {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}
.alert-list li:last-child { border-bottom: none; }
.alert-list .ticker-name {
  color: var(--type-1); font-family: ui-monospace, monospace; font-size: 12px;
}
.alert-list .detail {
  color: var(--type-2); font-size: 11px; flex: 1;
}
.alert-list .when {
  color: var(--type-3); font: 10px ui-monospace, monospace;
}

/* Validation Sheet — Bloomberg-style single-page per-ticker view */
.vs-sheet {
  max-width: 960px;
  margin: 0 auto;
  padding: 8px 0;
}
.vs-hero {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 20px;
  align-items: center;
  padding-bottom: 16px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--type-1);
}
.vs-ticker { font-family: ui-serif, Baskerville, serif; font-size: 42px; letter-spacing: -0.02em; color: var(--type-1); line-height: 1; }
.vs-sub    { color: var(--type-2); font-size: 13px; margin-top: 4px; font-family: ui-monospace, monospace; letter-spacing: 0.03em; }
.vs-score  { text-align: center; padding: 0 12px; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); }
.vs-score-n { font-family: ui-serif, Baskerville, serif; font-size: 44px; line-height: 1; letter-spacing: -0.02em; }
.vs-score-l { font: 8px ui-monospace, monospace; letter-spacing: 0.16em; color: var(--type-3); text-transform: uppercase; margin-top: 4px; }
.vs-score-stars { color: var(--warn); font-size: 16px; letter-spacing: 2px; margin-top: 4px; font-family: ui-monospace, monospace; }

.vs-section { margin-bottom: 24px; }
.vs-section h3 {
  font-family: ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--type-3);
  border-bottom: 1px solid var(--rule);
  padding-bottom: 6px;
  margin-bottom: 12px;
  font-weight: 600;
}
.vs-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
.vs-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 24px; }
.vs-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 3px 0;
  border-bottom: 1px dotted var(--rule);
}
.vs-row .k {
  font: 11px ui-monospace, monospace;
  color: var(--type-2);
  letter-spacing: 0.04em;
}
.vs-row .v {
  font: 11px ui-monospace, monospace;
  color: var(--type-1);
  font-weight: 500;
}
.vs-row .v.pos { color: var(--pos); }
.vs-row .v.neg { color: var(--neg); }
.vs-row .v.warn { color: var(--warn); }

.vs-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  border-radius: 2px;
  font: 8px ui-monospace, monospace;
  letter-spacing: 0.1em;
  vertical-align: middle;
  text-transform: uppercase;
}
.vs-tag.live  { color: var(--pos); border: 1px solid color-mix(in srgb, var(--pos) 40%, transparent); }
.vs-tag.bt    { color: var(--type-3); border: 1px solid var(--rule); }
.vs-tag.mixed { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.vs-tag.model { color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 40%, transparent); }

/* Archive maturity progress bar */
.maturity-card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 14px 18px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
}
.maturity-card .label {
  font: 9px ui-monospace, monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--type-3);
}
.maturity-card .stage {
  font-family: ui-serif, Baskerville, serif;
  font-size: 22px;
  color: var(--type-1);
  letter-spacing: -0.01em;
  line-height: 1;
  margin-top: 4px;
}
.maturity-card .progress {
  height: 8px;
  background: var(--rule);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}
.maturity-card .progress > .fill {
  height: 100%;
  background: linear-gradient(90deg,
    var(--accent) 0%,
    color-mix(in srgb, var(--accent-hi) 100%, transparent) 100%);
  transition: width 0.4s ease;
}
.maturity-card .rhs {
  text-align: right;
}
.maturity-card .rhs .n {
  font-family: ui-serif, Baskerville, serif;
  font-size: 22px;
  color: var(--type-1);
  letter-spacing: -0.01em;
  line-height: 1;
}
.maturity-card .rhs .n .unit {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  margin-left: 4px;
  letter-spacing: 0.06em;
}
.maturity-card .rhs .sub {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  margin-top: 4px;
  letter-spacing: 0.04em;
}

.vs-attrib-row {
  display: grid;
  grid-template-columns: 120px 1fr 50px;
  gap: 10px;
  align-items: center;
  padding: 4px 0;
}
.vs-attrib-row .k { font: 11px ui-monospace, monospace; color: var(--type-2); }
.vs-attrib-row .bar { height: 5px; background: var(--rule); border-radius: 2px; position: relative; }
.vs-attrib-row .bar > div { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; }
.vs-attrib-row .v { font: 11px ui-monospace, monospace; text-align: right; font-weight: 500; }

.vs-actions {
  display: flex; gap: 8px; align-items: center;
  padding-bottom: 16px; margin-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}
.vs-actions button, .vs-actions a {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--type-1);
  padding: 6px 12px;
  border-radius: 3px;
  font: 11px ui-monospace, monospace;
  letter-spacing: 0.06em;
  cursor: pointer;
  text-decoration: none;
}
.vs-actions button:hover, .vs-actions a:hover { border-color: var(--accent-hi); color: var(--accent-hi); }

/* Print — clean PDF export */
@media print {
  body { background: white !important; color: black !important; }
  .vs-sheet { max-width: 100%; padding: 0; }
  .vs-actions, #topbar, #tabbar, #brand-strip { display: none !important; }
  .vs-section h3 { color: #666 !important; }
  .vs-row { border-color: #ddd !important; }
  .vs-hero { border-color: #000 !important; }
}

/* Dates strip — Generated / Valid Until / Backtested Until / Last Updated */
.dates-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px 14px;
  margin-bottom: 20px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
}
.dates-strip .date-item {
  display: flex; flex-direction: column; gap: 2px;
  padding-right: 18px; border-right: 1px solid var(--rule);
}
.dates-strip .date-item:last-child { border-right: none; padding-right: 0; }
.dates-strip .date-item .k {
  font: 9px ui-monospace, monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--type-3);
}
.dates-strip .date-item .v {
  font-family: ui-monospace, monospace;
  color: var(--type-1);
  font-size: 12px;
  letter-spacing: 0.02em;
}

/* Filter chip bar + sort dropdown */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 12px 14px;
  margin-bottom: 16px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
}
.filter-bar .chip {
  padding: 6px 12px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  font: 11px ui-monospace, monospace;
  letter-spacing: 0.06em;
  color: var(--type-2);
  cursor: pointer;
  background: transparent;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  user-select: none;
}
.filter-bar .chip:hover { color: var(--type-1); border-color: var(--rule-hi); }
.filter-bar .chip.active {
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  border-color: var(--accent);
  color: var(--accent-hi);
}
.filter-bar .chip .n {
  color: var(--type-3);
  margin-left: 6px;
  font-size: 10px;
}
.filter-bar .chip.active .n { color: var(--accent-hi); opacity: 0.85; }
.filter-bar .sep { flex: 1; }
.filter-bar select {
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 6px 10px;
  color: var(--type-1);
  font: 11px ui-monospace, monospace;
  letter-spacing: 0.06em;
  cursor: pointer;
}

/* Decision Cards — one card per actionable stock */
.decision-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.decision-card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--rule);
  border-radius: 4px;
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.12s;
  min-width: 0;
  overflow: hidden;
}
.decision-card:hover { border-color: var(--rule-hi); transform: translateY(-1px); }
.decision-card.strong-buy { border-left-color: var(--pos); }
.decision-card.buy        { border-left-color: color-mix(in srgb, var(--pos) 70%, transparent); }
.decision-card.accumulate { border-left-color: color-mix(in srgb, var(--pos) 45%, transparent); }
.decision-card.hold       { border-left-color: var(--warn); }
.decision-card.reduce     { border-left-color: color-mix(in srgb, var(--neg) 70%, transparent); }
.decision-card.sell       { border-left-color: var(--neg); }

.dc-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; margin-bottom: 12px;
}
.dc-tick {
  font-family: ui-monospace, monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--type-1);
  letter-spacing: 0.03em;
}
.dc-sect { font-size: 10px; color: var(--type-3); letter-spacing: 0.05em; margin-top: 2px; }

.dc-price-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 10px 0 8px; border-bottom: 1px solid var(--rule);
}

<script>
// ==========================================================================
// State loading
// ==========================================================================
const REPORTS_BASE = new URL('../../../reports/', location.href).href;
const STATE = {};
async function fetchJson(name) {
  try {
    const r = await fetch(REPORTS_BASE + name, {cache: 'no-store'});
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
async function loadState() {
  const targets = [
    'recommendations.json',
    'portfolio.json',
    'global_context.json',
    'champion_strategy.json',
    'confidence_calibration.json',
    'validation_v2_latest.json',
    'risk_capital_v2_latest.json',
    'investment_intelligence.json',
    'intelligence_summary.json',
    'intelligence_conflicts.json',
    'intelligence_explanation.json',
    'graph_statistics.json',
    'community_clusters.json',
    'stress_scenarios.json',
    'recommendation_dna_feedback.json',
    'adaptive_rec_v2_signal.json',
    'adaptive_rec_v2_scoreboard.json',
    'adaptive_rec_v2_feature_importance.json',
    'backtest_summary.json',
    'challenger_scoreboard.json',
    'promotion_recommendation.json',
    'drift_report.json',
    'regime_comparison.json',
    'strategy_doctor.json',
    'decision_center_today.json',
    'decision_center_notifications.json',
    'stock_validation.json',
    'price_context.json',
    'recommendation_lifecycle.json',
    'missed_opportunities.json',
    'winner_genome.json',
    'recommendation_history.json',
    'decision_attribution.json',
    'benchmark.json',
    'backend_validation_summary.json',
    'market_intelligence_summary.json',
    'ai_market_narrative.json',
    'feature_store_summary.json',
    'ai_feature_narrative.json',
    'feature_intelligence_summary.json',
    'selected_features.json',
    'ai_feature_research.json',
    'ensemble.json',
    'model_metrics.json',
    'ai_model_narrative.json',
    'recommendations_v3_summary.json',
    'ai_recommendation_narrative.json',
    'risk_report.json',
    'sized_positions.json',
    'ai_risk_narrative.json',
    'portfolio_v3.json',
    'portfolio_diff.json',
    'ai_portfolio_narrative.json',
  ];
  const entries = await Promise.all(targets.map(async n => [n.replace(/\.json$/, ''), await fetchJson(n)]));
  for (const [k, v] of entries) STATE[k] = v;
  // Also try to load the daily ledger for the status indicator + Admin tab
  try {
    const r = await fetch(new URL('aegis_daily_v2_history.jsonl', REPORTS_BASE).href, {cache: 'no-store'});
    if (r.ok) {
      const text = await r.text();
      STATE.aegis_daily_v2_history_raw = text;
      const lines = text.trim().split('\n').filter(Boolean);
      STATE.__last_run = lines.length ? JSON.parse(lines[lines.length - 1]) : null;
    }
  } catch (e) {}
}

// ==========================================================================
// Formatters + helpers
// ==========================================================================
const fmt = {
  price: (v, digits=2) => v == null ? '—' : `₹${Number(v).toLocaleString('en-IN', {minimumFractionDigits: digits, maximumFractionDigits: digits})}`,
  pct:   (v, digits=1) => v == null ? '—' : (Math.abs(v) < 3 ? (v*100).toFixed(digits) + '%' : Number(v).toFixed(digits) + '%'),
  num:   (v, digits=2) => v == null ? '—' : Number(v).toFixed(digits),
  int:   (v) => v == null ? '—' : Number(v).toLocaleString('en-IN'),
  arrow: v => v == null ? '' : (v > 0.001 ? '▲' : v < -0.001 ? '▼' : ''),
};

function el(tag, opts = {}, ...children) {
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.id) e.id = opts.id;
  if (opts.text != null) e.textContent = opts.text;
  if (opts.html != null) e.innerHTML = opts.html;
  if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) e.setAttribute(k, v);
  if (opts.onclick) e.onclick = opts.onclick;
  for (const c of children) if (c) e.appendChild(c);
  return e;
}

// ── Investment Decision Score ─────────────────────────────────────
// ONE canonical score per recommendation. Blends whatever is available
// (intelligence, research composite, historical evidence, engine
// confidence) into a single 0-100 number. Missing components renormalise.
// This is what the investor sees. Everything else is Detail-view fodder.
function computeInvestmentDecisionScore(r) {
  const components = [];
  if (r.intelligence_score != null)            components.push({v: r.intelligence_score, w: 0.55});
  else if (r.score_raw != null)                components.push({v: r.score_raw, w: 0.55});

  if (r.historical_wr != null && r.n_historical >= 3) components.push({v: r.historical_wr * 100, w: 0.20});
  if (r.confidence != null)                    components.push({v: r.confidence * 100,  w: 0.15});
  if (r.reliability != null)                   components.push({v: (r.reliability / 5) * 100, w: 0.10});

  if (!components.length) return null;
  const totalW = components.reduce((s, c) => s + c.w, 0);
  const raw    = components.reduce((s, c) => s + c.v * c.w, 0) / totalW;
  return Math.max(0, Math.min(100, Math.round(raw)));
}

function starsForScore(score, max = 5) {
  if (score == null) return '☆'.repeat(max);
  const n = Math.max(0, Math.min(max, Math.round(score / (100 / max))));
  return '★'.repeat(n) + '☆'.repeat(max - n);
}

function scoreBadge(v) {
  if (v == null) return `<span class="score na">—</span>`;
  const cls = v >= 70 ? 'hi' : v >= 50 ? 'med' : 'lo';
  return `<span class="score ${cls}">${Math.round(v)}</span>`;
}
function pillFor(action) {
  const map = {
    'Strong-Buy':'strong-buy','Buy':'buy','Accumulate':'accumulate',
    'Hold':'hold','Watchlist':'watchlist','Reduce':'reduce',
    'Sell':'sell','Avoid':'avoid',
  };
  const cls = map[action] || 'hold';
  return `<span class="pill ${cls}">${action}</span>`;
}
function regimeLabel(gc) {
  if (!gc) return { text: 'Unknown', cls: 'regime-neu' };
  const c = (gc.classifications || {}).global_posture;
  const label = typeof c === 'string' ? c : (c && c.label) || 'Unknown';
  const clsMap = {'Risk-On':'regime-on','Neutral':'regime-neu','Risk-Off':'regime-off'};
  return { text: label, cls: clsMap[label] || 'regime-neu' };
}

// ==========================================================================
// Canonical recommendation list
// One list. Everything else references this. Enriches base recommendations
// with fusion score + intelligence dimensions when available.
// ==========================================================================
function buildCanonicalList() {
  const recs = (STATE.recommendations && STATE.recommendations.recommendations) || [];
  // Index intelligence reports by ticker
  const ii = (STATE.investment_intelligence && STATE.investment_intelligence.reports) || [];
  const iiByTicker = new Map();
  for (const r of ii) iiByTicker.set(String(r.ticker), r);

  // Index risk sizing by ticker
  const sizing = (STATE.risk_capital_v2_latest && STATE.risk_capital_v2_latest.sizing) || [];
  const sizeByTicker = new Map();
  for (const s of sizing) sizeByTicker.set(String(s.ticker), s);

  // Index per-ticker validation history + live price context
  const stockVal = (STATE.stock_validation && STATE.stock_validation.tickers) || {};
  const priceCtx = (STATE.price_context && STATE.price_context.tickers) || {};

  // Index Institutional Memory lifecycle by ticker (first-seen, state, days active)
  const lifecycleByTicker = (STATE.recommendation_lifecycle && STATE.recommendation_lifecycle.by_ticker) || {};
  // Winner Genome matches by ticker (Recommendation DNA v2.0)
  const winnerGenome = STATE.winner_genome || {};
  const wgMatchByTicker = winnerGenome.matches || {};
  // Decision Attribution v1.0 — per-ticker subsystem contribution
  const daByTicker = (STATE.decision_attribution && STATE.decision_attribution.per_recommendation) || {};
  // Continuous Benchmark v1.0 — per-ticker historical alpha vs NIFTY
  const bmByTicker = (STATE.benchmark && STATE.benchmark.per_ticker) || {};

  const enriched = recs.map(r => {
    const ii_r = iiByTicker.get(String(r.ticker));
    const size = sizeByTicker.get(String(r.ticker));
    const ee = r.entry_exit || {};
    const sv = stockVal[r.ticker] || null;
    const pc = priceCtx[r.ticker] || null;
    const lc = lifecycleByTicker[r.ticker] || null;
    const wg = wgMatchByTicker[r.ticker] || null;
    const da = daByTicker[r.ticker] || null;
    const bm = bmByTicker[r.ticker] || null;

    // CMP prefers the freshest live parquet price; falls back to backtester's latest_close.
    const cmp = (pc && pc.available && pc.cmp != null) ? pc.cmp : ee.latest_close;

    return {
      ticker: r.ticker,
      sector: r.sector,
      industry: r.industry,
      action: r.recommendation,
      score_raw: r.composite_decision_score,
      confidence: r.confidence,
      // Price levels — from entry_exit block
      entry_price: cmp,
      latest_close: ee.latest_close,
      buy_low: ee.ideal_entry_low,
      buy_high: ee.ideal_entry_high,
      target_1: ee.target_1,
      target_2: ee.target_2,
      stop_loss: ee.stop_loss,
      stop_loss_pct: ee.stop_loss_pct,
      expected_hold_days: ee.expected_holding_days,
      maximum_hold_days: ee.maximum_holding_days,
      annualised_vol_pct: ee.annualised_vol_pct,
      currently_held: r.currently_held,
      current_weight: r.current_weight,
      unrealised_pnl_pct: r.unrealised_pnl_pct,
      reasons_for: r.reasons_for || [],
      reasons_against: r.reasons_against || [],

      // Live price context (v1.0)
      cmp: cmp,
      previous_close:         pc ? pc.previous_close : null,
      day_change_pct:         pc ? pc.day_change_pct : null,
      high_52w:               pc ? pc.high_52w : null,
      low_52w:                pc ? pc.low_52w : null,
      distance_from_52w_high: pc ? pc.distance_from_52w_high : null,
      distance_from_52w_low:  pc ? pc.distance_from_52w_low : null,
      price_asof:             pc ? pc.latest_date : null,

      // Per-ticker validation rollup (v1.0)
      reliability:   sv ? sv.reliability_stars : null,
      historical_wr: sv ? sv.win_rate : null,
      n_historical:  sv ? sv.n_trades : null,
      avg_return_pct:  sv ? sv.avg_return_pct : null,
      avg_holding_d:   sv ? sv.avg_holding_days : null,

      // Institutional Memory lifecycle
      first_seen_date: lc ? lc.first_seen_date : null,
      days_active:     lc ? lc.days_active : null,
      lifecycle_state: lc ? lc.state : null,
      alpha_capture:   lc ? lc.alpha_capture : null,

      // Winner Genome v2.0 · Alpha Signature match
      wg_n_signatures:     wg ? wg.n_signatures_matched : 0,
      wg_signature_ids:    wg ? wg.signature_ids : [],
      wg_n_hist_winners:   wg ? wg.n_historical_winners : 0,
      wg_hist_success:     wg ? wg.historical_success : 0,
      wg_avg_lift:         wg ? wg.avg_signature_lift : 0,
      wg_best_avg_return:  wg ? wg.best_avg_return : 0,
      wg_plain_language:   wg ? wg.plain_language : null,

      // Decision Attribution v1.0 — per-subsystem contribution %
      da_contributions:    da ? da.contributions : null,
      da_raw_signals:      da ? da.raw_signals : null,
      da_decision_strength: da ? da.decision_strength : null,

      // Continuous Benchmark v1.0 — historical alpha vs NIFTY
      bm_n_trades:            bm ? bm.n_trades : 0,
      bm_aegis_avg_return:    bm ? bm.aegis_avg_return : null,
      bm_nifty_avg_return:    bm ? bm.nifty_avg_return : null,
      bm_sector_avg_return:   bm ? bm.sector_avg_return : null,
      bm_excess_alpha_avg:    bm ? bm.excess_alpha_avg : null,
      bm_pct_beat_nifty:      bm ? bm.pct_beat_nifty : null,
      bm_verdict:             bm ? bm.verdict : null,

      // From fusion (v2.1) — the canonical intelligence score
      intelligence_score: ii_r ? ii_r.intelligence_score : null,
      fusion_action: ii_r ? ii_r.fusion_decision : null,
      dimensions: ii_r ? ii_r.dimensions : null,
      why_this: ii_r ? ii_r.why_this : null,
      why_not_stronger: ii_r ? ii_r.why_not_stronger : null,
      conflicts: ii_r ? ii_r.conflicts : [],
      top_contributors: ii_r ? ii_r.top_contributors : [],

      // From risk sizing (v2.0)
      target_weight: size ? size.target_weight : null,
      sizing_verdict: size ? size.verdict : null,
      sizing_factors: size ? size.factors : null,
      sizing_counterfactuals: size ? size.counterfactuals : null,
    };
  });

  // Sort by canonical Investment Decision Score (falls back to intelligence / raw)
  enriched.sort((a, b) => {
    const av = computeInvestmentDecisionScore(a) ?? a.intelligence_score ?? a.score_raw ?? 0;
    const bv = computeInvestmentDecisionScore(b) ?? b.intelligence_score ?? b.score_raw ?? 0;
    return bv - av;
  });
  return enriched;
}

function upsideFor(r) {
  if (r.entry_price && r.target_1) {
    return (r.target_1 - r.entry_price) / r.entry_price;
  }
  return null;
}

// Humanize reason tokens like "company_score_top_decile:83.5" or "high_confidence:1.00"
const _REASON_LABELS = {
  company_score_top_decile:  'Company score in top decile',
  company_score_top_quartile:'Company score in top quartile',
  high_confidence:           'High engine confidence',
  industry_strong:           'Industry regime strong',
  industry_bullish:          'Industry regime bullish',
  sector_strong:             'Sector regime strong',
  sector_bullish:            'Sector regime bullish',
  global_bullish:            'Global posture bullish',
  positive_momentum:         'Positive price momentum',
  trend_up:                  'Uptrend intact',
  earnings_growth:           'Earnings growth on track',
  strong_fundamentals:       'Fundamentals rated strong',
  cheap_valuation:           'Valuation below peer median',
  liquidity_ok:              'Adequate trading liquidity',
  volatility_moderate:       'Volatility inside band',
  drawdown_manageable:       'Historical drawdown contained',
  low_reliability:           'Limited historical reliability',
  weak_win_rate:             'Historical win rate weak',
  crowded_trade:             'Crowded positioning risk',
  overbought:                'Approaching overbought zone',
  breakout_pending:          'Breakout not yet confirmed',
  low_confidence:            'Engine confidence low',
  sector_weak:               'Sector regime weak',
  industry_weak:             'Industry regime weak',
  global_bearish:            'Global posture bearish',
};

function humanizeReason(tok) {
  if (!tok) return '';
  const [rawK, rawV] = String(tok).split(':');
  const key = rawK.trim();
  const label = _REASON_LABELS[key];
  if (label) {
    if (rawV != null && rawV !== '') {
      // Extract numeric part if it's a value; otherwise pass through
      const n = parseFloat(rawV);
      if (!isNaN(n)) return `${label} (${n.toFixed(n < 10 ? 2 : 1)})`;
      return `${label} — ${rawV}`;
    }
    return label;
  }
  // Fallback: prettify the raw token
  const pretty = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  return rawV != null && rawV !== '' ? `${pretty} — ${rawV}` : pretty;
}

// Dashboard filter/sort state — persisted across renders on a single page load

function datesStrip() {
  const wrap = el('div', {class: 'dates-strip'});
  const rec = STATE.recommendations;
  const dc  = STATE.decision_center_today;
  const val = STATE.validation_v2_latest;
  const pc  = STATE.price_context;

  const gen = rec && rec.run_utc;
  // Valid until = next scheduled morning run. Backend runs 06:00 IST daily.
  // From `Generated`, valid until the same/next 06:00 IST.
  const validUntil = (() => {
    if (!gen) return null;
    const g = new Date(gen);
    const next = new Date(g); next.setDate(next.getDate() + 1);
    next.setUTCHours(0, 30, 0, 0);  // 06:00 IST = 00:30 UTC
    return next;
  })();
  // Backtested until = latest date in per-ticker validation
  const bt = val && (val.backtested_until || val.as_of || val.run_utc);
  const lastUpd = pc && pc.run_utc || gen;

  const fmtDate = (d) => {
    if (!d) return '—';
    const dt = typeof d === 'string' ? new Date(d) : d;
    if (isNaN(dt)) return '—';
    return dt.toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
  };
  const fmtDateTime = (d) => {
    if (!d) return '—';
    const dt = typeof d === 'string' ? new Date(d) : d;
    if (isNaN(dt)) return '—';
    return dt.toLocaleString(undefined, {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  };

  const items = [
    {k: 'Generated',        v: fmtDateTime(gen)},
    {k: 'Valid Until',      v: fmtDateTime(validUntil) + ' IST run'},
    {k: 'Backtested Until', v: fmtDate(bt)},
    {k: 'Last Updated',     v: fmtDateTime(lastUpd)},
  ];
  items.forEach(it => {
    wrap.appendChild(el('div', {class: 'date-item', html: `
      <span class="k">${it.k}</span>
      <span class="v">${it.v}</span>`}));
  });
  return wrap;
}
function riskRewardFor(r) {
  if (r.entry_price && r.target_1 && r.stop_loss) {
    const up = r.target_1 - r.entry_price;
    const dn = r.entry_price - r.stop_loss;
    if (dn > 0) return up / dn;
  }
  return null;
}
function dimScore(r, name) {
  if (!r.dimensions) return null;
  const d = r.dimensions.find(x => x.name === name);
  return d ? d.score : null;
}

    const clsMap = {
      'Strong-Buy': 'strong-buy', 'Buy': 'buy', 'Accumulate': 'accumulate',
      'Hold': 'hold', 'Watchlist': 'watchlist',
      'Reduce': 'reduce', 'Sell': 'sell', 'Avoid': 'avoid',
    };
    actionOrder.forEach(action => {
      const n = actionCounts[action] || 0;
      if (n === 0) return;
      const yesterdayN = (dc.action_counts_yesterday || {})[action];
      let delta = '';
      if (yesterdayN != null && !dc.first_run) {
        const d = n - yesterdayN;
        if (d !== 0) {
          const cls = d > 0 ? 'pos' : 'neg';
          delta = `<div class="sub ${cls}">${d > 0 ? '+' : ''}${d} vs yesterday</div>`;
        } else {
          delta = `<div class="sub">unchanged</div>`;

      <th>Yesterday</th><th>Today</th>
      <th>Reason</th>
      <th class="center">Intel</th>
    </tr></thead>`;
    const tbody = el('tbody');
    // Prioritise: NEW / UPGRADED / TARGET_HIT / STOP_HIT / DOWNGRADED then others

                              'INTELLIGENCE_DOWN', 'CONFIDENCE_UP', 'CONFIDENCE_DOWN',

    }

  const exitWrap = el('div');

  // Watchlist

  if (dc.notifications && dc.notifications.length) {

// ── Card-level dates from recommendations.json run_utc + expected hold days
function cardDates(r) {
  const genISO = STATE.recommendations && STATE.recommendations.run_utc;
  const gen = genISO ? new Date(genISO) : null;
  // Valid Until = next scheduled 06:00 IST run (00:30 UTC)
  const validUntil = gen ? (() => {
    const v = new Date(gen); v.setDate(v.getDate() + 1);
    v.setUTCHours(0, 30, 0, 0);
    return v;
  })() : null;

  // Recommendation Age from IM's first_seen_date
  let ageDays = null;
  if (r.first_seen_date && genISO) {
    try {
      const fs = new Date(r.first_seen_date);
      const now = new Date(genISO);
      ageDays = Math.max(0, Math.round((now - fs) / (1000 * 60 * 60 * 24)));
    } catch (_) {}
  }
  return {
    generated:  gen  ? gen.toLocaleDateString(undefined, {day: 'numeric', month: 'short'})  : '—',
    valid_until: validUntil ? validUntil.toLocaleDateString(undefined, {day: 'numeric', month: 'short'}) : '—',
    age_days:   ageDays,
  };
}

    <div style="display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline;">
      <div style="color: var(--warn); font-size: 15px; letter-spacing: 1.5px; font-family: ui-monospace, monospace;">${stars}</div>
      <div style="font: 11px ui-monospace, monospace; color: var(--type-1); letter-spacing: 0.02em;">
        ${wr} success · ${n} rec${n !== 1 ? 's' : ''}
      </div>
      <div style="grid-column: 2; font: 10px ui-monospace, monospace; color: var(--type-3);">
        ${wins != null ? `${wins} winner${wins !== 1 ? 's' : ''} · ${losses} loser${losses !== 1 ? 's' : ''}` : ''}
        ${avgRet != null ? ` · avg <b style="color: ${avgRet > 0 ? 'var(--pos)' : 'var(--neg)'}">${(avgRet * 100).toFixed(1)}%</b>` : ''}
        ${avgHold != null ? ` · ~${Math.round(avgHold)}d hold` : ''}
      </div>
    </div>`;
}

// ── Top Contributors (top 3 subsystems from Decision Attribution)
function topContributorsBlock(r) {
  if (!r.da_contributions) return '';
  const contribs = r.da_contributions;
  const top = Object.keys(contribs)
    .map(k => ({k, v: contribs[k] || 0}))
    .filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v)
    .slice(0, 3);
  if (!top.length) return '';
  const rows = top.map(({k, v}) => `
    <div style="display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center;">
      <span style="font: 10px ui-monospace, monospace; color: var(--type-2); letter-spacing: 0.02em;">${DA_LABELS[k] || k}</span>
      <div style="height: 4px; background: var(--rule); border-radius: 2px; position: relative;">
        <div style="position: absolute; left: 0; top: 0; height: 100%; width: ${Math.min(100, v)}%; background: ${DA_COLORS[k]}; border-radius: 2px;"></div>
      </div>
      <span style="font: 10px ui-monospace, monospace; color: ${DA_COLORS[k]}; min-width: 30px; text-align: right;">${v.toFixed(0)}%</span>
    </div>`).join('');
  return `<div style="display: grid; gap: 5px;">${rows}</div>`;
}

// ── Top Reasons / Concerns — humanized language, not raw scores
function reasonsConcernsBlock(r) {
  const posReasons = (r.reasons_for || []).slice(0, 3).map(t => `<li>${humanizeReason(t)}</li>`).join('');
  const negReasons = (r.reasons_against || []).slice(0, 2).map(t => `<li>${humanizeReason(t)}</li>`).join('');
  return `
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;">
      <div>
        <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.12em; color: var(--pos); text-transform: uppercase; margin-bottom: 4px;">✔ Top Reasons</div>
        ${posReasons ? `<ul style="list-style: none; padding: 0; margin: 0; font-size: 11px; color: var(--type-1); line-height: 1.5;">${posReasons}</ul>` : '<div style="color: var(--type-3); font-size: 11px;">—</div>'}
      </div>
      <div>
        <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.12em; color: var(--warn); text-transform: uppercase; margin-bottom: 4px;">⚠ Concerns</div>
        ${negReasons ? `<ul style="list-style: none; padding: 0; margin: 0; font-size: 11px; color: var(--type-1); line-height: 1.5;">${negReasons}</ul>` : '<div style="color: var(--type-3); font-size: 11px;">none flagged</div>'}
      </div>
    </div>`;
}

function decisionCardHtml(r, i) {
  const upside = upsideFor(r);
  const dayCls  = r.day_change_pct == null ? '' : (r.day_change_pct > 0 ? 'pos' : r.day_change_pct < 0 ? 'neg' : '');
  const dayStr  = r.day_change_pct == null ? '' :
                    `${r.day_change_pct > 0 ? '+' : ''}${(r.day_change_pct * 100).toFixed(2)}%`;
  const bandPos = (r.cmp != null && r.high_52w && r.low_52w && r.high_52w > r.low_52w)
    ? Math.max(0, Math.min(100, ((r.cmp - r.low_52w) / (r.high_52w - r.low_52w)) * 100))
    : null;

  // ── THE canonical Investment Decision Score
  const ids = computeInvestmentDecisionScore(r);
  const idsColor = ids == null ? 'var(--type-3)' :
                     ids >= 75 ? 'var(--pos)' :
                     ids >= 55 ? 'var(--type-1)' :
                     ids >= 40 ? 'var(--warn)' : 'var(--neg)';
  const idsStars = starsForScore(ids);
  const posSize  = r.target_weight != null ? (r.target_weight * 100).toFixed(2) + '%' : '—';
  const dates = cardDates(r);

  // Institutional Memory badge: NEW (day 1) or D+n
  const lcBadge = (() => {
    if (r.days_active == null) return '';
    if (r.days_active <= 1) return `<span style="font: 9px ui-monospace,monospace; padding: 2px 6px; margin-left: 6px; background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos); border-radius: 2px; letter-spacing: 0.12em;">NEW</span>`;
    return `<span style="font: 9px ui-monospace,monospace; padding: 2px 6px; margin-left: 6px; color: var(--type-3); border: 1px solid var(--rule); border-radius: 2px; letter-spacing: 0.06em;">D+${r.days_active}</span>`;
  })();

  // Investor question hierarchy — every element answers one of the seven questions IN ORDER:
  //   Q1 Should I buy? · Q2 How much? · Q3 Where? · Q4 Where to exit? ·
  //   Q5 Can I trust it? · Q6 Why? · Q7 Historical evidence
  return `
    <!-- Q1: Should I buy? → Ticker + Action + Investment Decision Score -->
    <div class="dc-head">
      <div>
        <div class="dc-tick">${r.ticker}${lcBadge}</div>
        <div class="dc-sect">${r.sector || '—'}${r.industry ? ' · ' + r.industry : ''}</div>
      </div>
      <div style="text-align:right;">
        ${pillFor(r.action)}
        <div style="margin-top:4px; font:9px ui-monospace,monospace; color: var(--type-3); letter-spacing:0.08em;">#${i + 1}</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--rule);">
      <div style="text-align: center;">
        <div style="font-family: ui-serif, Baskerville, serif; font-size: 34px; line-height: 1; color: ${idsColor}; letter-spacing: -0.02em;">${ids != null ? ids : '—'}</div>
        <div style="font: 8px ui-monospace, monospace; letter-spacing: 0.16em; color: var(--type-3); text-transform: uppercase; margin-top: 2px;">Decision Score</div>
      </div>
      <div>
        <div style="color: var(--warn); font-size: 18px; letter-spacing: 3px; font-family: ui-monospace, monospace;">${idsStars}</div>
        <div style="font: 10px ui-monospace, monospace; color: var(--type-3); margin-top: 4px; letter-spacing: 0.02em;">
          ${ids != null ? (ids >= 75 ? 'High conviction' : ids >= 55 ? 'Moderate conviction' : ids >= 40 ? 'Cautious' : 'Low conviction') : '—'}
        </div>
      </div>
    </div>

    <!-- Q3: At what price? -->
    <div class="dc-price-row">
      <div class="dc-cmp">${fmt.price(r.cmp)}</div>
      <div class="dc-day ${dayCls}">${dayStr}</div>
      <div class="dc-yest">Yest ${fmt.price(r.previous_close)}</div>
    </div>

    <div class="dc-52w">
      52-Week Range
      <div class="bar">${bandPos != null ? `<div class="dot" style="left:${bandPos}%"></div>` : ''}</div>
      <span class="lo">Low ${fmt.price(r.low_52w)}</span>
      &nbsp;·&nbsp;
      <span class="hi">High ${fmt.price(r.high_52w)}</span>
      ${r.distance_from_52w_high != null ? ` &nbsp;·&nbsp; ${(r.distance_from_52w_high * 100).toFixed(1)}% from high` : ''}
    </div>

    <!-- Q3 + Q4 + Q2: Buy zone · Target · Stop · Hold + Position Size -->
    <div class="dc-levels">
      <div class="dc-lvl"><div class="lbl">Buy Zone</div><div class="val mono">${fmt.price(r.buy_low)}-${fmt.price(r.buy_high)}</div></div>
      <div class="dc-lvl"><div class="lbl">Target</div><div class="val pos">${fmt.price(r.target_1)}${upside != null ? ` <span style="opacity:0.75;font-size:10px">(${(upside * 100).toFixed(1)}%)</span>` : ''}</div></div>
      <div class="dc-lvl"><div class="lbl">Stop</div><div class="val neg">${fmt.price(r.stop_loss)}</div></div>
      <div class="dc-lvl"><div class="lbl">Hold · Size</div><div class="val mono">${r.expected_hold_days ? r.expected_hold_days + 'd' : '—'} · ${posSize}</div></div>
    </div>

    <!-- Q5: Can I trust this? → Historical Reliability -->
    <div style="padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);">
      <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.14em; color: var(--type-3); text-transform: uppercase; margin-bottom: 6px;">Historical Reliability</div>
      ${reliabilityBlock(r)}
    </div>

    <!-- Q6: Why? → Top Reasons + Concerns -->
    ${reasonsConcernsBlock(r)}

    <!-- Q7a: Alpha vs NIFTY (from Continuous Benchmark, historical closed trades) -->
    ${r.bm_n_trades > 0 && r.bm_excess_alpha_avg != null ? `
    <div style="margin-top: 10px; padding: 8px 10px; border: 1px solid ${r.bm_excess_alpha_avg > 0.02 ? 'color-mix(in srgb, var(--pos) 30%, transparent)' : r.bm_excess_alpha_avg < -0.02 ? 'color-mix(in srgb, var(--neg) 30%, transparent)' : 'var(--rule)'}; border-radius: 3px; background: ${r.bm_excess_alpha_avg > 0.02 ? 'color-mix(in srgb, var(--pos) 5%, transparent)' : r.bm_excess_alpha_avg < -0.02 ? 'color-mix(in srgb, var(--neg) 5%, transparent)' : 'transparent'};">
      <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--type-3); margin-bottom: 3px;">Alpha vs NIFTY <span class="vs-tag bt">Backtester</span></div>
      <div style="font-size: 11px; color: var(--type-1);">
        AEGIS <b style="color: ${r.bm_aegis_avg_return > 0 ? 'var(--pos)' : 'var(--neg)'}">${r.bm_aegis_avg_return > 0 ? '+' : ''}${(r.bm_aegis_avg_return * 100).toFixed(1)}%</b>
        · NIFTY <b>${r.bm_nifty_avg_return > 0 ? '+' : ''}${(r.bm_nifty_avg_return * 100).toFixed(1)}%</b>
        · α <b style="color: ${r.bm_excess_alpha_avg > 0 ? 'var(--pos)' : 'var(--neg)'}">${r.bm_excess_alpha_avg > 0 ? '+' : ''}${(r.bm_excess_alpha_avg * 100).toFixed(1)}%</b>
        <span style="color: var(--type-3); margin-left: 6px;">${r.bm_n_trades} trade${r.bm_n_trades !== 1 ? 's' : ''} · beat ${Math.round((r.bm_pct_beat_nifty || 0) * 100)}%</span>
      </div>
    </div>` : ''}

    <!-- Q7b: Historical evidence → Winner Genome (plain-language, never a #17) -->
    ${r.wg_n_signatures > 0 ? `
    <div style="margin-top: 10px; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 3px; background: color-mix(in srgb, var(--accent) 6%, transparent);">
      <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-hi); margin-bottom: 3px;">Winner Genome</div>
      <div style="font-size: 11px; color: var(--type-1);">Looks similar to <b>${r.wg_n_hist_winners}</b> historical winners · hist. avg <b style="color:var(--pos)">${(r.wg_best_avg_return * 100).toFixed(1)}%</b> · success <b>${(r.wg_hist_success * 100).toFixed(0)}%</b></div>
    </div>` : ''}

    <!-- Attribution: only top contributors (never raw engine scores) -->
    ${r.da_contributions ? `
    <div style="margin-top: 10px;">
      <div style="font: 9px ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--type-3); margin-bottom: 6px;">Top Contributors</div>
      ${topContributorsBlock(r)}
    </div>` : ''}

    <!-- Dates + Open Details / Sheet -->
    <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; font: 10px ui-monospace, monospace; color: var(--type-3); letter-spacing: 0.03em;">
      <span>Gen ${dates.generated} · Valid ${dates.valid_until}${dates.age_days != null ? ' · age ' + dates.age_days + 'd' : ''}</span>
      <span>
        <a href="#/sheet/${r.ticker}" onclick="event.stopPropagation()" style="color: var(--type-2); text-decoration: none; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 2px; margin-right: 6px;">📄 Sheet</a>
        <span style="color: var(--accent-hi);">Open Details →</span>
      </span>
    </div>`;
}

function todaysOpportunities(canonical) {
  const wrap = el('div', {class: 'section', id: 'opportunities-section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: `Investment Opportunities`}));

  // Count actionable for the header meta
  const actionableN = canonical.filter(r =>
    ['Strong-Buy','Buy','Accumulate'].includes(r.action)).length;
  head.appendChild(el('div', {class: 'meta',
    text: `${actionableN} actionable of ${canonical.length} · click a card for details`}));
  wrap.appendChild(head);

  // ── Filter chip bar (with live counts) + sort dropdown
  const bar = el('div', {class: 'filter-bar'});
  const filterCounts = {};
  OPP_FILTERS.forEach(f => { filterCounts[f.key] = canonical.filter(f.fn).length; });
  OPP_FILTERS.forEach(f => {
    const chip = el('button', {class: 'chip' + (DASH.filter === f.key ? ' active' : ''),
      html: `${f.label}<span class="n">${filterCounts[f.key]}</span>`});
    chip.onclick = () => { DASH.filter = f.key; renderDashboard(); };
    bar.appendChild(chip);
  });
  bar.appendChild(el('div', {class: 'sep'}));
  const sortSel = el('select', {title: 'Sort by'});
  OPP_SORTS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.key;
    opt.textContent = 'Sort · ' + s.label;
    if (DASH.sort === s.key) opt.selected = true;
    sortSel.appendChild(opt);
  });
  sortSel.onchange = () => { DASH.sort = sortSel.value; renderDashboard(); };
  bar.appendChild(sortSel);
  wrap.appendChild(bar);

  // ── Apply filter + sort
  const f  = OPP_FILTERS.find(x => x.key === DASH.filter) || OPP_FILTERS[0];
  const so = OPP_SORTS.find(x => x.key === DASH.sort) || OPP_SORTS[0];
  const filtered = canonical.filter(f.fn).slice().sort(so.cmp);

  if (!filtered.length) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'empty', text: `No stocks match "${f.label}" today.`}));
    wrap.appendChild(card);
    return wrap;
  }

  // ── Decision Card grid (top 12)
  const grid = el('div', {class: 'decision-grid'});
  const TOP = 12;
  filtered.slice(0, TOP).forEach((r, i) => {
    const cls = String(r.action || '').toLowerCase().replace(/[^a-z-]/g, '');
    const card = el('div', {class: 'decision-card ' + cls, html: decisionCardHtml(r, i)});
    card.onclick = () => location.hash = '#/stock/' + r.ticker;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  // ── Compact overflow table for the remainder
  if (filtered.length > TOP) {
    const tblCard = el('div', {class: 'card'});
    tblCard.appendChild(el('h3', {html:
      `More Opportunities <span class="count">${filtered.length - TOP} more</span>`}));
    const scrollWrap = el('div', {class: 'scroll-x'});
    const table = el('table', {class: 'decision'});
    table.innerHTML = `<thead><tr>
      <th>#</th><th>Ticker</th><th>Sector</th>
      <th class="center">Score</th>
      <th class="right">CMP</th>
      <th class="right">Day</th>
      <th class="right">Target</th>
      <th class="right">Upside</th>
      <th class="right">Stop</th>
      <th class="right">R:R</th>
      <th class="center">Reliability</th>
      <th class="center">Action</th>
    </tr></thead>`;
    const tbody = el('tbody');
    filtered.slice(TOP).forEach((r, i) => {
      const upside = upsideFor(r);
      const rr = riskRewardFor(r);
      const dayCls = r.day_change_pct == null ? '' : (r.day_change_pct > 0 ? 'pos' : 'neg');
      const dayStr = r.day_change_pct == null ? '—' :
                       `${r.day_change_pct > 0 ? '+' : ''}${(r.day_change_pct * 100).toFixed(2)}%`;
      const stars = r.reliability != null ? starsForScore((r.reliability / 5) * 100) : '☆☆☆☆☆';
      const ids = computeInvestmentDecisionScore(r);
      const tr = el('tr', {onclick: () => location.hash = '#/stock/' + r.ticker});
      tr.innerHTML = `
        <td class="rank">${TOP + i + 1}</td>
        <td class="ticker">${r.ticker}</td>
        <td class="company">${r.sector || '—'}</td>
        <td class="center">${scoreBadge(ids)}</td>
        <td class="right">${fmt.price(r.cmp)}</td>
        <td class="right ${dayCls}">${dayStr}</td>
        <td class="right">${fmt.price(r.target_1)}</td>
        <td class="right ${upside > 0 ? 'pos' : 'neg'}">${upside != null ? fmt.pct(upside, 1) : '—'}</td>
        <td class="right neg">${fmt.price(r.stop_loss)}</td>
        <td class="right">${rr != null ? fmt.num(rr, 2) : '—'}</td>
        <td class="center" style="color:var(--warn); letter-spacing:1px;">${stars}</td>
        <td class="center">${pillFor(r.action)}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scrollWrap.appendChild(table);
    tblCard.appendChild(scrollWrap);
    wrap.appendChild(tblCard);
  }

  return wrap;
}

// ── Archive Maturation counter — gates Alpha Signature v2.1
// Post-LOCK operational indicator. Surfaces "N/30 archived days" prominently
// so the operator can see when the archive is deep enough to unlock Alpha
// Signature (which mines the archive, not learning.parquet).
function archiveMaturityCard() {
  const lc = STATE.recommendation_lifecycle;
  const rh = STATE.recommendation_history;
  const days = (lc && lc.coverage && lc.coverage.n_days_archived)
             || (rh && rh.n_days_archived)
             || 0;
  const target = 30;
  const pct = Math.min(100, (days / target) * 100);
  const remaining = Math.max(0, target - days);
  const unlocked = days >= target;

  const stageText  = unlocked
    ? 'Alpha Signature v2.1 unlockable'
    : (days < 5   ? 'Baseline'
    : days < 15   ? 'Warming'
    : days < 25   ? 'Maturing'
                  : 'Nearly ready');

  const wrap = el('div', {class: 'maturity-card'});
  wrap.innerHTML = `
    <div>
      <div class="label">Institutional Memory · Archive Maturation</div>
      <div class="stage">${stageText}</div>
    </div>
    <div>
      <div class="progress"><div class="fill" style="width: ${pct}%;"></div></div>
      <div style="margin-top: 6px; display: flex; justify-content: space-between; font: 10px ui-monospace, monospace; color: var(--type-3); letter-spacing: 0.04em;">
        <span>Day 1 · 2026-07-18</span>
        <span>${Math.round(pct)}% · target ${target} live archive days</span>
        <span>Alpha Signature gate</span>
      </div>
    </div>
    <div class="rhs">
      <div class="n">${days}<span class="unit">/ ${target}</span></div>
      <div class="sub">
        ${unlocked
          ? '<span style="color: var(--pos)">✓ Ready to unlock</span>'
          : `${remaining} trading day${remaining !== 1 ? 's' : ''} remaining`}
      </div>
    </div>`;
  return wrap;
}

    <div class="sub">Champion track record</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Sharpe <span class="vs-tag bt">Backtester</span></span>
    <div class="value">${champ ? fmt.num(champ.sharpe, 2) : '—'}</div>
    <div class="sub">Champion strategy</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Max Drawdown <span class="vs-tag bt">Backtester</span></span>
    <div class="value">${champ ? fmt.num(champ.max_dd_pct, 1) : '—'}<span class="unit">%</span></div>
    <div class="sub">Historical worst case</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">CAGR <span class="vs-tag bt">Backtester</span></span>
    <div class="value">${champ ? fmt.pct(champ.cagr, 1) : '—'}</div>
    <div class="sub">Compound annual return</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">VaR 95% <span class="vs-tag model">Model</span></span>
    <div class="value">${risk ? fmt.pct(risk.var_95, 1) : '—'}</div>
    <div class="sub">Value at Risk</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Live Drift <span class="vs-tag ${drift && drift.flag !== 'insufficient_evidence' ? 'live' : 'mixed'}">${drift && drift.flag !== 'insufficient_evidence' ? 'Live' : 'Warming'}</span></span>
    <div class="value mono">${drift ? drift.flag : '—'}</div>
    <div class="sub">${drift ? `1st ${fmt.num(drift.first_half_sharpe, 2)} → 2nd ${fmt.num(drift.second_half_sharpe, 2)}` : 'insufficient evidence yet'}</div>`}));

  // Backend Data Foundation — Sprint 1
  const bv = STATE.backend_validation_summary;
  if (bv) {
    const vCls = bv.verdict === 'PASS' ? 'pos' : bv.verdict === 'WARNING' ? 'warn' : 'neg';
    const nPass = (bv.counts || {}).PASS || 0;
    const nTotal = bv.n_datasets || 0;
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Backend Data Foundation</span>
      <div class="value ${vCls}" style="font-size: 16px;">${bv.verdict || '—'}</div>
      <div class="sub">${nPass}/${nTotal} datasets · confidence ${(bv.confidence || 0).toFixed(2)}</div>`}));
  }

  // Market Intelligence — Sprint 2 (regime + composite health)
  const mi = STATE.market_intelligence_summary;
  if (mi) {
    const regime = (mi.regime || 'unknown').toLowerCase();
    const cls = regime === 'bull' ? 'pos' : (regime === 'bear' || regime === 'stress') ? 'neg' : 'warn';
    const cs = mi.composite_score != null ? mi.composite_score.toFixed(1) : '—';
    const sigCount = Object.keys(mi.signals || {}).length;
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Market Regime <span class="vs-tag live">Sprint 2</span></span>
      <div class="value ${cls}" style="font-size: 16px;">${(mi.regime_label || regime).slice(0, 24)}</div>
      <div class="sub">Health ${cs}/100 · ${sigCount} signals</div>`}));
  }

  // Feature Store — Sprint 2.5 (coverage + verdict)
  const fs = STATE.feature_store_summary;
  if (fs) {
    const v = fs.verdict || '—';
    const vCls = v === 'PASS' ? 'pos' : v === 'WARNING' ? 'warn' : 'neg';
    const nulls = fs.null_pct_overall != null ? (fs.null_pct_overall * 100).toFixed(1) : '—';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Feature Store <span class="vs-tag live">Sprint 2.5</span></span>
      <div class="value ${vCls}" style="font-size: 16px;">${v}</div>
      <div class="sub">${fs.n_rows || 0} tickers · ${fs.n_features || 0} features · ${nulls}% null</div>`}));
  }

  // Feature Intelligence — Sprint 2.6 (selected subset + drift verdict)
  const fi = STATE.feature_intelligence_summary;
  if (fi) {
    const gov = fi.governance_verdict || '—';
    const drift = fi.drift_verdict || '—';
    const cls = (gov === 'PASS' && (drift === 'PASS' || drift === 'NO_REFERENCE')) ? 'pos'
              : (drift === 'FAIL' || gov === 'FAIL') ? 'neg' : 'warn';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Feature Intelligence <span class="vs-tag live">Sprint 2.6</span></span>
      <div class="value ${cls}" style="font-size: 15px;">${fi.n_selected}/${fi.n_input} selected</div>
      <div class="sub">gov ${gov} · drift ${drift} · rationale ${fi.governance_coverage_rationale_pct || 0}%</div>`}));
  }

  // Model Factory — Sprint 2.7 (n models + ensemble top ticker)
  const ens = STATE.ensemble;
  if (ens) {
    const top = (ens.top_10 || [])[0];
    const topLabel = top ? `${top.ticker} @ ${top.ensemble_score.toFixed(3)}` : '—';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Model Ensemble <span class="vs-tag live">Sprint 2.7</span></span>
      <div class="value" style="font-size: 14px;">${ens.n_models} models</div>
      <div class="sub">${ens.strategy} · top: ${topLabel}</div>`}));
  }

  // Recommendation Intelligence v3 — Sprint 3 (BUY/SELL/HOLD distribution)
  const rv3 = STATE.recommendations_v3_summary;
  if (rv3) {
    const d = rv3.distribution || {};
    const buys = (d.STRONG_BUY || 0) + (d.BUY || 0);
    const sells = (d.STRONG_SELL || 0) + (d.SELL || 0);
    const cls = buys > sells * 1.3 ? 'pos' : sells > buys * 1.3 ? 'neg' : 'warn';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Recommendations v3 <span class="vs-tag live">Sprint 3</span></span>
      <div class="value ${cls}" style="font-size: 14px;">${buys}B · ${d.HOLD || 0}H · ${sells}S</div>
      <div class="sub">regime ${rv3.regime} · ${rv3.n_disagreement || 0} conflicts→HOLD</div>`}));
  }

  // Risk Engine — Sprint 4 (sized positions + gross exposure + verdict)
  const rr = STATE.risk_report;
  if (rr) {
    const v = rr.verdict || '—';
    const cls = v === 'PASS' ? 'pos' : v === 'WARNING' ? 'warn' : 'neg';
    const gross = ((rr.gross_exposure_pct || 0) * 100).toFixed(1);
    const cash = ((rr.cash_pct || 0) * 100).toFixed(1);
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Risk Engine <span class="vs-tag live">Sprint 4</span></span>
      <div class="value ${cls}" style="font-size: 14px;">${rr.n_positions || 0} sized · ${v}</div>
      <div class="sub">gross ${gross}% · cash ${cash}% · HHI ${(rr.hhi_concentration || 0).toFixed(3)}</div>`}));
  }

  // Portfolio Engine — Sprint 5 (N positions + turnover + rebalance actions)
  const pv3 = STATE.portfolio_v3;
  const pdf = STATE.portfolio_diff;
  if (pv3 && pv3.snapshot) {
    const s = pv3.snapshot;
    const t = pdf || {};
    const cash = ((s.cash_pct || 0) * 100).toFixed(1);
    const turnover = ((t.turnover_pct || 0) * 100).toFixed(1);
    const effn = (s.effective_n || 0).toFixed(1);
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Portfolio v3 <span class="vs-tag live">Sprint 5</span></span>
      <div class="value" style="font-size: 14px;">${s.n_positions || 0} names · effN ${effn}</div>
      <div class="sub">cash ${cash}% · turnover ${turnover}% · OPEN ${t.n_open || 0} · CLOSE ${t.n_close || 0}</div>`}));
  }

  // Prediction Accuracy — from Institutional Memory recommendation_history (global avg over per-ticker accuracy)
  const rh = STATE.recommendation_history;
  if (rh && rh.global_avg_accuracy != null) {
    const pa = rh.global_avg_accuracy;
    const paCls = pa >= 0.60 ? 'pos' : pa < 0.40 ? 'neg' : '';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Prediction Accuracy <span class="vs-tag bt">Backtester</span></span>
      <div class="value ${paCls}">${Math.round(pa * 100)}<span class="unit">%</span></div>
      <div class="sub">${rh.n_tickers_with_history} tickers · avg over per-stock accuracy</div>`}));
  }

  // Continuous Benchmark v1.0 — Alpha vs NIFTY (the primary KPI)
  const bm = STATE.benchmark;
  if (bm && bm.available && bm.portfolio) {
    const bp = bm.portfolio;
    const alphaBps = bp.excess_alpha_avg;
    const alphaCls = alphaBps == null ? '' : alphaBps > 0.02 ? 'pos' : alphaBps < -0.02 ? 'neg' : 'warn';
    const beatCls  = bp.pct_beat_nifty == null ? '' : bp.pct_beat_nifty >= 0.55 ? 'pos' : bp.pct_beat_nifty < 0.45 ? 'neg' : 'warn';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Alpha vs NIFTY <span class="vs-tag bt">Backtester</span></span>
      <div class="value ${alphaCls}">${alphaBps != null ? (alphaBps > 0 ? '+' : '') + (alphaBps * 100).toFixed(2) + '%' : '—'}</div>
      <div class="sub ${beatCls}">${bp.pct_beat_nifty != null ? Math.round(bp.pct_beat_nifty * 100) + '% of ' + bp.n_trades_benchmarked + ' trades beat NIFTY' : '—'} · ${bp.verdict || '—'}</div>`}));
  }

  // Alpha Capture Rate — from Institutional Memory v1.0
  const im = STATE.recommendation_lifecycle;
  if (im) {
    const ac = im.avg_alpha_capture;
    const acStr = ac != null ? `${(ac * 100).toFixed(0)}%` : '—';
    const acCls = ac == null ? '' : ac >= 1.0 ? 'pos' : ac >= 0.5 ? '' : 'neg';
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Alpha Capture Rate <span class="vs-tag live">Live</span></span>
      <div class="value ${acCls}">${acStr}</div>
      <div class="sub">${im.n_exited || 0} closed of ${im.n_total || 0} · ${im.coverage?.n_days_archived || 0} archived days</div>`}));
  }
  const mo = STATE.missed_opportunities;
  if (mo) {
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Missed Opportunities <span class="vs-tag live">Live</span></span>
      <div class="value">${mo.n_events || 0}<span class="unit">events</span></div>
      <div class="sub">${mo.n_days_scanned || 0} days scanned · &gt;${((mo.threshold_pct || 0) * 100).toFixed(0)}% forward return</div>`}));
  }
  // Winner Genome — Alpha Signature library health
  const wgSum = STATE.winner_genome;
  if (wgSum) {
    if (wgSum.mode === 'insufficient_data') {
      strip.appendChild(el('div', {class: 'tile', html: `
        <span class="label">Winner Genome <span class="vs-tag bt">Backtester</span></span>
        <div class="value mono" style="font-size: 14px;">warming up</div>
        <div class="sub">${wgSum.note || 'accumulating trade evidence'}</div>`}));
    } else {
      strip.appendChild(el('div', {class: 'tile', html: `
        <span class="label">Winner Genome <span class="vs-tag bt">Backtester</span></span>
        <div class="value">${wgSum.n_signatures || 0}<span class="unit">signatures</span></div>
        <div class="sub">${wgSum.n_top_decile || 0} historical winners &gt; ${((wgSum.top_decile_threshold || 0) * 100).toFixed(1)}% · ${wgSum.n_current_matched || 0} recs match today</div>`}));
    }
  }
  // Decision Attribution — top alpha creator today
  const da = STATE.decision_attribution;
  if (da) {
    const topCreator = (da.top_alpha_creators || [])[0];
    const topDestroyer = (da.top_alpha_destroyers || [])[0];
    strip.appendChild(el('div', {class: 'tile', html: `
      <span class="label">Alpha Creator <span class="vs-tag bt">Backtester</span></span>
      <div class="value pos" style="font-size: 16px;">${topCreator ? DA_LABELS[topCreator.subsystem] || topCreator.subsystem : '—'}</div>
      <div class="sub pos">${topCreator ? `+${(topCreator.alpha_created * 100).toFixed(1)}% α · lift ${topCreator.lift.toFixed(2)}` : 'unavailable'}</div>`}));
    if (topDestroyer) {
      strip.appendChild(el('div', {class: 'tile', html: `
        <span class="label">Alpha Destroyer <span class="vs-tag bt">Backtester</span></span>
        <div class="value neg" style="font-size: 16px;">${DA_LABELS[topDestroyer.subsystem] || topDestroyer.subsystem}</div>
        <div class="sub neg">${(topDestroyer.alpha_created * 100).toFixed(1)}% α · lift ${topDestroyer.lift.toFixed(2)}</div>`}));
    }
  }

  wrap.appendChild(strip);
  return wrap;
}

function todaysAlerts(canonical) {
  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: `Today's Alerts`}));
  wrap.appendChild(head);

  const alerts = [];

  // Critical fusion conflicts
  const criticals = (STATE.intelligence_conflicts && STATE.intelligence_conflicts.all_conflicts || [])
    .filter(c => c.severity === 'CRITICAL');
  criticals.slice(0, 10).forEach(c => alerts.push({
    kind: 'WARNING',
    ticker: c.ticker,
    detail: c.detail,
    cls: 'neg',
  }));

  // Portfolio-level risk block
  const risk = STATE.risk_capital_v2_latest && STATE.risk_capital_v2_latest.portfolio_risk;
  if (risk && risk.verdict === 'BLOCK') {
    alerts.push({kind: 'RISK BLOCK', ticker: 'PORTFOLIO', detail: `Portfolio risk verdict: BLOCK`, cls: 'neg'});
  } else if (risk && risk.verdict === 'WARNING') {
    alerts.push({kind: 'RISK WARN', ticker: 'PORTFOLIO', detail: `Portfolio vol ${fmt.pct(risk.portfolio_vol_annual, 1)} · ${risk.alerts?.length || 0} budget alerts`, cls: 'warn'});
  }

  // Position stop-loss proximity
  canonical.filter(r => r.currently_held && r.unrealised_pnl_pct != null && r.unrealised_pnl_pct < -0.05)
    .slice(0, 5).forEach(r => alerts.push({
      kind: 'DRAWDOWN',
      ticker: r.ticker,
      detail: `Down ${fmt.pct(r.unrealised_pnl_pct, 1)} · monitor stop-loss ${fmt.price(r.stop_loss)}`,
      cls: 'warn',
    }));

  // Target proximity — held positions near target
  canonical.filter(r => r.currently_held && r.unrealised_pnl_pct != null && r.unrealised_pnl_pct > 0.10)
    .slice(0, 5).forEach(r => alerts.push({
      kind: 'TARGET NEAR',
      ticker: r.ticker,
      detail: `Up ${fmt.pct(r.unrealised_pnl_pct, 1)} · target ${fmt.price(r.target_1)}`,
      cls: 'pos',
    }));

  const card = el('div', {class: 'card'});
  if (!alerts.length) {
    card.appendChild(el('div', {class: 'empty', text: 'No alerts today.'}));
    wrap.appendChild(card);
    return wrap;
  }
  const ul = el('ul', {class: 'alert-list'});
  alerts.slice(0, 20).forEach(a => {
    ul.innerHTML += `<li>
      <span class="pill ${a.cls === 'pos' ? 'buy' : a.cls === 'warn' ? 'hold' : 'sell'}">${a.kind}</span>
      <span class="ticker-name" onclick="location.hash='#/stock/${a.ticker}'; return false;" style="cursor:pointer;">${a.ticker}</span>
      <span class="detail">${a.detail}</span>
    </li>`;
  });
  card.appendChild(ul);
  wrap.appendChild(card);
  return wrap;
}

// Aggregates existing artifacts into a single view. No new backend engines.

// ==========================================================================
function renderValidationSheet(ticker) {

  const r = canonical.find(x => String(x.ticker) === String(ticker));

  if (!r) {
    main.appendChild(el('div', {class: 'empty',
      html: `No data for <strong>${ticker}</strong>. <a href="#/" style="color: var(--accent-hi)">← back to dashboard</a>`}));
    return;
  }

  const rh   = STATE.recommendation_history;
  const info = rh && rh.tickers && rh.tickers[r.ticker];
  const acc  = (info && info.accuracy) || {};
  const timeline = (info && info.timeline) || [];
  const closed   = (info && info.closed_trades) || [];
  const nArchive = (rh && rh.n_days_archived) || 0;

  const ids = computeInvestmentDecisionScore(r);
  const idsColor = ids == null ? 'var(--type-3)' :
                     ids >= 75 ? 'var(--pos)' :
                     ids >= 55 ? 'var(--type-1)' :
                     ids >= 40 ? 'var(--warn)' : 'var(--neg)';

  const upside = upsideFor(r);
  const rr     = riskRewardFor(r);

  // Data-source tagging helper
  const TAG_LIVE = '<span class="vs-tag live">Live</span>';
  const TAG_BT   = '<span class="vs-tag bt">Backtester</span>';

  const wrap = el('div', {class: 'vs-sheet'});

  // ── Action bar (print + back + open detail)
  const actions = el('div', {class: 'vs-actions'});
  actions.innerHTML = `
    <a href="#/" style="margin-right: auto;">← Dashboard</a>
    <a href="#/stock/${r.ticker}">Full Detail →</a>
    <button onclick="window.print()">📄 Print / Save as PDF</button>`;
  wrap.appendChild(actions);

  // ── Hero header
  const hero = el('div', {class: 'vs-hero'});
  hero.innerHTML = `
    <div>
      <div class="vs-ticker">${r.ticker}</div>
      <div class="vs-sub">${r.sector || '—'}${r.industry ? ' · ' + r.industry : ''}</div>
      <div style="margin-top: 6px;">${pillFor(r.action)}</div>
    </div>
    <div class="vs-score">
      <div class="vs-score-n" style="color: ${idsColor};">${ids != null ? ids : '—'}</div>
      <div class="vs-score-l">Decision Score</div>
      <div class="vs-score-stars">${starsForScore(ids)}</div>
    </div>
    <div style="text-align: right;">
      <div style="font: 10px ui-monospace, monospace; color: var(--type-3); letter-spacing: 0.1em;">GENERATED</div>
      <div style="font: 12px ui-monospace, monospace; color: var(--type-1);">${dates.generated}</div>
      <div style="font: 10px ui-monospace, monospace; color: var(--type-3); letter-spacing: 0.1em; margin-top: 6px;">VALID UNTIL</div>

    </div>`;
  wrap.appendChild(hero);

  const row = (k, v, cls, sub) => `

  // ── Section 1: Price & Levels

                    `${r.day_change_pct > 0 ? '+' : ''}${(r.day_change_pct * 100).toFixed(2)}%`;
  const dayCls  = r.day_change_pct == null ? '' : (r.day_change_pct > 0 ? 'pos' : 'neg');
  priceSection.innerHTML = `

        ${row('52W High',       fmt.price(r.high_52w))}
        ${row('52W Low',        fmt.price(r.low_52w))}
      </div>
      <div>
        ${row('Buy Zone',       fmt.price(r.buy_low) + ' – ' + fmt.price(r.buy_high))}
        ${row('Target',         fmt.price(r.target_1), 'pos', upside != null ? '+' + (upside * 100).toFixed(1) + '%' : '')}
        ${row('Stop Loss',      fmt.price(r.stop_loss), 'neg')}
        ${row('R : R',          rr != null ? rr.toFixed(2) : '—')}
        ${row('Expected Hold',  r.expected_hold_days ? r.expected_hold_days + ' days' : '—')}
      </div>
    </div>`;
  wrap.appendChild(priceSection);

  // ── Section 2: Historical Reliability (BACKTESTER — 1060 trades from learning.parquet)
  const relSection = el('div', {class: 'vs-section'});
  const relStars = r.reliability != null ? starsForScore((r.reliability / 5) * 100) : '☆☆☆☆☆';

// ── Recommendation Timeline (from Institutional Memory archive)
function sectionRecommendationTimeline(r) {
  const rh = STATE.recommendation_history;
  const info = rh && rh.tickers && rh.tickers[r.ticker];

  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Recommendation Timeline'}));
  head.appendChild(el('div', {class: 'meta',
    text: `What AEGIS said on each archived day · from Institutional Memory${info ? ' · ' + (info.timeline || []).length + ' entries' : ''}`}));
  wrap.appendChild(head);

  const card = el('div', {class: 'card'});

    card.appendChild(el('div', {class: 'empty',
      text: 'No archived days yet for this ticker. Timeline populates as daily runs accumulate.'}));
    wrap.appendChild(card);
    return wrap;
  }

  const scrollWrap = el('div', {class: 'scroll-x'});
  const tbl = el('table', {class: 'decision'});
  tbl.innerHTML = `<thead><tr>
    <th>Date</th>
    <th class="center">Recommendation</th>

    <th class="right">CMP</th>
    <th class="right">Target</th>
    <th class="right">Stop</th>

  for (const row of info.timeline.slice().reverse()) {   // newest first
    tbody.innerHTML += `<tr>
      <td class="mute">${row.date}</td>
      <td class="center">${row.action ? pillFor(row.action) : '<span class="mute">—</span>'}</td>
      <td class="right">${row.intel != null ? Math.round(row.intel) : '—'}</td>

  tbl.appendChild(tbody);
  scrollWrap.appendChild(tbl);
  card.appendChild(scrollWrap);
  wrap.appendChild(card);
  return wrap;
}
