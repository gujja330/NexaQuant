// ==========================================================================
// Stock-level Historical Validation sections
// ==========================================================================
function _stockValidation(ticker) {
  const sv = STATE.stock_validation;
  if (!sv || !sv.tickers) return null;
  return sv.tickers[ticker] || null;
}

function _starBadge(n) {
  const filled = '★'.repeat(n);
  const empty  = '☆'.repeat(5 - n);
  const cls = n >= 4 ? 'pos' : n >= 3 ? 'warn' : n > 0 ? 'neg' : 'mute';
  return `<span class="${cls}" style="letter-spacing: 0.1em; font-size: 18px;">${filled}${empty}</span>`;
}

function sectionValidationSummary(r) {
  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Historical Validation'}));
  head.appendChild(el('div', {class: 'meta', text: 'Has AEGIS recommended this before? Did it work?'}));
  wrap.appendChild(head);

  const v = _stockValidation(r.ticker);
  if (!v || v.n_trades === 0) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'empty',
      text: `No historical recommendations for ${r.ticker} in the learning corpus. ` +
             `This will be its first tracked trade.`}));
    wrap.appendChild(card);
    return wrap;
  }

  const strip = el('div', {class: 'strip'});
  const wrPct = (v.win_rate * 100).toFixed(0);
  const wrCls = v.win_rate >= 0.7 ? 'pos' : v.win_rate >= 0.5 ? 'warn' : 'neg';
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Reliability</span>
    <div style="line-height: 1.4;">${_starBadge(v.reliability_stars)}</div>
    <div class="sub">${v.reliability_stars}/5 · based on ${v.n_trades} historical trades</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Historical Win Rate</span>
    <div class="value ${wrCls}">${wrPct}<span class="unit">%</span></div>
    <div class="sub">${v.n_winners} winners · ${v.n_losers} losers</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Average Return</span>
    <div class="value ${v.avg_return_pct > 0 ? 'pos' : 'neg'}">${(v.avg_return_pct * 100).toFixed(2)}<span class="unit">%</span></div>
    <div class="sub">per trade · over ${v.n_trades} recommendations</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Average Holding</span>
    <div class="value">${v.avg_holding_days}<span class="unit">days</span></div>
    <div class="sub">typical trade duration</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Largest Gain</span>
    <div class="value pos">${(v.largest_gain_pct * 100).toFixed(1)}<span class="unit">%</span></div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Largest Loss</span>
    <div class="value neg">${(v.largest_loss_pct * 100).toFixed(1)}<span class="unit">%</span></div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Current Confidence</span>
    <div class="value">${v.current_confidence != null ? (v.current_confidence * 100).toFixed(0) + '%' : '—'}</div>
    <div class="sub">historical avg ${v.historical_confidence != null ? (v.historical_confidence * 100).toFixed(0) + '%' : '—'}</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">MFE (avg peak)</span>
    <div class="value pos">${(v.avg_mfe_pct * 100).toFixed(1)}<span class="unit">%</span></div>
    <div class="sub">avg MAE ${(v.avg_mae_pct * 100).toFixed(1)}%</div>`}));
  wrap.appendChild(strip);
  return wrap;

function sectionValidationTimeline(r) {
  const v = _stockValidation(r.ticker);
  if (!v || !v.trades || !v.trades.length) return el('span');

  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Recommendation Timeline'}));
  head.appendChild(el('div', {class: 'meta', text: `${v.trades.length} past · newest first`}));
  wrap.appendChild(head);

  const card = el('div', {class: 'card'});
  const scrollWrap = el('div', {class: 'scroll-x'});
  const table = el('table', {class: 'decision'});
  table.innerHTML = `<thead><tr>
    <th>Entry Date</th>
    <th>Exit Date</th>
    <th class="right">Return</th>
    <th class="right">Days Held</th>
    <th class="right">MFE Peak</th>
    <th class="right">MAE Low</th>
    <th class="center">Result</th>
    <th>Reason</th>
  </tr></thead>`;
  const tbody = el('tbody');
  const sorted = v.trades.slice().reverse();   // newest first
  for (const t of sorted) {

                                    : '<span class="pill sell">✖ LOSS</span>';

    tbody.innerHTML += `<tr>
      <td>${t.entry_date}</td>
      <td class="mute">${t.exit_date}</td>

      <td class="right pos">${(t.mfe_pct * 100).toFixed(1)}%</td>
      <td class="right neg">${(t.mae_pct * 100).toFixed(1)}%</td>

  card.appendChild(scrollWrap);
  wrap.appendChild(card);
  return wrap;

function sectionValidationFailures(r) {
  const v = _stockValidation(r.ticker);
  if (!v || !v.past_failures || !v.past_failures.length) return el('span');

  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Failure Analysis'}));
  head.appendChild(el('div', {class: 'meta', text: 'What went wrong before · are those conditions present today?'}));
  wrap.appendChild(head);

  const grid = el('div', {class: 'grid-2'});

  // Left: past failures list
  const failCard = el('div', {class: 'card'});
  failCard.appendChild(el('h3', {html: `Past Failures <span class="count">${v.past_failures.length}</span>`}));
  const ul = el('ul', {class: 'reason-list'});
  for (const f of v.past_failures.slice().reverse().slice(0, 6)) {
    const li = el('li');
    li.innerHTML = `<span class="pill sell">${(f.return_pct * 100).toFixed(2)}%</span>
                      <span class="ticker" style="margin-left: 8px;">${f.entry_date} → ${f.exit_date}</span>
                      <div style="color: var(--type-2); font-size: 12px; margin-top: 4px;">
                        ${f.failure_reason || 'Ordinary loser'}
                      </div>`;
    ul.appendChild(li);
  }
  failCard.appendChild(ul);
  grid.appendChild(failCard);

  // Right: current setup check
  const chk = v.current_setup_check || {};
  const chkCard = el('div', {class: 'card'});
  chkCard.appendChild(el('h3', {text: 'Current Setup vs Past Failures'}));
  if (!chk.recurrence_flags || !chk.recurrence_flags.length) {
    chkCard.appendChild(el('div', {style: 'padding: 12px 0;', html: `
      <span class="pill buy">${chk.verdict || 'NO KNOWN FAILURE PATTERNS'}</span>
      <div style="color: var(--type-2); font-size: 12px; margin-top: 8px;">
        The failure conditions that hurt this ticker before do not obviously
        apply to today's setup. Standard risk management applies.
      </div>`}));
  } else {
    for (const c of chk.recurrence_flags) {
      chkCard.innerHTML += `<div style="padding: 8px 0; border-bottom: 1px dashed var(--rule);">
        <div style="font: 10px ui-monospace, monospace; letter-spacing: 0.12em; color: var(--warn); text-transform: uppercase;">${c.past}</div>
        <div style="color: var(--type-1); font-size: 12px; margin-top: 4px;">${c.current}</div>
      </div>`;
    }
  }
  grid.appendChild(chkCard);

  wrap.appendChild(grid);
  return wrap;
}

function sectionExplainability(r) {
  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Explainability'}));
  wrap.appendChild(head);

  const grid = el('div', {class: 'grid-2'});

  // Why this + Why not stronger from fusion
  const positive = el('div', {class: 'card'});
  positive.appendChild(el('h3', {text: 'Why this recommendation?'}));
  const ul1 = el('ul', {class: 'reason-list'});
  const why = r.why_this || [];
  const humanName = {
    research: 'Market Research', historical: 'Historical Performance',
    validation: 'Live Validation', risk: 'Risk & Capital',
    portfolio_fit: 'Portfolio Fit', knowledge_graph: 'Knowledge Graph',
    dna: 'Recommendation DNA', calibration: 'Confidence Calibration',
    learning: 'Learning Coverage', explainability: 'Evidence Chain',
  };
  if (why.length) {
    for (const w of why) {
      const li = el('li');
      li.innerHTML = `<span class="dim">${humanName[w.name] || w.name} · ${Math.round(w.score)}</span><br>${w.why || ''}`;
      ul1.appendChild(li);
    }
  }
  if (r.reasons_for && r.reasons_for.length) {
    for (const rf of r.reasons_for.slice(0, 5)) {
      const li = el('li');
      li.innerHTML = `<span class="dim">SIGNAL</span> ${humanizeReason(rf)}`;
      ul1.appendChild(li);
    }
  }
  if (!ul1.children.length) ul1.appendChild(el('li', {text: 'No positive factors extracted.', class: 'empty'}));
  positive.appendChild(ul1);
  grid.appendChild(positive);

  // Why not stronger + reasons_against
  const negative = el('div', {class: 'card'});
  negative.appendChild(el('h3', {text: 'Why not stronger?'}));
  const ul2 = el('ul', {class: 'reason-list'});
  const notStronger = r.why_not_stronger || [];
  if (notStronger.length) {
    for (const w of notStronger) {
      const li = el('li');
      li.innerHTML = `<span class="dim" style="color: var(--neg);">${humanName[w.name] || w.name} · ${Math.round(w.score)}</span><br>${w.why || ''}`;
      ul2.appendChild(li);
    }
  }
  if (r.reasons_against && r.reasons_against.length) {
    for (const ra of r.reasons_against.slice(0, 5)) {
      const li = el('li');
      li.innerHTML = `<span class="dim" style="color: var(--neg);">RISK</span> ${humanizeReason(ra)}`;
      ul2.appendChild(li);
    }
  }
  if (!ul2.children.length) ul2.appendChild(el('li', {text: 'No negative factors flagged.', class: 'empty'}));
  negative.appendChild(ul2);
  grid.appendChild(negative);

  wrap.appendChild(grid);

  // Conflicts
  if (r.conflicts && r.conflicts.length) {
    const conflictCard = el('div', {class: 'card', style: 'margin-top: 20px;'});
    conflictCard.appendChild(el('h3', {html: `Conflicts detected<span class="count">${r.conflicts.length}</span>`}));
    const ul = el('ul', {class: 'reason-list'});
    for (const c of r.conflicts) {
      const cls = c.severity === 'CRITICAL' ? 'neg' : c.severity === 'MEDIUM' ? 'warn' : 'buy';
      const li = el('li');
      li.innerHTML = `<span class="pill ${cls === 'neg' ? 'sell' : cls === 'warn' ? 'hold' : 'watchlist'}">${c.severity}</span>
                      <strong style="color: var(--type-1); margin-left: 6px; font-family: ui-monospace, monospace; font-size: 11px;">${c.rule}</strong>
                      <div style="color: var(--type-2); margin-top: 4px;">${c.detail || ''}</div>`;
      ul.appendChild(li);
    }
    conflictCard.appendChild(ul);
    wrap.appendChild(conflictCard);
  }

  return wrap;
}

function currentRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  return h;
}

function renderRoute() {
  const path = currentRoute();
  // Toggle admin visual mode based on route
  if (path === '/admin' || path.startsWith('/admin/')) {
    document.body.setAttribute('data-mode', 'admin');
    document.getElementById('brandTag').textContent = 'Validation Lab · Admin';
  } else {
    document.body.setAttribute('data-mode', 'investor');
    document.getElementById('brandTag').textContent = 'Investment Dashboard';
  }
  // Highlight active tab
  document.querySelectorAll('#tabbar a').forEach(a => {
    const key = a.dataset.tab;
    const active = (key === '/admin' && path.startsWith('/admin'))
                 || (key === '/' && !path.startsWith('/admin'));
    a.classList.toggle('active', active);
  });

  if (path === '/admin') {
    renderAdminPage();
  } else if (path.startsWith('/sheet/')) {
    const ticker = decodeURIComponent(path.substring('/sheet/'.length));
    renderValidationSheet(ticker);
  } else if (path.startsWith('/stock/')) {
    const ticker = decodeURIComponent(path.substring('/stock/'.length));
    renderStockDetail(ticker);
  } else {
    renderDashboard();
  }
}

function adminTrustworthinessVerdict() {
  const isum = STATE.intelligence_summary;
  const dc = STATE.decision_center_today;
  const c = STATE.confidence_calibration;
  const v = STATE.validation_v2_latest;
  const dr = STATE.drift_report;

  const alerts = [];
  let score = 100;
  const criticals = ((isum && isum.conflict_summary) || {}).n_critical || 0;
  if (criticals > 0) { score -= Math.min(20, criticals); alerts.push({sev: 'HIGH', text: `${criticals} CRITICAL fusion conflicts (raw vs fusion disagreement)`}); }
  const rawEce = c && c.raw_metrics && c.raw_metrics.ece;
  if (rawEce && rawEce > 0.10) alerts.push({sev: 'INFO', text: `Raw confidence ECE ${rawEce.toFixed(3)} — rank-order label, not probability`});
  const driftFlag = v && v.metric_drift && v.metric_drift.flag;
  if (driftFlag === 'degrading') { score -= 15; alerts.push({sev: 'HIGH', text: 'Live prediction drift is DEGRADING'}); }
  else if (driftFlag === 'insufficient_evidence') alerts.push({sev: 'INFO', text: 'Live drift: insufficient closed trades yet'});
  const strategyDrift = dr && dr.metric_drift ? Object.values(dr.metric_drift) : [];
  const degrading = strategyDrift.filter(x => x.stability_flag === 'degrading').length;
  if (degrading > 0) { score -= Math.min(15, degrading * 3); alerts.push({sev: 'MEDIUM', text: `${degrading} strategies show 2nd-half degradation`}); }
  if (dc && dc.first_run) alerts.push({sev: 'INFO', text: 'Decision center · first day of tracking · diff kicks in tomorrow'});
  const dna = STATE.recommendation_dna_feedback;
  if (dna && dna.n_patterns) alerts.push({sev: 'OK', text: `${dna.n_patterns} DNA patterns · learning loop active`});

  score = Math.max(0, Math.min(100, score));
  const verdict = score >= 80 ? 'TRUSTWORTHY' : score >= 60 ? 'DEGRADED' : 'UNTRUSTWORTHY';
  const cls = score >= 80 ? 'pos' : score >= 60 ? 'warn' : 'neg';
  const pill = score >= 80 ? 'buy' : score >= 60 ? 'hold' : 'sell';

  const s = adminSection(`Model Trustworthiness Verdict`);
  const card = el('div', {class: 'card'});
  card.appendChild(el('div', {html: `
    <span class="label" style="font: 9px ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--type-2);">TRUSTWORTHINESS SCORE</span>
    <div style="font-family: ui-serif, Baskerville, serif; font-size: 32px; color: var(--type-1); margin-top: 6px;">
      <span class="pill ${pill}">${verdict}</span>
      <span class="${cls}" style="margin-left: 12px;">${score}<span style="color: var(--type-3); font-size: 14px;">/100</span></span>
    </div>
    <div style="color: var(--type-3); font-size: 11px; margin-top: 8px; font-family: ui-monospace, monospace;">Aggregated from conflicts + drift + calibration + learning signals</div>`}));

  if (alerts.length) {
    const ul = el('div', {style: 'margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 12px;'});
    for (const a of alerts) {
      const p = a.sev === 'HIGH' ? 'sell' : a.sev === 'MEDIUM' ? 'hold' : a.sev === 'OK' ? 'buy' : 'watchlist';
      ul.appendChild(el('div', {style: 'padding: 6px 0; font-size: 12px;', html: `<span class="pill ${p}">${a.sev}</span> <span style="color: var(--type-2); margin-left: 8px;">${a.text}</span>`}));
    }
    card.appendChild(ul);
  }
  s.appendChild(card);
  return s;
}

function adminPipelineHealth() {
  const s = adminSection('1 · Daily Validation Summary');
  const raw = STATE.aegis_daily_v2_history_raw;
  if (!raw) {
    // Load ledger separately since loadState may not include it
    const target = el('div', {class: 'empty', text: 'Ledger not loaded. Refresh.'});
    s.appendChild(target);
    return s;
  }
  const lines = raw.trim().split('\n').filter(Boolean);
  const last = lines.length ? (() => { try { return JSON.parse(lines[lines.length - 1]); } catch { return null; }})() : null;
  if (!last) { s.appendChild(el('div', {class: 'empty', text: 'No pipeline runs yet.'})); return s; }
  const strip = el('div', {class: 'strip'});
  const overallCls = last.n_failure === 0 ? 'pos' : 'neg';
  strip.appendChild(adminTile('Pipeline Overall',
    last.n_failure === 0 ? '<span class="pill buy">PASS</span>' : '<span class="pill sell">FAIL</span>',
    overallCls,
    `${last.n_success}/${last.n_steps} steps · ${last.total_elapsed_s}s`));
  for (const r of last.results || []) {
    const cls = r.verdict === 'SUCCESS' ? 'pos' : r.verdict === 'SKIPPED_OPTIONAL' ? 'watchlist' : r.verdict === 'FAILURE' ? 'neg' : 'warn';
    const pill = r.verdict === 'SUCCESS' ? 'buy' : r.verdict === 'FAILURE' ? 'sell' : 'hold';
    strip.appendChild(adminTile(r.name, `<span class="pill ${pill}">${r.verdict}</span>`, cls, `${r.elapsed_s || 0}s`));
  }
  s.appendChild(strip);
  return s;
}

    <th class="right">Composite</th><th class="right">Sharpe</th>
    <th class="right">CAGR</th><th class="right">Max DD</th>
    <th class="right">Win rate</th><th>Status</th>
  </tr></thead>`;
  const tbody = el('tbody');
  for (const row of lb) {
    const isChamp = row.strategy === champStrat;
    const isBench = String(row.strategy || '').toUpperCase().includes('BENCHMARK');
    tbody.innerHTML += `<tr>
      <td class="rank">${row.rank}</td>
      <td class="ticker" style="color: ${isChamp ? 'var(--accent-hi)' : isBench ? 'var(--type-3)' : 'var(--type-1)'};">${row.strategy}</td>
      <td class="right">${fmt.num(row.composite_score, 2)}</td>
      <td class="right ${row.sharpe > 0 ? 'pos' : 'neg'}">${fmt.num(row.sharpe, 2)}</td>
      <td class="right ${row.cagr > 0 ? 'pos' : 'neg'}">${fmt.pct(row.cagr, 1)}</td>
      <td class="right neg">${fmt.num(row.max_dd_pct, 1)}%</td>
      <td class="right">${row.win_rate != null ? row.win_rate.toFixed(1) + '%' : '—'}</td>
      <td>${isChamp ? '<span class="pill buy">CHAMPION</span>' : isBench ? '<span class="pill hold">BENCHMARK</span>' : '<span class="pill watchlist">CHALLENGER</span>'}</td>
    </tr>`;
  }
  table.appendChild(tbody);
  card.appendChild(el('div', {class: 'scroll-x'}, table));
  s.appendChild(card);
  return s;
}

function adminCalibration() {
  const s = adminSection('4 · Confidence Calibration');
  const c = STATE.confidence_calibration;
  if (!c) { s.appendChild(el('div', {class: 'empty', text: 'Calibration not run.'})); return s; }
  const raw = (c.raw_metrics || {}).ece;
  const cal = (c.calibrated_metrics || {}).ece;
  const imp = raw && cal ? ((raw - cal) / raw * 100).toFixed(1) : '—';
  const strip = el('div', {class: 'strip'});
  strip.appendChild(adminTile('Raw ECE', fmt.num(raw, 3), 'warn'));
  strip.appendChild(adminTile('Calibrated ECE', fmt.num(cal, 4), 'pos'));
  strip.appendChild(adminTile('Improvement', imp + '%', 'pos', c.best_method || '—'));
  strip.appendChild(adminTile('Sample size', fmt.int(c.n_trades_total), '', 'trades'));
  strip.appendChild(adminTile('Method', c.best_method || '—', '', 'chosen by Brier score'));
  s.appendChild(strip);
  return s;
}

function adminPaperTrading() {
  const s = adminSection('5 · Live Paper Trading (Validation Harness)');
  const v = STATE.validation_v2_latest;
  if (!v) { s.appendChild(el('div', {class: 'empty', text: 'Harness not running.'})); return s; }
  const strip = el('div', {class: 'strip'});
  strip.appendChild(adminTile('Open Positions', fmt.int(v.n_open_positions), '', 'currently tracked'));
  strip.appendChild(adminTile('Closed Trades', fmt.int(v.n_closed_trades)));
  strip.appendChild(adminTile('New Opens', fmt.int(v.n_new_opens), 'pos'));
  strip.appendChild(adminTile('New Closes', fmt.int(v.n_new_closes), 'warn'));
  strip.appendChild(adminTile('Portfolio P/L', v.portfolio_pnl_pct ? (v.portfolio_pnl_pct * 100).toFixed(2) + '%' : '0.00%',
    v.portfolio_pnl_pct > 0 ? 'pos' : v.portfolio_pnl_pct < 0 ? 'neg' : ''));
  const rec = v.reconciliation || {};
  strip.appendChild(adminTile('Reconciled', fmt.int(rec.n), '',
    rec.within_5pp_tolerance === true ? 'within 5pp tolerance' : rec.within_5pp_tolerance === false ? 'divergent' : 'insufficient'));
  const oc = v.opportunity_cost || {};
  strip.appendChild(adminTile('Missed Winners', fmt.int(oc.n_missed_edges),
    (oc.n_missed_edges || 0) > 0 ? 'warn' : 'pos'));
  s.appendChild(strip);
  return s;
}

function adminDrift() {
  const s = adminSection('6 · Drift Monitoring');
  const v = STATE.validation_v2_latest;
  const dr = STATE.drift_report;
  const strip = el('div', {class: 'strip'});
  if (v && v.metric_drift) {
    const md = v.metric_drift;
    const pill = md.flag === 'stable' ? 'buy' : md.flag === 'improving' ? 'buy' : md.flag === 'degrading' ? 'sell' : 'hold';
    strip.appendChild(adminTile('Live Prediction Drift', `<span class="pill ${pill}">${(md.flag || '?').toUpperCase()}</span>`,
      md.flag === 'degrading' ? 'neg' : 'pos'));
  }
  if (dr && dr.metric_drift) {
    const strategies = Object.entries(dr.metric_drift || {});
    const degrading = strategies.filter(([_, v]) => v.stability_flag === 'degrading').length;
    strip.appendChild(adminTile('Strategy Drift',
      degrading > 0 ? `<span class="pill sell">${degrading} DEGRADING</span>` : '<span class="pill buy">STABLE</span>',
      degrading > 0 ? 'neg' : 'pos', `${strategies.length} strategies`));
  }
  const c = STATE.confidence_calibration;
  strip.appendChild(adminTile('Confidence Drift',
    c ? '<span class="pill buy">CALIBRATED</span>' : '<span class="pill hold">—</span>',
    c ? 'pos' : 'warn'));
  s.appendChild(strip);
  return s;
}

function adminRecommendationHistory() {
  const s = adminSection('7 · Overnight Recommendation Changes');
  const dc = STATE.decision_center_today;
  if (!dc) { s.appendChild(el('div', {class: 'empty', text: 'Decision center not run.'})); return s; }
  const counts = dc.counts_by_kind || {};
  const strip = el('div', {class: 'strip'});

  strip.appendChild(adminTile('Removed', fmt.int(counts.REMOVED || 0), (counts.REMOVED || 0) > 0 ? 'warn' : ''));
  strip.appendChild(adminTile('Upgraded', fmt.int(counts.UPGRADED || 0), 'pos'));
  strip.appendChild(adminTile('Downgraded', fmt.int(counts.DOWNGRADED || 0), 'neg'));
  strip.appendChild(adminTile('Target Hit', fmt.int(counts.TARGET_HIT || 0), 'pos'));
  strip.appendChild(adminTile('Stop Hit', fmt.int(counts.STOP_HIT || 0), 'neg'));
  strip.appendChild(adminTile('Intel Up', fmt.int(counts.INTELLIGENCE_UP || 0), 'pos'));
  strip.appendChild(adminTile('Intel Down', fmt.int(counts.INTELLIGENCE_DOWN || 0), 'neg'));
  s.appendChild(strip);
  return s;
}

function adminLearning() {
  const s = adminSection('8 · Learning & DNA');
  const dna = STATE.recommendation_dna_feedback;
  const doc = STATE.strategy_doctor;
  const strip = el('div', {class: 'strip'});
  if (dna) {
    strip.appendChild(adminTile('DNA Records', fmt.int(dna.n_dna_records), '', 'immutable'));
    strip.appendChild(adminTile('Patterns', fmt.int(dna.n_patterns), '', `${dna.n_with_evidence} with evidence`));
    strip.appendChild(adminTile('High-Prior', fmt.int(dna.n_high_prior), 'pos', 'wr ≥ 0.65'));
    strip.appendChild(adminTile('Low-Prior', fmt.int(dna.n_low_prior), 'neg', 'wr ≤ 0.35'));
  }
  if (doc && doc.diagnoses) {
    const byCat = {};
    for (const d of doc.diagnoses) byCat[d.category || 'unknown'] = (byCat[d.category || 'unknown'] || 0) + 1;
    const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    strip.appendChild(adminTile('Diagnoses', fmt.int(doc.diagnoses.length), 'warn'));
    strip.appendChild(adminTile('Top Failure', top ? top[0].replace(/_/g, ' ') : '—', 'neg', top ? `${top[1]} occurrences` : ''));
  }
  s.appendChild(strip);
  return s;
}

function adminFusionQuality() {
  const s = adminSection('9 · Fusion Quality');
  const isum = STATE.intelligence_summary;
  if (!isum) { s.appendChild(el('div', {class: 'empty', text: 'Fusion not run.'})); return s; }
  const cs = isum.conflict_summary || {};
  const strip = el('div', {class: 'strip'});
  strip.appendChild(adminTile('Avg Score', fmt.num(isum.avg_intelligence, 1), '', `${isum.n_scored} recs`));
  strip.appendChild(adminTile('CRITICAL Conflicts', fmt.int(cs.n_critical), (cs.n_critical || 0) > 0 ? 'neg' : 'pos'));
  strip.appendChild(adminTile('MEDIUM Conflicts', fmt.int(cs.n_medium), (cs.n_medium || 0) > 0 ? 'warn' : ''));
  strip.appendChild(adminTile('MINOR Conflicts', fmt.int(cs.n_minor)));
  const dist = isum.by_decision || {};
  for (const [d, n] of Object.entries(dist).sort((a, b) => b[1] - a[1])) {
    const cls = ['Strong-Buy', 'Buy', 'Accumulate'].includes(d) ? 'pos' : ['Reduce', 'Sell', 'Avoid'].includes(d) ? 'neg' : d === 'Hold' ? 'warn' : '';
    strip.appendChild(adminTile(`Decision · ${d}`, fmt.int(n), cls));
  }
  s.appendChild(strip);
  return s;
}

function adminFeatureImportance() {
  const s = adminSection('10 · Feature Importance (v2.0 Model)');
  const fi = STATE.adaptive_rec_v2_feature_importance;
  if (!fi) { s.appendChild(el('div', {class: 'empty', text: 'Not computed.'})); return s; }
  const top = (fi.feature_importance || []).slice(0, 12);
  if (!top.length) { s.appendChild(el('div', {class: 'empty', text: 'No data.'})); return s; }
  const card = el('div', {class: 'card'});
  const max = top[0].importance || 1;
  for (const f of top) {
    const w = (f.importance / max * 100).toFixed(1);
    card.appendChild(el('div', {style: 'display: grid; grid-template-columns: 220px 1fr 70px; align-items: center; gap: 12px; padding: 5px 0;', html: `
      <div style="color: var(--type-2); font: 11px ui-monospace, monospace;">${f.feature.slice(0, 30)}</div>
      <div class="bar"><div class="fill" style="width: ${w}%"></div></div>
      <div style="text-align: right; font: 11px ui-monospace, monospace; color: var(--type-1);">${fmt.num(f.importance, 3)}</div>`}));
  }
  s.appendChild(card);
  return s;
}

function adminKnowledgeGraphHealth() {
  const s = adminSection('11 · Knowledge Graph Health');
  const gs = STATE.graph_statistics && STATE.graph_statistics.graph_stats;
  const cc = STATE.community_clusters;
  const ss_ = STATE.stress_scenarios;
  const strip = el('div', {class: 'strip'});
  if (gs) {
    strip.appendChild(adminTile('Nodes', fmt.int(gs.n_nodes), '', `${gs.n_entity_types} types`));
    strip.appendChild(adminTile('Edges', fmt.int(gs.n_edges), '', `${gs.n_relation_types} relations`));
    strip.appendChild(adminTile('Avg Degree', fmt.num(gs.avg_degree, 2)));
  }
  if (cc) {
    const q = cc.modularity;
    strip.appendChild(adminTile('Communities', fmt.int(cc.count), '', `Q = ${fmt.num(q, 3)}`));
    strip.appendChild(adminTile('Modularity',
      `<span class="pill ${q >= 0.5 ? 'buy' : q >= 0.3 ? 'hold' : 'sell'}">${q >= 0.5 ? 'STRONG' : q >= 0.3 ? 'MODERATE' : 'WEAK'}</span>`,
      q >= 0.5 ? 'pos' : q >= 0.3 ? 'warn' : 'neg'));
  }
  if (ss_ && ss_.scenarios) {
    const worst = ss_.scenarios.reduce((a, b) => (b.portfolio_exposure || 0) > (a.portfolio_exposure || 0) ? b : a, {});
    strip.appendChild(adminTile('Worst Stress Exposure', fmt.pct(worst.portfolio_exposure, 1),
      (worst.portfolio_exposure || 0) > 0.8 ? 'neg' : (worst.portfolio_exposure || 0) > 0.3 ? 'warn' : 'pos',
      worst.scenario ? worst.scenario.replace(/_/g, ' ') : '—'));
  }
  s.appendChild(strip);
  return s;
}

// ==========================================================================
// Search — jump to stock detail on match
// ==========================================================================
function setupSearch() {
  const box = document.getElementById('searchBox');
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = box.value.trim().toUpperCase();
    if (!q) return;
    const canonical = buildCanonicalList();
    const match = canonical.find(r =>
      String(r.ticker).toUpperCase().includes(q) ||
      String(r.sector || '').toUpperCase().includes(q));
    if (match) {
      location.hash = '#/stock/' + match.ticker;
      box.value = '';
    }
  });
}

// ==========================================================================
// Pipeline status indicator
// ==========================================================================
function updatePipelineStatus() {
  const s = STATE.__last_run;
  const target = document.getElementById('pipelineStatus');
  if (!s) { target.textContent = 'pipeline: —'; return; }
  const succ = s.n_success || 0;
  const total = s.n_steps || 0;
  const failed = s.n_failure || 0;
  const cls = failed ? 'style="color: var(--neg);"' : 'style="color: var(--pos);"';
  target.innerHTML = `<span ${cls}>pipeline ${succ}/${total}</span>`;
}

// ==========================================================================
// Refresh + boot
// ==========================================================================
async function refreshAll() {
  const stamp = document.getElementById('lastRefresh');
  if (stamp) stamp.textContent = 'loading…';
  await loadState();
  renderRoute();
  updatePipelineStatus();
  if (stamp) stamp.textContent = new Date().toLocaleTimeString();
}

(async function boot() {
  // Theme
  const themeBtn = document.getElementById('themeToggle');
  const stored = localStorage.getItem('aegis-dashboard-theme');
  if (stored) document.documentElement.setAttribute('data-theme', stored);
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const media = matchMedia('(prefers-color-scheme: dark)').matches;
    const dark = cur ? cur === 'dark' : media;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('aegis-dashboard-theme', next);
  };

  // Manual refresh
  document.getElementById('refreshNow').onclick = () => refreshAll();

  // Auto-refresh every 60s (pause when hidden)
  const REFRESH_INTERVAL_MS = 60 * 1000;
  let autoTimer = null;
  const armTimer = () => {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    autoTimer = setInterval(refreshAll, REFRESH_INTERVAL_MS);
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
    else { armTimer(); refreshAll(); }
  });

  setupSearch();
  window.addEventListener('hashchange', renderRoute);

  await refreshAll();
  armTimer();
})();
</script>
