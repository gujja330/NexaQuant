<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS · Investment Dashboard</title>
<style>
:root {
  --ink:       #080D18;
  --panel:     #0F1626;
  --panel-hi:  #141E33;
  --rule:      #233152;
  --rule-hi:   #3A4E7A;
  --paper:     #EDE7D6;
  --type-1:    #F2EDD9;
  --type-2:    #8E97AC;
  --type-3:    #4C566F;
  --accent:    #C4A055;
  --accent-hi: #E6C273;
  --pos:       #7BAF7F;
  --neg:       #C77A73;
  --warn:      #D9A85E;
  --info:      #5B7BB0;
}
:root[data-theme="light"] {
  --ink: #F7F3E9; --panel: #EFEADB; --panel-hi: #E4DEC9;
  --rule: #C7BEA1; --rule-hi: #8B7F5A;
  --paper: #0F1626;
  --type-1: #0A0F1C; --type-2: #4C566F; --type-3: #8A8C90;
  --accent: #8B6F2D; --accent-hi: #6E5620;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #F7F3E9; --panel: #EFEADB; --panel-hi: #E4DEC9;
    --rule: #C7BEA1; --rule-hi: #8B7F5A;
    --paper: #0F1626;
    --type-1: #0A0F1C; --type-2: #4C566F; --type-3: #8A8C90;
    --accent: #8B6F2D; --accent-hi: #6E5620;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ink);
  color: var(--type-1);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "Helvetica Neue", sans-serif;
  font-feature-settings: "kern" 1;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Top bar */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  background: color-mix(in srgb, var(--panel) 80%, var(--ink));
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(6px);
  gap: 20px;
}
.topbar .brand {
  font-family: ui-serif, "Iowan Old Style", Baskerville, "Times New Roman", serif;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--type-1);
}
.topbar .brand .dot { color: var(--accent); }
.topbar .brand small {
  display: inline-block;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--type-2);
  margin-left: 12px;
  text-transform: uppercase;
}
.topbar .search {
  flex: 1;
  max-width: 420px;
  position: relative;
}
.topbar input {
  width: 100%;
  padding: 8px 14px 8px 32px;
  background: color-mix(in srgb, var(--panel-hi) 90%, transparent);
  border: 1px solid var(--rule);
  color: var(--type-1);
  border-radius: 4px;
  font: 13px -apple-system, sans-serif;
  outline: none;
}
.topbar input:focus { border-color: var(--accent); }
.topbar .search::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--type-3); font-size: 14px;
}
.topbar .actions { display: flex; gap: 8px; align-items: center; }
.topbar button {
  background: transparent;
  color: var(--type-2);
  border: 1px solid var(--rule);
  padding: 6px 12px;
  font: 10px ui-monospace, monospace;
  letter-spacing: 0.12em;
  cursor: pointer;
  border-radius: 3px;
  transition: color 150ms;
}
.topbar button:hover { color: var(--accent-hi); border-color: var(--accent); }
.topbar .status {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.08em;
  text-align: right;
  min-width: 120px;
}
.topbar .status strong { color: var(--accent-hi); }

/* Main container */
main { padding: 24px 32px 48px; max-width: 1600px; margin: 0 auto; }

.section {
  margin-bottom: 32px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.section-head h2 {
  font-family: ui-serif, Baskerville, serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--type-1);
  letter-spacing: -0.01em;
}
.section-head .meta {
  font: 10px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* KPI strip */
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.tile {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 14px 16px;
  min-width: 0;
  overflow: hidden;
}
.tile .label {
  font: 9px ui-monospace, monospace;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--type-2);
  margin-bottom: 6px;
  display: block;
}
.tile .value {
  font-family: ui-serif, Baskerville, serif;
  font-size: 22px;
  color: var(--type-1);
  letter-spacing: -0.015em;
  line-height: 1.1;
}
.tile .value.mono { font-family: ui-monospace, monospace; font-size: 16px; letter-spacing: 0; }
.tile .value .unit { font: 10px ui-monospace, monospace; color: var(--type-3); margin-left: 4px; }
.tile .sub {
  font: 10px ui-monospace, monospace;
  color: var(--type-2);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.tile .sub.pos { color: var(--pos); }
.tile .sub.neg { color: var(--neg); }
.tile .sub.warn { color: var(--warn); }

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 18px 20px;
  margin-bottom: 20px;
  min-width: 0;
  overflow: hidden;
}
.card > h3 {
  font-family: ui-serif, Baskerville, serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--type-1);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 14px;
}
.card h3 .count {
  font: 11px ui-monospace, monospace;
  color: var(--type-3);
  letter-spacing: 0.08em;
  margin-left: 6px;
}

/* Grids */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }

/* Tables — the primary decision surface */
table.decision {
  width: 100%;
  border-collapse: collapse;
  font: 12px ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.scroll-x { overflow-x: auto; }
table.decision thead th {
  font-family: -apple-system, sans-serif;
  font-weight: 500;
  font-size: 10px;
  color: var(--type-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--rule-hi);
  background: color-mix(in srgb, var(--panel-hi) 60%, var(--panel));
  position: sticky; top: 0;
}
table.decision td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  vertical-align: middle;
}
table.decision tbody tr { cursor: pointer; transition: background 150ms; }
table.decision tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
table.decision tbody tr:last-child td { border-bottom: none; }
table.decision td.right { text-align: right; }
table.decision td.center { text-align: center; }
table.decision td.pos { color: var(--pos); }
table.decision td.neg { color: var(--neg); }
table.decision td.warn { color: var(--warn); }
table.decision td.mute { color: var(--type-3); }
table.decision td.ticker {
  color: var(--type-1);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
}
table.decision td.company {
  color: var(--type-2);
  font-family: -apple-system, sans-serif;
  font-size: 11px;
  font-weight: normal;
}
table.decision td.rank {
  color: var(--type-3);
  font-family: ui-serif, Baskerville, serif;
  font-size: 15px;
  width: 32px;
}

/* Pills / badges */
.pill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 3px;
  font: 10px ui-monospace, monospace;
  letter-spacing: 0.06em;
  font-weight: 500;
  border: 1px solid transparent;
}
.pill.strong-buy { background: color-mix(in srgb, var(--pos) 18%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
.pill.buy       { background: color-mix(in srgb, var(--pos) 12%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 25%, transparent); }
.pill.accumulate{ background: color-mix(in srgb, var(--pos) 8%, transparent);  color: var(--pos); border-color: color-mix(in srgb, var(--pos) 20%, transparent); }
.pill.hold      { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.pill.watchlist { background: color-mix(in srgb, var(--info) 12%, transparent); color: var(--info); border-color: color-mix(in srgb, var(--info) 25%, transparent); }
.pill.reduce    { background: color-mix(in srgb, var(--neg) 10%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 25%, transparent); }
.pill.sell      { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
.pill.avoid     { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
.pill.regime-on  { background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos); border-color: color-mix(in srgb, var(--pos) 30%, transparent); }
.pill.regime-off { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); border-color: color-mix(in srgb, var(--neg) 30%, transparent); }
.pill.regime-neu { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }

/* Score badge (0-100) */
.score {
  display: inline-block;
  min-width: 36px;
  padding: 3px 8px;
  border-radius: 3px;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.02em;
}
.score.hi  { background: color-mix(in srgb, var(--pos) 15%, transparent); color: var(--pos); }
.score.med { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.score.lo  { background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); }
.score.na  { color: var(--type-3); background: transparent; }

.arrow-up { color: var(--pos); }
.arrow-dn { color: var(--neg); }

/* Alerts */
.alert-list { list-style: none; padding: 0; margin: 0; }
.alert-list li {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}
.alert-list li:last-child { border-bottom: none; }
.alert-list .ticker-name {
  color: var(--type-1); font-family: ui-monospace, monospace; font-size: 12px;
}
.alert-list .detail {
  color: var(--type-2); font-size: 11px; flex: 1;
}
.alert-list .when {
  color: var(--type-3); font: 10px ui-monospace, monospace;
}

/* Stock Detail page */
.detail-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: end;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--rule-hi);
}
.detail-title {
  font-family: ui-serif, Baskerville, serif;
  font-size: 32px;
  color: var(--type-1);
  letter-spacing: -0.02em;
  line-height: 1;
}
.detail-subtitle {
  color: var(--type-2);
  margin-top: 6px;
  font-size: 13px;
}
.detail-back {
  color: var(--accent-hi);
  text-decoration: none;
  font: 11px ui-monospace, monospace;
  letter-spacing: 0.14em;
}
.detail-back:hover { color: var(--accent); }

/* Explain (why buy) chips */
.why-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}
.why-chip {
  padding: 10px 12px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--panel-hi) 40%, var(--panel));
  border-radius: 3px;
}
.why-chip .name {
  font: 9px ui-monospace, monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--type-2);
  margin-bottom: 4px;
}
.why-chip .n {
  font-family: ui-serif, Baskerville, serif;
  font-size: 22px;
  color: var(--type-1);
  letter-spacing: -0.01em;
}

/* Reason lists */
.reason-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
.reason-list li { padding: 8px 0; border-bottom: 1px dashed var(--rule); color: var(--type-2); }
.reason-list li:last-child { border-bottom: none; }
.reason-list .dim {
  font: 10px ui-monospace, monospace;
  color: var(--accent-hi);
  margin-right: 6px;
  letter-spacing: 0.06em;
}

.empty { padding: 24px; text-align: center; color: var(--type-3); font-style: italic; }
.loading { padding: 16px; text-align: center; color: var(--type-3); font: 11px ui-monospace, monospace; letter-spacing: 0.14em; }

/* Sparkline */
svg.mini { display: block; width: 100%; height: 40px; }
svg.mini .line { fill: none; stroke: var(--accent); stroke-width: 1.2; }
svg.mini .area { fill: var(--accent); opacity: 0.1; }
</style>
</head>
<body>

<style>
/* Tab bar & admin mode overrides */
.tabbar {
  display: flex;
  gap: 4px;
  margin: 0 20px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--panel-hi) 60%, transparent);
  padding: 3px;
  border: 1px solid var(--rule);
}
.tabbar a {
  padding: 6px 14px;
  font: 11px ui-monospace, monospace;
  letter-spacing: 0.14em;
  color: var(--type-2);
  text-decoration: none;
  border-radius: 3px;
  transition: color 150ms, background 150ms;
}
.tabbar a:hover { color: var(--type-1); }
.tabbar a.active {
  background: color-mix(in srgb, var(--accent) 25%, transparent);
  color: var(--accent-hi);
}
/* Admin mode: switch accent from gold to institutional blue */
body[data-mode="admin"] {
  --accent: #58A6FF;
  --accent-hi: #79B8FF;
}
body[data-mode="admin"] .brand small { color: var(--accent-hi); }
body[data-mode="admin"] .search { display: none; }  /* search is investor-only */
</style>

<div class="topbar">
  <div class="brand">
    AEGIS<span class="dot">.</span>
    <small id="brandTag">Investment Dashboard</small>
  </div>
  <div class="tabbar" id="tabbar">
    <a href="#/" data-tab="/" class="active">DASHBOARD</a>
    <a href="#/admin" data-tab="/admin">VALIDATION LAB</a>
  </div>
  <div class="search">
    <input id="searchBox" type="search" placeholder="Search ticker or company…" autocomplete="off">
  </div>
  <div class="actions">
    <div class="status">
      <div>Updated <strong id="lastRefresh">—</strong></div>
      <div id="pipelineStatus" style="margin-top: 2px;">—</div>
    </div>
    <button id="refreshNow" type="button" title="Refresh now">↻</button>
    <button id="themeToggle" type="button" title="Toggle theme">◐</button>
  </div>
</div>

<main id="main"><div class="loading">Loading AEGIS state…</div></main>

<script>
// ==========================================================================
// State loading
// ==========================================================================
const REPORTS_BASE = new URL('../../../reports/', location.href).href;
const STATE = {};
async function fetchJson(name) {
  try {
    const r = await fetch(REPORTS_BASE + name, {cache: 'no-store'});
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
async function loadState() {
  const targets = [
    'recommendations.json',
    'portfolio.json',
    'global_context.json',
    'champion_strategy.json',
    'confidence_calibration.json',
    'validation_v2_latest.json',
    'risk_capital_v2_latest.json',
    'investment_intelligence.json',
    'intelligence_summary.json',
    'intelligence_conflicts.json',
    'intelligence_explanation.json',
    'graph_statistics.json',
    'community_clusters.json',
    'stress_scenarios.json',
    'recommendation_dna_feedback.json',
    'adaptive_rec_v2_signal.json',
    'adaptive_rec_v2_scoreboard.json',
    'adaptive_rec_v2_feature_importance.json',
    'backtest_summary.json',
    'challenger_scoreboard.json',
    'promotion_recommendation.json',
    'drift_report.json',
    'regime_comparison.json',
    'strategy_doctor.json',
    'decision_center_today.json',
    'decision_center_notifications.json',
    'stock_validation.json',
  ];
  const entries = await Promise.all(targets.map(async n => [n.replace(/\.json$/, ''), await fetchJson(n)]));
  for (const [k, v] of entries) STATE[k] = v;
  // Also try to load the daily ledger for the status indicator + Admin tab
  try {
    const r = await fetch(new URL('aegis_daily_v2_history.jsonl', REPORTS_BASE).href, {cache: 'no-store'});
    if (r.ok) {
      const text = await r.text();
      STATE.aegis_daily_v2_history_raw = text;
      const lines = text.trim().split('\n').filter(Boolean);
      STATE.__last_run = lines.length ? JSON.parse(lines[lines.length - 1]) : null;
    }
  } catch (e) {}
}

// ==========================================================================
// Formatters + helpers
// ==========================================================================
const fmt = {
  price: (v, digits=2) => v == null ? '—' : `₹${Number(v).toLocaleString('en-IN', {minimumFractionDigits: digits, maximumFractionDigits: digits})}`,
  pct:   (v, digits=1) => v == null ? '—' : (Math.abs(v) < 3 ? (v*100).toFixed(digits) + '%' : Number(v).toFixed(digits) + '%'),
  num:   (v, digits=2) => v == null ? '—' : Number(v).toFixed(digits),
  int:   (v) => v == null ? '—' : Number(v).toLocaleString('en-IN'),
  arrow: v => v == null ? '' : (v > 0.001 ? '▲' : v < -0.001 ? '▼' : ''),
};

function el(tag, opts = {}, ...children) {
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.id) e.id = opts.id;
  if (opts.text != null) e.textContent = opts.text;
  if (opts.html != null) e.innerHTML = opts.html;
  if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) e.setAttribute(k, v);
  if (opts.onclick) e.onclick = opts.onclick;
  for (const c of children) if (c) e.appendChild(c);
  return e;
}

function scoreBadge(v) {
  if (v == null) return `<span class="score na">—</span>`;
  const cls = v >= 70 ? 'hi' : v >= 50 ? 'med' : 'lo';
  return `<span class="score ${cls}">${Math.round(v)}</span>`;
}
function pillFor(action) {
  const map = {
    'Strong-Buy':'strong-buy','Buy':'buy','Accumulate':'accumulate',
    'Hold':'hold','Watchlist':'watchlist','Reduce':'reduce',
    'Sell':'sell','Avoid':'avoid',
  };
  const cls = map[action] || 'hold';
  return `<span class="pill ${cls}">${action}</span>`;
}
function regimeLabel(gc) {
  if (!gc) return { text: 'Unknown', cls: 'regime-neu' };
  const c = (gc.classifications || {}).global_posture;
  const label = typeof c === 'string' ? c : (c && c.label) || 'Unknown';
  const clsMap = {'Risk-On':'regime-on','Neutral':'regime-neu','Risk-Off':'regime-off'};
  return { text: label, cls: clsMap[label] || 'regime-neu' };
}

// ==========================================================================
// Canonical recommendation list
// One list. Everything else references this. Enriches base recommendations
// with fusion score + intelligence dimensions when available.
// ==========================================================================
function buildCanonicalList() {
  const recs = (STATE.recommendations && STATE.recommendations.recommendations) || [];
  // Index intelligence reports by ticker
  const ii = (STATE.investment_intelligence && STATE.investment_intelligence.reports) || [];
  const iiByTicker = new Map();
  for (const r of ii) iiByTicker.set(String(r.ticker), r);

  // Index risk sizing by ticker
  const sizing = (STATE.risk_capital_v2_latest && STATE.risk_capital_v2_latest.sizing) || [];
  const sizeByTicker = new Map();
  for (const s of sizing) sizeByTicker.set(String(s.ticker), s);

  const enriched = recs.map(r => {
    const ii_r = iiByTicker.get(String(r.ticker));
    const size = sizeByTicker.get(String(r.ticker));
    return {
      ticker: r.ticker,
      sector: r.sector,
      industry: r.industry,
      action: r.recommendation,
      score_raw: r.composite_decision_score,
      confidence: r.confidence,
      entry_price: r.entry_price,
      buy_low: r.ideal_entry_low,
      buy_high: r.ideal_entry_high,
      target_1: r.target_1,
      target_2: r.target_2,
      stop_loss: r.stop_loss,
      expected_hold_days: r.expected_hold_days,
      currently_held: r.currently_held,
      current_weight: r.current_weight,
      unrealised_pnl_pct: r.unrealised_pnl_pct,
      reasons_for: r.reasons_for || [],
      reasons_against: r.reasons_against || [],

      // From fusion (v2.1) — the canonical intelligence score
      intelligence_score: ii_r ? ii_r.intelligence_score : null,
      fusion_action: ii_r ? ii_r.fusion_decision : null,
      dimensions: ii_r ? ii_r.dimensions : null,
      why_this: ii_r ? ii_r.why_this : null,
      why_not_stronger: ii_r ? ii_r.why_not_stronger : null,
      conflicts: ii_r ? ii_r.conflicts : [],
      top_contributors: ii_r ? ii_r.top_contributors : [],

      // From risk sizing (v2.0)
      target_weight: size ? size.target_weight : null,
      sizing_verdict: size ? size.verdict : null,
      sizing_factors: size ? size.factors : null,
      sizing_counterfactuals: size ? size.counterfactuals : null,
    };
  });

  // Sort by intelligence score (fallback to raw score)
  enriched.sort((a, b) => {
    const av = a.intelligence_score ?? a.score_raw ?? 0;
    const bv = b.intelligence_score ?? b.score_raw ?? 0;
    return bv - av;
  });
  return enriched;
}

function upsideFor(r) {
  if (r.entry_price && r.target_1) {
    return (r.target_1 - r.entry_price) / r.entry_price;
  }
  return null;
}
function riskRewardFor(r) {
  if (r.entry_price && r.target_1 && r.stop_loss) {
    const up = r.target_1 - r.entry_price;
    const dn = r.entry_price - r.stop_loss;
    if (dn > 0) return up / dn;
  }
  return null;
}
function dimScore(r, name) {
  if (!r.dimensions) return null;
  const d = r.dimensions.find(x => x.name === name);
  return d ? d.score : null;
}

function decisionCenter(canonical) {
  const dc = STATE.decision_center_today;
  const wrap = el('div', {class: 'section'});

  if (!dc) {
    // Graceful placeholder if the backend hasn't run
    const head = el('div', {class: 'section-head'});

    wrap.appendChild(head);
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'empty',
      text: 'Decision Center backend has not run yet. Run: python scripts/aegis_daily_v2.py'}));
    wrap.appendChild(card);
    return wrap;
  }

  // ── Header
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: `Daily Decision Center${dc.first_run ? ' · baseline' : ''}`}));
  head.appendChild(el('div', {class: 'meta',
    text: dc.yesterday_date ? `vs ${dc.yesterday_date}` : 'first day'}));
  wrap.appendChild(head);

  // ── Overnight paragraph
  const card = el('div', {class: 'card'});
  card.appendChild(el('div', {style: 'font-size: 15px; line-height: 1.6; color: var(--type-1); font-family: ui-serif, Baskerville, serif; padding-bottom: 4px;',
    text: dc.overnight_summary || ''}));
  wrap.appendChild(card);

  // ── Today's Actions strip (action_counts_today)
  const actionCounts = dc.action_counts_today || {};
  if (Object.keys(actionCounts).length) {
    const strip = el('div', {class: 'strip'});
    const actionOrder = ['Strong-Buy', 'Buy', 'Accumulate', 'Hold', 'Watchlist', 'Reduce', 'Sell', 'Avoid'];
    const clsMap = {
      'Strong-Buy': 'strong-buy', 'Buy': 'buy', 'Accumulate': 'accumulate',
      'Hold': 'hold', 'Watchlist': 'watchlist',
      'Reduce': 'reduce', 'Sell': 'sell', 'Avoid': 'avoid',
    };
    actionOrder.forEach(action => {
      const n = actionCounts[action] || 0;
      if (n === 0) return;
      const yesterdayN = (dc.action_counts_yesterday || {})[action];
      let delta = '';
      if (yesterdayN != null && !dc.first_run) {
        const d = n - yesterdayN;
        if (d !== 0) {
          const cls = d > 0 ? 'pos' : 'neg';
          delta = `<div class="sub ${cls}">${d > 0 ? '+' : ''}${d} vs yesterday</div>`;
        } else {
          delta = `<div class="sub">unchanged</div>`;
        }
      }
      strip.appendChild(el('div', {class: 'tile', html: `
        <span class="label">${action}</span>
        <div class="value"><span class="pill ${clsMap[action]}">${n}</span></div>
        ${delta}`}));
    });
    wrap.appendChild(strip);
  }

  // ── What Changed table
  if (dc.changes && dc.changes.length) {
    const changeCard = el('div', {class: 'card'});
    changeCard.appendChild(el('h3', {html: `What Changed Overnight <span class="count">${dc.changes.length}</span>`}));

    const scrollWrap = el('div', {class: 'scroll-x'});
    const table = el('table', {class: 'decision'});
    table.innerHTML = `<thead><tr>
      <th>Ticker</th><th>Kind</th>
      <th>Yesterday</th><th>Today</th>
      <th>Reason</th>
      <th class="center">Intel</th>
    </tr></thead>`;
    const tbody = el('tbody');
    // Prioritise: NEW / UPGRADED / TARGET_HIT / STOP_HIT / DOWNGRADED then others
    const priorityOrder = ['NEW', 'UPGRADED', 'TARGET_HIT', 'STOP_HIT', 'NEW_HELD',
                              'DOWNGRADED', 'EXITED', 'REMOVED', 'INTELLIGENCE_UP',
                              'INTELLIGENCE_DOWN', 'CONFIDENCE_UP', 'CONFIDENCE_DOWN',
                              'SIZING_WARNING'];
    const sortedChanges = dc.changes.slice().sort((a, b) =>
      priorityOrder.indexOf(a.kind) - priorityOrder.indexOf(b.kind));
    for (const c of sortedChanges.slice(0, 40)) {
      const kindCls = {
        'NEW': 'buy', 'UPGRADED': 'buy', 'NEW_HELD': 'buy',
        'TARGET_HIT': 'buy', 'INTELLIGENCE_UP': 'buy', 'CONFIDENCE_UP': 'buy',
        'DOWNGRADED': 'sell', 'STOP_HIT': 'sell', 'EXITED': 'sell', 'REMOVED': 'sell',
        'INTELLIGENCE_DOWN': 'sell', 'CONFIDENCE_DOWN': 'sell',
        'SIZING_WARNING': 'hold',
      }[c.kind] || 'watchlist';
      const tr = el('tr', {onclick: () => location.hash = '#/stock/' + c.ticker});
      tr.innerHTML = `
        <td class="ticker">${c.ticker}</td>
        <td><span class="pill ${kindCls}">${c.kind.replace(/_/g, ' ')}</span></td>
        <td class="mute">${c.yesterday_action || '—'}</td>
        <td>${c.today_action ? pillFor(c.today_action) : '—'}</td>
        <td class="company">${c.reason}</td>
        <td class="center">${scoreBadge(c.today_intelligence)}</td>`;
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scrollWrap.appendChild(table);
    changeCard.appendChild(scrollWrap);
    if (dc.changes.length > 40) {
      changeCard.appendChild(el('div', {style: 'padding-top: 12px; text-align: right; color: var(--type-3); font-size: 11px;',
        text: `Showing top 40 of ${dc.changes.length} changes.`}));
    }
    wrap.appendChild(changeCard);
  } else if (!dc.first_run) {
    const stableCard = el('div', {class: 'card'});
    stableCard.appendChild(el('div', {class: 'empty', text: 'No material changes overnight — recommendation set is stable.'}));
    wrap.appendChild(stableCard);
  }

  // ── Exit Center + Watchlist side by side
  const grid = el('div', {class: 'grid-2'});

  // Exit Center
  const exitCard = el('div', {class: 'card'});
  exitCard.appendChild(el('h3', {html: `Exit Center <span class="count">${(dc.exit_center || []).length}</span>`}));
  if (!dc.exit_center || !dc.exit_center.length) {
    exitCard.appendChild(el('div', {class: 'empty', text: 'No positions require action today.'}));
  } else {
    const ul = el('ul', {class: 'alert-list'});
    for (const x of dc.exit_center.slice(0, 8)) {
      const sevCls = x.severity === 'CRITICAL' ? 'sell' :
                       x.severity === 'HIGH' ? 'reduce' :
                       x.severity === 'MEDIUM' ? 'hold' : 'watchlist';
      const li = el('li');
      li.innerHTML = `<span class="pill ${sevCls}">${x.severity}</span>
                        <span class="ticker-name" onclick="location.hash='#/stock/${x.ticker}'; return false;" style="cursor:pointer;">${x.ticker}</span>
                        <span class="detail">${x.reasons.join(' · ')}</span>`;
      ul.appendChild(li);
    }
    exitCard.appendChild(ul);
  }
  const exitWrap = el('div');
  exitWrap.appendChild(exitCard);
  grid.appendChild(exitWrap);

  // Watchlist
  const watchCard = el('div', {class: 'card'});
  watchCard.appendChild(el('h3', {html: `Watchlist <span class="count">${(dc.watchlist || []).length}</span>`}));
  if (!dc.watchlist || !dc.watchlist.length) {
    watchCard.appendChild(el('div', {class: 'empty', text: 'No near-buy candidates today.'}));
  } else {
    const ul = el('ul', {class: 'alert-list'});
    for (const w of dc.watchlist.slice(0, 8)) {
      const trendCls = w.intel_trend > 0 ? 'pos' : w.intel_trend < 0 ? 'neg' : '';
      const trendStr = w.intel_trend != null ? `${w.intel_trend > 0 ? '+' : ''}${w.intel_trend.toFixed(1)}` : '—';
      const li = el('li');
      li.innerHTML = `<span class="pill watchlist">${w.current_action}</span>
                        <span class="ticker-name" onclick="location.hash='#/stock/${w.ticker}'; return false;" style="cursor:pointer;">${w.ticker}</span>
                        <span class="detail">Intel ${Math.round(w.intelligence_score)} · gap ${w.gap_to_buy.toFixed(1)} to Buy · trend <span class="${trendCls}">${trendStr}</span></span>`;
      ul.appendChild(li);
    }
    watchCard.appendChild(ul);
  }
  const watchWrap = el('div');
  watchWrap.appendChild(watchCard);
  grid.appendChild(watchWrap);

  wrap.appendChild(grid);

  // ── Notifications (priority-tiered)
  if (dc.notifications && dc.notifications.length) {
    const notifCard = el('div', {class: 'card', style: 'margin-top: 16px;'});
    const critN = dc.notifications.filter(n => n.priority === 'CRITICAL').length;
    const highN = dc.notifications.filter(n => n.priority === 'HIGH').length;
    notifCard.appendChild(el('h3', {html:
      `Notifications <span class="count">${critN} CRITICAL · ${highN} HIGH · ${dc.notifications.length} total</span>`}));
    const ul = el('ul', {class: 'alert-list'});
    const ordered = dc.notifications.slice().sort((a, b) => {
      const rank = {'CRITICAL': 0, 'HIGH': 1, 'MEDIUM': 2, 'LOW': 3};
      return rank[a.priority] - rank[b.priority];
    }).slice(0, 12);
    for (const n of ordered) {
      const cls = n.priority === 'CRITICAL' ? 'sell' :
                    n.priority === 'HIGH' ? 'buy' :
                    n.priority === 'MEDIUM' ? 'hold' : 'watchlist';
      const li = el('li');
      li.innerHTML = `<span class="pill ${cls}">${n.priority}</span>
                        <span class="ticker-name" onclick="location.hash='#/stock/${n.ticker}'; return false;" style="cursor:pointer;">${n.ticker}</span>
                        <span class="detail">${n.detail}</span>`;
      ul.appendChild(li);
    }
    notifCard.appendChild(ul);
    wrap.appendChild(notifCard);
  }

  return wrap;
}

function todaysAlerts(canonical) {
  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: `Today's Alerts`}));
  wrap.appendChild(head);

  const alerts = [];

  // Critical fusion conflicts
  const criticals = (STATE.intelligence_conflicts && STATE.intelligence_conflicts.all_conflicts || [])
    .filter(c => c.severity === 'CRITICAL');
  criticals.slice(0, 10).forEach(c => alerts.push({
    kind: 'WARNING',
    ticker: c.ticker,
    detail: c.detail,
    cls: 'neg',
  }));

  // Portfolio-level risk block
  const risk = STATE.risk_capital_v2_latest && STATE.risk_capital_v2_latest.portfolio_risk;
  if (risk && risk.verdict === 'BLOCK') {
    alerts.push({kind: 'RISK BLOCK', ticker: 'PORTFOLIO', detail: `Portfolio risk verdict: BLOCK`, cls: 'neg'});
  } else if (risk && risk.verdict === 'WARNING') {
    alerts.push({kind: 'RISK WARN', ticker: 'PORTFOLIO', detail: `Portfolio vol ${fmt.pct(risk.portfolio_vol_annual, 1)} · ${risk.alerts?.length || 0} budget alerts`, cls: 'warn'});
  }

  // Position stop-loss proximity
  canonical.filter(r => r.currently_held && r.unrealised_pnl_pct != null && r.unrealised_pnl_pct < -0.05)
    .slice(0, 5).forEach(r => alerts.push({
      kind: 'DRAWDOWN',
      ticker: r.ticker,
      detail: `Down ${fmt.pct(r.unrealised_pnl_pct, 1)} · monitor stop-loss ${fmt.price(r.stop_loss)}`,
      cls: 'warn',
    }));

  // Target proximity — held positions near target
  canonical.filter(r => r.currently_held && r.unrealised_pnl_pct != null && r.unrealised_pnl_pct > 0.10)
    .slice(0, 5).forEach(r => alerts.push({
      kind: 'TARGET NEAR',
      ticker: r.ticker,
      detail: `Up ${fmt.pct(r.unrealised_pnl_pct, 1)} · target ${fmt.price(r.target_1)}`,
      cls: 'pos',
    }));

  const card = el('div', {class: 'card'});
  if (!alerts.length) {
    card.appendChild(el('div', {class: 'empty', text: 'No alerts today.'}));
    wrap.appendChild(card);
    return wrap;
  }
  const ul = el('ul', {class: 'alert-list'});
  alerts.slice(0, 20).forEach(a => {
    ul.innerHTML += `<li>
      <span class="pill ${a.cls === 'pos' ? 'buy' : a.cls === 'warn' ? 'hold' : 'sell'}">${a.kind}</span>
      <span class="ticker-name" onclick="location.hash='#/stock/${a.ticker}'; return false;" style="cursor:pointer;">${a.ticker}</span>
      <span class="detail">${a.detail}</span>
    </li>`;
  });
  card.appendChild(ul);
  wrap.appendChild(card);
  return wrap;
}

function renderStockDetail(ticker) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const canonical = buildCanonicalList();
  const r = canonical.find(x => String(x.ticker) === String(ticker));

  if (!r) {
    main.appendChild(el('div', {class: 'empty', text: `No data for ${ticker}. `,
      html: `No data for <strong>${ticker}</strong>. <a href="#/" style="color: var(--accent-hi)">← back to dashboard</a>`}));
    return;
  }

  // Header
  const head = el('div', {class: 'detail-head'});
  head.appendChild(el('div', {html: `
    <a href="#/" class="detail-back">← DASHBOARD</a>
    <div class="detail-title">${r.ticker}</div>
    <div class="detail-subtitle">${r.sector || '—'} · ${r.industry || '—'}</div>`}));
  head.appendChild(el('div', {style: 'text-align: right;', html: `
    ${pillFor(r.action)}
    <div style="margin-top: 8px; font: 10px ui-monospace, monospace; color: var(--type-3); letter-spacing: 0.12em;">
      INTELLIGENCE ${scoreBadge(r.intelligence_score)}
    </div>`}));
  main.appendChild(head);

  // Section 1 — Price (institutional decision surface)
  main.appendChild(sectionPrice(r));

  // Section 2 — Why Buy (10 dimension breakdown)
  main.appendChild(sectionWhyBuy(r));

  // Section 3 — Portfolio Impact (from sizing engine)
  main.appendChild(sectionPortfolioImpact(r));

  // Section 4 — Explainability (reasons + conflicts)
  main.appendChild(sectionExplainability(r));

  // Section 5 — Historical validation (per-ticker rollup)
  main.appendChild(sectionValidationSummary(r));
  main.appendChild(sectionValidationTimeline(r));
  main.appendChild(sectionValidationFailures(r));
  main.appendChild(sectionValidationSimilar(r));
}

// ==========================================================================
// Stock-level Historical Validation sections
// ==========================================================================
function _stockValidation(ticker) {
  const sv = STATE.stock_validation;
  if (!sv || !sv.tickers) return null;
  return sv.tickers[ticker] || null;
}

function _starBadge(n) {
  const filled = '★'.repeat(n);
  const empty  = '☆'.repeat(5 - n);
  const cls = n >= 4 ? 'pos' : n >= 3 ? 'warn' : n > 0 ? 'neg' : 'mute';
  return `<span class="${cls}" style="letter-spacing: 0.1em; font-size: 18px;">${filled}${empty}</span>`;
}

function sectionValidationSummary(r) {
  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Historical Validation'}));
  head.appendChild(el('div', {class: 'meta', text: 'Has AEGIS recommended this before? Did it work?'}));
  wrap.appendChild(head);

  const v = _stockValidation(r.ticker);
  if (!v || v.n_trades === 0) {
    const card = el('div', {class: 'card'});
    card.appendChild(el('div', {class: 'empty',
      text: `No historical recommendations for ${r.ticker} in the learning corpus. ` +
             `This will be its first tracked trade.`}));
    wrap.appendChild(card);
    return wrap;
  }

  const strip = el('div', {class: 'strip'});
  const wrPct = (v.win_rate * 100).toFixed(0);
  const wrCls = v.win_rate >= 0.7 ? 'pos' : v.win_rate >= 0.5 ? 'warn' : 'neg';
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Reliability</span>
    <div style="line-height: 1.4;">${_starBadge(v.reliability_stars)}</div>
    <div class="sub">${v.reliability_stars}/5 · based on ${v.n_trades} historical trades</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Historical Win Rate</span>
    <div class="value ${wrCls}">${wrPct}<span class="unit">%</span></div>
    <div class="sub">${v.n_winners} winners · ${v.n_losers} losers</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Average Return</span>
    <div class="value ${v.avg_return_pct > 0 ? 'pos' : 'neg'}">${(v.avg_return_pct * 100).toFixed(2)}<span class="unit">%</span></div>
    <div class="sub">per trade · over ${v.n_trades} recommendations</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Average Holding</span>
    <div class="value">${v.avg_holding_days}<span class="unit">days</span></div>
    <div class="sub">typical trade duration</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Largest Gain</span>
    <div class="value pos">${(v.largest_gain_pct * 100).toFixed(1)}<span class="unit">%</span></div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Largest Loss</span>
    <div class="value neg">${(v.largest_loss_pct * 100).toFixed(1)}<span class="unit">%</span></div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Current Confidence</span>
    <div class="value">${v.current_confidence != null ? (v.current_confidence * 100).toFixed(0) + '%' : '—'}</div>
    <div class="sub">historical avg ${v.historical_confidence != null ? (v.historical_confidence * 100).toFixed(0) + '%' : '—'}</div>`}));
  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">MFE (avg peak)</span>
    <div class="value pos">${(v.avg_mfe_pct * 100).toFixed(1)}<span class="unit">%</span></div>
    <div class="sub">avg MAE ${(v.avg_mae_pct * 100).toFixed(1)}%</div>`}));
  wrap.appendChild(strip);
  return wrap;
}

function sectionValidationTimeline(r) {
  const v = _stockValidation(r.ticker);
  if (!v || !v.trades || !v.trades.length) return el('span');

  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});
  head.appendChild(el('h2', {text: 'Recommendation Timeline'}));
  head.appendChild(el('div', {class: 'meta', text: `${v.trades.length} past · newest first`}));
  wrap.appendChild(head);

  const card = el('div', {class: 'card'});
  const scrollWrap = el('div', {class: 'scroll-x'});
  const table = el('table', {class: 'decision'});
  table.innerHTML = `<thead><tr>
    <th>Entry Date</th>
    <th>Exit Date</th>
    <th class="right">Return</th>
    <th class="right">Days Held</th>
    <th class="right">MFE Peak</th>
    <th class="right">MAE Low</th>
    <th class="center">Result</th>
    <th>Reason</th>
  </tr></thead>`;
  const tbody = el('tbody');
  const sorted = v.trades.slice().reverse();   // newest first
  for (const t of sorted) {
    const winCls  = t.is_winner ? 'pos' : 'neg';
    const winPill = t.is_winner ? '<span class="pill buy">✔ WIN</span>'
                                    : '<span class="pill sell">✖ LOSS</span>';
    const reason = t.is_winner ? (t.success_reason || '—') : (t.failure_reason || '—');
    tbody.innerHTML += `<tr>
      <td>${t.entry_date}</td>
      <td class="mute">${t.exit_date}</td>
      <td class="right ${winCls}">${(t.return_pct * 100).toFixed(2)}%</td>
      <td class="right mute">${t.n_bars_held}d</td>
      <td class="right pos">${(t.mfe_pct * 100).toFixed(1)}%</td>
      <td class="right neg">${(t.mae_pct * 100).toFixed(1)}%</td>
      <td class="center">${winPill}</td>
      <td class="mute" style="font-size: 11px;">${reason}</td>
    </tr>`;
  }
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  card.appendChild(scrollWrap);
  wrap.appendChild(card);
  return wrap;
}

function sectionValidationFailures(r) {
  const v = _stockValidation(r.ticker);
  if (!v || !v.past_failures || !v.past_failures.length) return el('span');

  const wrap = el('div', {class: 'section'});
  const head = el('div', {class: 'section-head'});

  wrap.appendChild(head);

  const grid = el('div', {class: 'grid-2'});

  // Left: past failures list

  failCard.appendChild(el('h3', {html: `Past Failures <span class="count">${v.past_failures.length}</span>`}));
  const ul = el('ul', {class: 'reason-list'});
  for (const f of v.past_failures.slice().reverse().slice(0, 6)) {
    const li = el('li');
    li.innerHTML = `<span class="pill sell">${(f.return_pct * 100).toFixed(2)}%</span>
                      <span class="ticker" style="margin-left: 8px;">${f.entry_date} → ${f.exit_date}</span>
                      <div style="color: var(--type-2); font-size: 12px; margin-top: 4px;">
                        ${f.failure_reason || 'Ordinary loser'}
                      </div>`;
    ul.appendChild(li);
  }
  failCard.appendChild(ul);
  grid.appendChild(failCard);

  // Right: current setup check
  const chk = v.current_setup_check || {};
  const chkCard = el('div', {class: 'card'});
  chkCard.appendChild(el('h3', {text: 'Current Setup vs Past Failures'}));
  if (!chk.recurrence_flags || !chk.recurrence_flags.length) {
    chkCard.appendChild(el('div', {style: 'padding: 12px 0;', html: `
      <span class="pill buy">${chk.verdict || 'NO KNOWN FAILURE PATTERNS'}</span>
      <div style="color: var(--type-2); font-size: 12px; margin-top: 8px;">
        The failure conditions that hurt this ticker before do not obviously
        apply to today's setup. Standard risk management applies.

  } else {
    for (const c of chk.recurrence_flags) {
      chkCard.innerHTML += `<div style="padding: 8px 0; border-bottom: 1px dashed var(--rule);">
        <div style="font: 10px ui-monospace, monospace; letter-spacing: 0.12em; color: var(--warn); text-transform: uppercase;">${c.past}</div>
        <div style="color: var(--type-1); font-size: 12px; margin-top: 4px;">${c.current}</div>

  }
  grid.appendChild(chkCard);

  wrap.appendChild(grid);
  return wrap;
}

function sectionWhyBuy(r) {

function sectionPortfolioImpact(r) {

    <span class="label">Suggested Weight</span>
    <div class="value">${fmt.pct(r.target_weight, 2)}</div>
    <div class="sub">${r.sizing_verdict || '—'}</div>`}));

  strip.appendChild(el('div', {class: 'tile', html: `
    <span class="label">Currently Held</span>
    <div class="value">${r.currently_held ? fmt.pct(r.current_weight, 2) : 'No'}</div>

    card.appendChild(el('div', {style: 'margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule);', html: `

        <div><strong style="color: var(--type-1);">Why not 12%?</strong> <span style="color: var(--type-2)">${r.sizing_counterfactuals.at_12pct?.reasoning || '—'}</span></div>
      </div>`}));
  }
  wrap.appendChild(card);
  return wrap;
}

  positive.appendChild(el('h3', {text: 'Why this recommendation?'}));
  const ul1 = el('ul', {class: 'reason-list'});

  const humanName = {

  if (why.length) {

  }
  if (!ul1.children.length) ul1.appendChild(el('li', {text: 'No positive factors extracted.', class: 'empty'}));
  positive.appendChild(ul1);
  grid.appendChild(positive);

  // Why not stronger + reasons_against
  const negative = el('div', {class: 'card'});
  negative.appendChild(el('h3', {text: 'Why not stronger?'}));
  const ul2 = el('ul', {class: 'reason-list'});
  const notStronger = r.why_not_stronger || [];
  if (notStronger.length) {
    for (const w of notStronger) {
      const li = el('li');
      li.innerHTML = `<span class="dim" style="color: var(--neg);">${humanName[w.name] || w.name} · ${Math.round(w.score)}</span><br>${w.why || ''}`;
      ul2.appendChild(li);
    }
  }
  if (r.reasons_against && r.reasons_against.length) {
    for (const ra of r.reasons_against.slice(0, 5)) {
      const li = el('li');
      li.innerHTML = `<span class="dim" style="color: var(--neg);">RISK</span> ${ra}`;
      ul2.appendChild(li);
    }
  }
  if (!ul2.children.length) ul2.appendChild(el('li', {text: 'No negative factors flagged.', class: 'empty'}));
  negative.appendChild(ul2);
  grid.appendChild(negative);

  wrap.appendChild(grid);

  // Conflicts
  if (r.conflicts && r.conflicts.length) {
    const conflictCard = el('div', {class: 'card', style: 'margin-top: 20px;'});
    conflictCard.appendChild(el('h3', {html: `Conflicts detected<span class="count">${r.conflicts.length}</span>`}));
    const ul = el('ul', {class: 'reason-list'});
    for (const c of r.conflicts) {
      const cls = c.severity === 'CRITICAL' ? 'neg' : c.severity === 'MEDIUM' ? 'warn' : 'buy';
      const li = el('li');
      li.innerHTML = `<span class="pill ${cls === 'neg' ? 'sell' : cls === 'warn' ? 'hold' : 'watchlist'}">${c.severity}</span>
                      <strong style="color: var(--type-1); margin-left: 6px; font-family: ui-monospace, monospace; font-size: 11px;">${c.rule}</strong>
                      <div style="color: var(--type-2); margin-top: 4px;">${c.detail || ''}</div>`;
      ul.appendChild(li);
    }
    conflictCard.appendChild(ul);
    wrap.appendChild(conflictCard);
  }

  return wrap;
}

function currentRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  return h;
}

function renderRoute() {
  const path = currentRoute();
  // Toggle admin visual mode based on route
  if (path === '/admin' || path.startsWith('/admin/')) {
    document.body.setAttribute('data-mode', 'admin');
    document.getElementById('brandTag').textContent = 'Validation Lab · Admin';
  } else {
    document.body.setAttribute('data-mode', 'investor');
    document.getElementById('brandTag').textContent = 'Investment Dashboard';
  }
  // Highlight active tab
  document.querySelectorAll('#tabbar a').forEach(a => {
    const key = a.dataset.tab;
    const active = (key === '/admin' && path.startsWith('/admin'))
                 || (key === '/' && !path.startsWith('/admin'));
    a.classList.toggle('active', active);
  });

  if (path === '/admin') {
    renderAdminPage();
  } else if (path.startsWith('/stock/')) {
    const ticker = decodeURIComponent(path.substring('/stock/'.length));
    renderStockDetail(ticker);
  } else {
    renderDashboard();
  }
}

// Compact admin tile that reuses the .strip/.tile CSS from the investor UI
function adminTile(label, value, valueCls, sub, subCls) {
  return el('div', {class: 'tile', html: `
    <span class="label">${label}</span>
    <div class="value ${valueCls || ''}">${value}</div>
    ${sub ? `<div class="sub ${subCls || ''}">${sub}</div>` : ''}`});
}
function adminSection(title, body) {
  const s = el('div', {class: 'section'});

function adminTrustworthinessVerdict() {
  const isum = STATE.intelligence_summary;
  const dc = STATE.decision_center_today;
  const c = STATE.confidence_calibration;
  const v = STATE.validation_v2_latest;
  const dr = STATE.drift_report;

  const alerts = [];
  let score = 100;
  const criticals = ((isum && isum.conflict_summary) || {}).n_critical || 0;
  if (criticals > 0) { score -= Math.min(20, criticals); alerts.push({sev: 'HIGH', text: `${criticals} CRITICAL fusion conflicts (raw vs fusion disagreement)`}); }
  const rawEce = c && c.raw_metrics && c.raw_metrics.ece;
  if (rawEce && rawEce > 0.10) alerts.push({sev: 'INFO', text: `Raw confidence ECE ${rawEce.toFixed(3)} — rank-order label, not probability`});
  const driftFlag = v && v.metric_drift && v.metric_drift.flag;
  if (driftFlag === 'degrading') { score -= 15; alerts.push({sev: 'HIGH', text: 'Live prediction drift is DEGRADING'}); }
  else if (driftFlag === 'insufficient_evidence') alerts.push({sev: 'INFO', text: 'Live drift: insufficient closed trades yet'});
  const strategyDrift = dr && dr.metric_drift ? Object.values(dr.metric_drift) : [];
  const degrading = strategyDrift.filter(x => x.stability_flag === 'degrading').length;
  if (degrading > 0) { score -= Math.min(15, degrading * 3); alerts.push({sev: 'MEDIUM', text: `${degrading} strategies show 2nd-half degradation`}); }
  if (dc && dc.first_run) alerts.push({sev: 'INFO', text: 'Decision center · first day of tracking · diff kicks in tomorrow'});
  const dna = STATE.recommendation_dna_feedback;
  if (dna && dna.n_patterns) alerts.push({sev: 'OK', text: `${dna.n_patterns} DNA patterns · learning loop active`});

  score = Math.max(0, Math.min(100, score));
  const verdict = score >= 80 ? 'TRUSTWORTHY' : score >= 60 ? 'DEGRADED' : 'UNTRUSTWORTHY';
  const cls = score >= 80 ? 'pos' : score >= 60 ? 'warn' : 'neg';
  const pill = score >= 80 ? 'buy' : score >= 60 ? 'hold' : 'sell';

  const s = adminSection(`Model Trustworthiness Verdict`);
  const card = el('div', {class: 'card'});
  card.appendChild(el('div', {html: `
    <span class="label" style="font: 9px ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--type-2);">TRUSTWORTHINESS SCORE</span>
    <div style="font-family: ui-serif, Baskerville, serif; font-size: 32px; color: var(--type-1); margin-top: 6px;">
      <span class="pill ${pill}">${verdict}</span>
      <span class="${cls}" style="margin-left: 12px;">${score}<span style="color: var(--type-3); font-size: 14px;">/100</span></span>
    </div>
    <div style="color: var(--type-3); font-size: 11px; margin-top: 8px; font-family: ui-monospace, monospace;">Aggregated from conflicts + drift + calibration + learning signals</div>`}));

  if (alerts.length) {
    const ul = el('div', {style: 'margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 12px;'});
    for (const a of alerts) {
      const p = a.sev === 'HIGH' ? 'sell' : a.sev === 'MEDIUM' ? 'hold' : a.sev === 'OK' ? 'buy' : 'watchlist';
      ul.appendChild(el('div', {style: 'padding: 6px 0; font-size: 12px;', html: `<span class="pill ${p}">${a.sev}</span> <span style="color: var(--type-2); margin-left: 8px;">${a.text}</span>`}));
    }
    card.appendChild(ul);
  }
  s.appendChild(card);
  return s;
}

function adminPipelineHealth() {
  const s = adminSection('1 · Daily Validation Summary');
  const raw = STATE.aegis_daily_v2_history_raw;
  if (!raw) {
    // Load ledger separately since loadState may not include it
    const target = el('div', {class: 'empty', text: 'Ledger not loaded. Refresh.'});
    s.appendChild(target);
    return s;
  }
  const lines = raw.trim().split('\n').filter(Boolean);
  const last = lines.length ? (() => { try { return JSON.parse(lines[lines.length - 1]); } catch { return null; }})() : null;
  if (!last) { s.appendChild(el('div', {class: 'empty', text: 'No pipeline runs yet.'})); return s; }
  const strip = el('div', {class: 'strip'});
  const overallCls = last.n_failure === 0 ? 'pos' : 'neg';
  strip.appendChild(adminTile('Pipeline Overall',
    last.n_failure === 0 ? '<span class="pill buy">PASS</span>' : '<span class="pill sell">FAIL</span>',
    overallCls,
    `${last.n_success}/${last.n_steps} steps · ${last.total_elapsed_s}s`));
  for (const r of last.results || []) {
    const cls = r.verdict === 'SUCCESS' ? 'pos' : r.verdict === 'SKIPPED_OPTIONAL' ? 'watchlist' : r.verdict === 'FAILURE' ? 'neg' : 'warn';
    const pill = r.verdict === 'SUCCESS' ? 'buy' : r.verdict === 'FAILURE' ? 'sell' : 'hold';
    strip.appendChild(adminTile(r.name, `<span class="pill ${pill}">${r.verdict}</span>`, cls, `${r.elapsed_s || 0}s`));

  return s;

  }
  s.appendChild(strip);
  return s;
}

// ==========================================================================
// Search — jump to stock detail on match
// ==========================================================================
function setupSearch() {
  const box = document.getElementById('searchBox');
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = box.value.trim().toUpperCase();
    if (!q) return;
    const canonical = buildCanonicalList();
    const match = canonical.find(r =>
      String(r.ticker).toUpperCase().includes(q) ||
      String(r.sector || '').toUpperCase().includes(q));
    if (match) {
      location.hash = '#/stock/' + match.ticker;
      box.value = '';
    }
  });
}

// ==========================================================================
// Pipeline status indicator
// ==========================================================================
function updatePipelineStatus() {
  const s = STATE.__last_run;
  const target = document.getElementById('pipelineStatus');
  if (!s) { target.textContent = 'pipeline: —'; return; }
  const succ = s.n_success || 0;
  const total = s.n_steps || 0;
  const failed = s.n_failure || 0;
  const cls = failed ? 'style="color: var(--neg);"' : 'style="color: var(--pos);"';
  target.innerHTML = `<span ${cls}>pipeline ${succ}/${total}</span>`;
}

// ==========================================================================
// Refresh + boot
// ==========================================================================
async function refreshAll() {
  const stamp = document.getElementById('lastRefresh');
  if (stamp) stamp.textContent = 'loading…';
  await loadState();
  renderRoute();
  updatePipelineStatus();
  if (stamp) stamp.textContent = new Date().toLocaleTimeString();
}

(async function boot() {
  // Theme
  const themeBtn = document.getElementById('themeToggle');
  const stored = localStorage.getItem('aegis-dashboard-theme');
  if (stored) document.documentElement.setAttribute('data-theme', stored);
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const media = matchMedia('(prefers-color-scheme: dark)').matches;
    const dark = cur ? cur === 'dark' : media;
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('aegis-dashboard-theme', next);
  };

  // Manual refresh
  document.getElementById('refreshNow').onclick = () => refreshAll();

  // Auto-refresh every 60s (pause when hidden)
  const REFRESH_INTERVAL_MS = 60 * 1000;
  let autoTimer = null;
  const armTimer = () => {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    autoTimer = setInterval(refreshAll, REFRESH_INTERVAL_MS);
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
    else { armTimer(); refreshAll(); }
  });

  setupSearch();
  window.addEventListener('hashchange', renderRoute);

  await refreshAll();
  armTimer();
})();
</script>
