# AEGIS · Outcome Dataset Schema · Phase 0 gate deliverable
# Sprint A · CEO 2026-09-03
#
# Every historical R2 (and R1 advisory / R3 shadow) position lands here
# with enough fields to run any downstream experiment WITHOUT re-joining
# the primary Registry + Portfolio + Exit History artifacts.
#
# Queryable by Position ID · one row per (market, runner, position_id).
# Written as parquet at:
#   reports/research/outcome_dataset/{market}.parquet
#
# Every P0-P5 experiment reads THIS · never re-derives from raw jsonl.
# Phase 0 gate: Outcome Dataset queryable by Position ID AND populated
# for >= 50 closed positions in the combined runner set.

version: 1.0.0
last_updated: 2026-09-03
authorized_by: CEO
fingerprint: aegis.outcome_dataset.v1.20260903

schema:
  # ---- Identity ----
  position_id:            {type: str,  required: true,  key: primary}
  market:                 {type: str,  required: true,  enum: [india, usa]}
  runner:                 {type: str,  required: true,  enum: [R1, R2, R3]}
  ticker:                 {type: str,  required: true}
  sector:                 {type: str,  required: false}
  industry:               {type: str,  required: false}
  cap_bucket:             {type: str,  required: false, enum: [micro, small, mid, large, mega]}

  # ---- Entry ----
  entry_date:             {type: date, required: true}
  entry_price:            {type: float, required: true, min: 0}
  entry_action:           {type: str,  required: true, enum: [BUY, ADD, HOLD, STRONG_BUY, ACCUMULATE]}
  entry_signal_score:     {type: float, required: false}     # ensemble_score at entry
  entry_calibrated_conf:  {type: float, required: false, min: 0, max: 1}
  entry_regime_adj_conf:  {type: float, required: false, min: 0, max: 1}
  entry_model_agreement:  {type: float, required: false, min: 0, max: 1}
  entry_n_models_scoring: {type: int,   required: false}
  entry_disagreement:     {type: bool,  required: false}

  # ---- Regime + context at entry ----
  regime_at_entry:        {type: str,  required: false, enum: [NORMAL, WEAKENING, RISK_OFF, CRASH, RECOVERY, UNKNOWN]}
  sector_regime_at_entry: {type: str,  required: false}
  market_breadth_at_entry:{type: float, required: false}      # 0..1 pct-above-200dma
  vix_at_entry:           {type: float, required: false}      # USA VIX or India-VIX

  # ---- Fundamentals at entry (18-signal Fundamentals Feature Store snapshot) ----
  piotroski_f:            {type: int,   required: false, min: 0, max: 9}
  beneish_m:              {type: float, required: false}
  altman_z:               {type: float, required: false}
  sloan_accruals:         {type: float, required: false}
  interest_coverage:      {type: float, required: false}
  fcf_yield:              {type: float, required: false}
  ev_ebitda:              {type: float, required: false}
  total_shareholder_yield:{type: float, required: false}
  sector_rel_value_rank:  {type: float, required: false, min: 0, max: 1}
  analyst_rev_momentum:   {type: float, required: false}
  guidance_rev:           {type: float, required: false}
  earnings_surprise:      {type: float, required: false}
  insider_f4_signal:      {type: float, required: false}
  inst_13f_change:        {type: float, required: false}   # CEO GAP 1 · 19-signal reconciliation
  fii_dii_net_flow_z:     {type: float, required: false}       # z-score over 20d
  options_pcr:            {type: float, required: false}       # put-call ratio
  short_interest_pct:     {type: float, required: false}       # % float
  earnings_calendar_window:{type: int,  required: false}       # days-to-next-earnings; -1 unknown
  promoter_pledge_pct:    {type: float, required: false}       # India only; NaN elsewhere

  # ---- Exit (populated when closed) ----
  exit_date:              {type: date,  required: false}
  exit_price:             {type: float, required: false, min: 0}
  exit_reason:            {type: str,   required: false}       # canonical: STOP_HIT, TARGET_HIT, HORIZON_EXPIRED, MANUAL, RETIRED, ADMIN_ZERO_DELTA
  holding_days:           {type: int,   required: false, min: 0}
  realized_return_pct:    {type: float, required: false}       # decimal (0.05 = 5%)
  max_favorable_excursion:{type: float, required: false}       # MFE % from entry
  max_adverse_excursion:  {type: float, required: false}       # MAE % from entry
  was_stop_hit:           {type: bool,  required: false}
  was_target_hit:         {type: bool,  required: false}
  was_horizon_expired:    {type: bool,  required: false}
  is_administrative_exit: {type: bool,  required: false}       # structural filter · same-day OR entry==exit

  # ---- Dynamic-risk snapshot at entry (for P0 replay counterfactuals) ----
  atr14_at_entry:         {type: float, required: false}
  dynamic_stop_at_entry:  {type: float, required: false}
  target_at_entry:        {type: float, required: false}
  horizon_days_at_entry:  {type: int,   required: false}

  # ---- Provenance ----
  source_snapshot_date:   {type: date,  required: true}         # asof of the recs file this row came from
  built_utc:              {type: str,   required: true}         # ISO8601Z of Outcome Dataset build

# ---- Sample-size tiers (Sec 3 of pasted plan) ----
sample_size_tiers:
  observation_only:       {min: 0,   max: 4}
  hypothesis:             {min: 5,   max: 14}
  research_signal:        {min: 15,  max: 29}
  stronger_evidence:      {min: 30,  max: 49}
  validation_candidate:   {min: 50,  max: null}

# ---- Trial accounting (Sec 28) ----
# Every experiment increments its trial count here. Deflated Sharpe / White's
# Reality Check applies the trial count. Silent trial inflation is a violation.
trial_accounting:
  P0_exit_bridge:         1
  P1_calibration:         1
  P2_sector_regime:       9    # α, β grid ~ 3x3
  P3_kg_gamma:            5    # γ ∈ {0.0, 0.1, 0.2, 0.3, 0.4}
  P4_cap_sector_lr:       1
  P5_1_disagreement:      1
  P5_2_regime_weights:    1
  P5_3_turnover_cap:      3    # sensitivity to X ∈ {0.5%, 1%, 2%}
  P5_5_standing_comp:     0    # baseline · never optimized
  R3_gbm_baseline:        1
