# Sprint 7.5 · Factor Library
#
# Every macro/intermarket factor the system tracks, tagged with:
#   - source        : where the value comes from (macro_summary, bond, currency, vol, sector rotation, etf_flows)
#   - unit          : pct | bps | ratio | index | flag | rate
#   - trend_window  : days used to classify trend (bull/bear/sideways) — informational
#   - affected      : sectors/industries the factor moves (used by AI Auditor + Research Factory)
#
# 100% free data source substrate: yfinance + FRED + ECB + RBI + MOSPI + NSE/BSE public data.
# No paid APIs required. All lookups piggy-back on Sprint 6.5 macro readers.

factors:
  # ── Commodities ─────────────────────────────────────────────
  - name: oil_wti
    symbol: "CL=F"
    source: commodity
    unit: pct
    affected: [Energy, Oil Producers, Airlines, Transportation, Paints]

  - name: oil_brent
    symbol: "BZ=F"
    source: commodity
    unit: pct
    affected: [Energy, Oil Producers, Airlines, Transportation]

