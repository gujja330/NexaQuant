version: 1.0
# 2026-08-21 · Wave 3 · Opportunity Registry configuration.
# Governs re-entry rules, cooling periods, and other lifecycle constraints
# that the Registry enforces at write time.
#
# Operator directive §10 · "A closed stock must NOT immediately appear as
# NEW again simply because the model still ranks it highly. Require a
# re-entry condition." Cooling period is the minimum-required condition
# per this config · additional condition checks (fresh setup, expected
# alpha delta) live in Waves 4-5.

re_entry:
  # Minimum calendar days that must elapse between CLOSED/REJECTED status
  # and a new opportunity_id for the same (market, runner, ticker).
  # If the model re-ranks the ticker before this window expires, the
  # sender's get_or_create() returns None and the row is skipped for the
  # day (research file still captures the model's ranking intent).
  cooling_period_days: 7

  # Cooling period does NOT apply if the previous close was on a hard
  # STOP_LOSS_HIT (protects against re-entering a broken position too
  # quickly). Bump to 14 days for stopped-out re-entries.
  stop_loss_extra_cooling_days: 7

  # A REJECTED same-day rotation (INDIGO / JIOFIN pattern) counts as a
  # very-short lived close. Its cooling is shorter than a genuine
  # closed position because no capital was actually deployed.
  rejected_same_day_cooling_days: 3

# ─────────────────────────────────────────────────────────────
# NEW-opportunity Strong Guard (2026-08-21 · operator directive)
# ─────────────────────────────────────────────────────────────
new_opp_guard:
  # Held-penalty rotation force · fixes "same stocks daily" complaint.
  # When ≥ min_active_pct_to_trigger of today's recs are tickers already
  # ACTIVE in Registry, subtract held_penalty_pp from their scores + re-
  # rank. Non-destructive (original score saved as pre_penalty_score).
  # Set held_penalty_pp: 0.0 to disable the penalty entirely.
  held_penalty_pp:            5.0    # points off score for held tickers
  min_active_pct_to_trigger:  0.60   # only apply if ≥ 60% overlap

  # Guard retry knobs (also documented in the module docstring).
  # 3 attempts · exponential backoff 3s → 9s → 27s · then fallback to
  # last-good diagnostic snapshot (marked degraded_from_previous_day).

# ─────────────────────────────────────────────────────────────
# Parts 10 + 13 · Context + Sector active gates
# ─────────────────────────────────────────────────────────────
gates:
  # When macro_regime hostile (risk-off/bear/crisis) with confidence
  # ≥ 0.60 · BLOCK new BUY signals (force ACTIVE). Lower confidence
  # yields DOWNGRADE instead. Sector laggards downgrade · sector
  # laggards WITH bearish sector_context state block entirely.
  hostile_macro_min_confidence:  0.60

# ─────────────────────────────────────────────────────────────
# Parts 8 + 15 · Dynamic Risk (ATR) + Profit Protection (trailing lift)
# ─────────────────────────────────────────────────────────────
risk_engine:
  atr_multiplier:         2.0    # standard stop = current - ATR14 × 2.0
  trailing_lift_min_pct:  5.0    # only lift trailing stop when profit ≥ 5%
  high_vol_scale:         1.5    # wider stop multiplier in high-vol regimes
  high_vol_atr_pct:       3.0    # ATR% > 3.0 = high-vol regime

# ─────────────────────────────────────────────────────────────
# Parts 9 + 14 · Recommendation Review + Dynamic Confidence trajectory
# ─────────────────────────────────────────────────────────────
review_engine:
  # Confidence delta thresholds (percentage points)
  collapse_threshold_pp:  30.0   # ≥ 30pp drop = confidence collapsed
  rising_threshold_pp:    5.0    # ≥ 5pp change = rising / falling

# ─────────────────────────────────────────────────────────────
# Part 20 · Data Quality hard gate
# ─────────────────────────────────────────────────────────────
data_quality_gate:
  max_recs_stale_days:      3    # > 3d stale = FAIL (block delivery)
  warn_duplicate_tickers:   3    # > N same-ticker across R1+R2 = WARN
  warn_min_universe:       50    # < N tickers scanned = WARN
  warn_stale_prev_close:    5    # > N rows with stale Prev Close = WARN

# ─────────────────────────────────────────────────────────────
# Rotation engine (Wave 5) · daily replacement suggestions
# ─────────────────────────────────────────────────────────────
rotation:
  # Alpha gap (in points) required before ROTATE is suggested.
  # score/rank delta between weakest existing and strongest NEW must
  # exceed this before we suggest swapping capital.
  min_alpha_delta_pp:  5.0
  # Existing positions younger than this are not suggested for rotation
  # (give a new position time to work · reduces churn).
  min_holding_days:    5
  # Cap on suggestions surfaced per day · keeps operator focused on
  # the most impactful pairs.
  max_suggestions:     3

# ─────────────────────────────────────────────────────────────
# Diagnostic exports (consumed by Wave 6 daily diagnostic report)
# ─────────────────────────────────────────────────────────────
diagnostic:
  # If N tickers are blocked by cooling on a given day, surface this
  # in reports/context/daily_opportunity_discovery.json so the
  # "why zero NEW today" report can explain the shortfall.
  emit_cooling_blocks_to_diagnostic: true
