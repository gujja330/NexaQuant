# ── Codes we refuse to resolve ────────────────────────────────────
# Each stays UNKNOWN with review_status REVIEW_REQUIRED. Together they
# are the honest cost of not guessing.
review_required:
  "6798":
    n: 26
    description: Real Estate Investment Trusts
    reason: >
      A legal structure, not a sector. An equity REIT is GICS Real
      Estate; a mortgage REIT is GICS Financials. SEC records no
      distinction, and this is the largest single group in the universe
      - 26 companies - so guessing would misclassify at scale.
    resolvable_by: >
      Asset-mix evidence (property holdings vs mortgage assets) from the
      PIT fundamentals, or a licensed GICS feed.
  "7389":
    n: 16
    description: Services-Business Services, NEC
    reason: >
      "Not Elsewhere Classified" is ambiguous by construction. This
      group spans payment processors (Technology), staffing
      (Industrials) and marketing (Communication Services).
    resolvable_by: Revenue-segment evidence or a licensed GICS feed.
  "6770":
    n: 0
    description: Blank Checks
    reason: A shell or SPAC has no operating business to classify.
  "9995":
    n: 0
    description: Non-Operating Establishments
    reason: No operating business.
  # "6199" was here. Removed 2026-11-04: all three actual holders in
  # this universe (AXP, SYF, COIN) are GICS Financials, so the refusal
  # was an a-priori worry the evidence does not support. It is now an
  # EXACT mapping with the caveat recorded there.
