# SIC -> canonical AEGIS sector map (USA)
#
# CEO 2026-11-04 · Phase 1B.
#
# TARGET TAXONOMY
# ---------------
# The 11 sectors already defined by `_USA_SECTOR_TO_ETF` in
# backend/feature_store/features/sector.py. No twelfth sector is
# introduced: a resolver that emitted a sector the sector_* features
# cannot price would produce classifications nothing can consume.
#
# WHAT SIC IS, AND IS NOT
# -----------------------
# SIC is a 1930s-era REGULATORY filing classification. It is not GICS,
# and this file never claims otherwise. Three structural limits, all of
# which cost coverage here deliberately:
#
#  1. ONE CODE PER REGISTRANT. No segments. A conglomerate gets a single
#     code chosen by its own filing agent.
#  2. SOME CODES NAME A LEGAL STRUCTURE, NOT A BUSINESS. 6798 is "Real
#     Estate Investment Trusts" - an equity REIT is GICS Real Estate, a
#     mortgage REIT is GICS Financials, and nothing in the SEC record
#     separates them. 26 companies, the single largest group in our
#     universe, and they stay REVIEW_REQUIRED.
#  3. "NEC" MEANS NOT ELSEWHERE CLASSIFIED. 7389 is ambiguous by
#     definition and spans Technology, Industrials and Consumer.
#
# MAPPING METHOD, recorded per company by the resolver:
#   EXACT   a 4-digit override · the code names one business
#   MAPPED  a 2-digit major-group rule · defensible, less specific
#   PROXY   reserved · no proxy rules are enabled today
#   UNKNOWN no SIC, or a code whose sector cannot be defended
#
# A code listed under `review_required` resolves to UNKNOWN with
# review_status REVIEW_REQUIRED. Coverage is NOT improved by guessing.

schema_version: aegis.usa.sic_sector_map.v1
source: SEC submissions · sic / sicDescription
taxonomy: _USA_SECTOR_TO_ETF (11 sectors)

sectors:
  - Technology
  - Financials
  - Healthcare
  - Energy
  - Industrials
  - Consumer Discretionary
  - Consumer Staples
  - Utilities
  - Materials
  - Real Estate
  - Communication Services

