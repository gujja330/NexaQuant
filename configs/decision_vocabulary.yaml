version: 3.0
last_amended: 2026-08-10
# LOCKED · 6-value operator-facing decision vocabulary.
# Operator directive: "based on decision only i will plan on stocks."
# CEO review: "12 values too many · reduce to 6."
#
# Internal engine keeps all sophistication (Priority buckets · Investability
# scores · Runner Status · etc). Only the operator-facing DECISION is
# constrained to these 6 verbs.
#
# CLOSED and IGNORED are NOT decisions · they're Lifecycle states.
# BUY BIG and BUY CAUTIOUSLY are NOT decisions · size is a separate field.
# REVIEW is NOT a decision · portfolio-challenging-exit is HOLD with
# Lifecycle=REVIEWING internally.

# Rule matcher · first match wins · matches on Action from Priority matrix
rules:

  # ═══ NEGATIVE · 🔴 ═══
  - match: {action: "EXIT"}
    decision: "🔴 EXIT"
    color: red

  # ═══ PROTECT · 🟠 ═══
  # PROTECT = held with degraded risk / tighter stop
  - match: {action: "TIGHTEN STOP"}
    decision: "🟠 PROTECT"
    color: amber

  # REVIEW (Priority H · Premature Exit challenged) → operator sees HOLD
  # Portfolio-challenging-exit is internal state · surface as HOLD to operator
  - match: {action: "REVIEW"}
    decision: "🟢 HOLD"
    color: green

  # ═══ POSITIVE · 🟢 ═══
  - match: {action: "BUY BIG"}
    decision: "🟢 BUY"       # BUY BIG collapsed · size determines intensity
    color: green_dark
  - match: {action: "ADD"}
    decision: "🟢 ADD"
    color: green
  - match: {action: "BUY"}
    decision: "🟢 BUY"       # BUY CAUTIOUSLY collapsed
    color: green
  - match: {action: "HOLD"}
    decision: "🟢 HOLD"
    color: green

  # ═══ SKIP · ⚫ ═══
  - match: {action: "SKIP"}
    decision: "⚫ SKIP"
    color: black

  # ═══ LIFECYCLE STATES (blank decision · Lifecycle column carries state) ═══
  - match: {action: "CLOSED"}
    decision: "—"
    color: gray
  - match: {action: "IGNORE"}
    decision: "—"
    color: gray

  # ═══ FALLBACK ═══
  - match: {}
    decision: "—"
    color: gray

# Color codes for decision cell
colors:
  green_dark:  "70AD47"
  green:       "C6EFCE"
  amber:       "FFCC66"
  red:         "F8CBAD"
  black:       "808080"
  gray:        "E7E6E6"
