version: 5.0
last_amended: 2026-08-21
# LOCKED · 4-value operator-facing decision vocabulary (2026-08-21).
#
# Operator directive: "new + active + active plus + exit makes sense why
# hold ? new will become active + exit thats it, straight and simple ·
# active plus means add more · only 3 colors thats it, straight and simple"
#
# The Decision column now shows ONLY:
#
#   🆕 NEW      · Purple  · fresh recommendation today (first day, rec_dt == asof)
#   🟢 ACTIVE   · Green   · held position, no action needed
#   🟢 ACTIVE+  · Green   · held position, model wants MORE (add / stronger conviction)
#   🔴 EXIT     · Red     · closing today / already closed / same-day artifact / stop hit
#
# All prior vocabulary (BUY / HOLD / PROTECT / STRONG BUY / ADD / BUY BIG
# / WATCH / TIGHTEN STOP / CLOSED / SKIP / ARTIFACT / REVIEW / IGNORE)
# collapses into these four. Sub-detail (stop tightening, urgency,
# quality flag, exit reason) persists in ORTHOGONAL columns (Urgency,
# Reason, Action, Stop Loss, Exit Reason) · never in the Decision cell.
#
# SKIP is NEVER a Decision · rows failing the investability/quality gate
# are filtered from the primary Portfolio table entirely (Section 6 of
# 2026-08-15 directive · confirmed 2026-08-21).

# Rule matcher · first match wins · matches on Action from Priority matrix
rules:

  # ═══ EXIT · 🔴 · risk-veto / stop-loss / rotation / hard exit ═══
  - match: {action: "EXIT"}
    decision: "🔴 EXIT"
    color: red

  # ═══ ACTIVE+ · 🟢 · held & model wants more (any BUY-family action) ═══
  # BUY / BUY BIG / ADD / STRONG BUY / ACCUMULATE all collapse here when
  # applied to an EXISTING position. For a NEW position (rec_dt == asof)
  # the post-processor overrides to 🆕 NEW · the vocabulary router lives
  # in scripts/telegram_command_center_send.py::_normalize_decision.
  - match: {action: "BUY BIG"}
    decision: "🟢 ACTIVE+"
    color: green
  - match: {action: "ADD"}
    decision: "🟢 ACTIVE+"
    color: green
  - match: {action: "BUY"}
    decision: "🟢 ACTIVE+"
    color: green

  # ═══ ACTIVE · 🟢 · held, no action needed ═══
  # HOLD / PROTECT / REVIEW / TIGHTEN STOP · everything the operator does
  # NOT need to act on today. Any stop-tightening or protect nuance
  # lives in the Action + Stop Loss columns, not in Decision.
  - match: {action: "TIGHTEN STOP"}
    decision: "🟢 ACTIVE"
    color: green
  - match: {action: "REVIEW"}
    decision: "🟢 ACTIVE"
    color: green
  - match: {action: "HOLD"}
    decision: "🟢 ACTIVE"
    color: green

  # 2026-08-21 · SKIP fully removed per operator: "we dont need skip stocks
  # to be seen in portfolio anymore. we dont need skip itself". SKIP rows
  # are HARD-FILTERED upstream in the sender · they can never reach this
  # rule matcher. No SKIP mapping · no SKIP fallback · no SKIP tile.

  # ═══ TERMINAL · CLOSED / IGNORE / ARTIFACT · all collapse to EXIT ═══
  - match: {action: "CLOSED"}
    decision: "🔴 EXIT"
    color: red
  - match: {action: "IGNORE"}
    decision: "🔴 EXIT"
    color: red

  # ═══ FALLBACK · unknown action defaults to ACTIVE (safest for held) ═══
  - match: {}
    decision: "🟢 ACTIVE"
    color: green

# 3-color palette · operator directive 2026-08-21 "only 3 colors"
#   purple → NEW           · fresh opportunity today (attention)
#   green  → ACTIVE + ACTIVE+ (both variants share the color)
#   red    → EXIT          · terminal state
colors:
  purple: "D5A6EA"      # NEW · fresh recommendation
  green:  "C6EFCE"      # ACTIVE · ACTIVE+ (add-more variant)
  red:    "F8CBAD"      # EXIT · closing / closed / stopped

# 4-value operator-facing vocabulary
allowed_decisions:
  - "NEW"       # first day of the opportunity
  - "ACTIVE"    # held · no action
  - "ACTIVE+"   # held · model wants more (add)
  - "EXIT"      # closing / closed / terminal

# SKIP never appears in the primary portfolio table · sender enforces.
skip_from_portfolio: true
