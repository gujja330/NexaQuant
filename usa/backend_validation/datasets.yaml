# AEGIS USA · Backend Dataset Registry
#
# Sprint 1 canonical registry. Paths are relative to the REPO ROOT.
# USD ($) throughout — never ₹.

market:
  profile: usa
  currency: USD
  currency_symbol: "$"
  timezone: America/New_York
  benchmark: "^GSPC"

datasets:

  # ── UNIVERSE + MARKET DATA (LIVE) ─────────────────────────────────
  - name: universe
    path: usa/reports/universe.json
    producer: usa/scripts/build_universe.py
    kind: config
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, active_universe, n_tickers, tickers]
    completeness:
      required_non_empty_arrays: [tickers]
    consumers: [usa/scripts/refresh_market_data, usa/scripts/usa_daily, usa/research/*]

  - name: market_data_freshness
    path: usa/reports/market_data_freshness.json
    producer: usa/scripts/refresh_market_data.py
    kind: freshness
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, run_utc, n_ok, freshness]
    consumers: [usa/scripts/usa_ops_check]

  - name: spx_index
    path: usa/data/raw/us/_IDX_GSPC_D1.parquet
    producer: usa/scripts/refresh_market_data.py
    kind: price
    freshness_sla_trading_days: 1
    schema:
      required_columns: [open, high, low, close, volume]
    quality:
      no_negatives: [open, high, low, close]
      outlier_return_check: [close]
      outlier_sigma: 10.0
    consumers: [usa/research/recommendations, usa/research/benchmark]

  - name: vix_index
    path: usa/data/raw/us/_IDX_VIX_D1.parquet
    producer: usa/scripts/refresh_market_data.py
    kind: price
    freshness_sla_trading_days: 1
    schema:
      required_columns: [open, high, low, close]
    consumers: [usa/research/recommendations]

  - name: aapl_price
    path: usa/data/raw/us/AAPL_D1.parquet
    producer: usa/scripts/refresh_market_data.py
    kind: price
    freshness_sla_trading_days: 1
    schema:
      required_columns: [open, high, low, close, volume]
    quality:
      no_negatives: [open, high, low, close]
      outlier_return_check: [close]
      outlier_sigma: 10.0
    consumers: [usa/research/recommendations]
    notes: representative sample from the Dow 30 universe

  # ── V1 PIPELINE OUTPUTS (LIVE DAILY) ──────────────────────────────
  - name: recommendations
    path: usa/reports/recommendations.json
    producer: usa/research/recommendations/run.py
    kind: recommendations
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, currency, run_utc,
                       n_companies_evaluated, recommendations]
    completeness:
      required_non_empty_arrays: [recommendations]
    consumers: [usa/research/validation, usa/research/risk, usa/research/fusion,
                 usa/research/institutional_memory, usa/research/benchmark,
                 usa/research/decision_attribution, usa/research/morning_report,
                 usa/dashboard/frontend, usa/scripts/telegram_send]

  - name: investment_intelligence
    path: usa/reports/investment_intelligence.json
    producer: usa/research/fusion/run.py
    kind: fusion
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, reports]
    completeness:
      required_non_empty_arrays: [reports]
    consumers: [usa/research/decision_attribution, usa/dashboard/frontend, usa/scripts/telegram_send]

  - name: intelligence_summary
    path: usa/reports/intelligence_summary.json
    producer: usa/research/fusion/run.py
    kind: fusion
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine]
    consumers: [usa/scripts/usa_ops_check, usa/dashboard/frontend]

  - name: intelligence_conflicts
    path: usa/reports/intelligence_conflicts.json
    producer: usa/research/fusion/run.py
    kind: fusion
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine]
    consumers: [usa/dashboard/frontend]

  - name: risk_latest
    path: usa/reports/risk_latest.json
    producer: usa/research/risk/run.py
    kind: risk
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, run_utc, sizing, portfolio_risk]
    consumers: [usa/dashboard/frontend, usa/scripts/telegram_send]

  - name: validation_latest
    path: usa/reports/validation_latest.json
    producer: usa/research/validation/run.py
    kind: validation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine]
    consumers: [usa/scripts/usa_ops_check]

  - name: stock_validation
    path: usa/reports/stock_validation.json
    producer: usa/research/validation/run.py
    kind: validation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [n_tickers, tickers]
    consumers: [usa/dashboard/frontend]

  - name: price_context
    path: usa/reports/price_context.json
    producer: usa/research/price_context/run.py
    kind: price_context
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, n_tickers, tickers]
    consumers: [usa/dashboard/frontend]

  - name: benchmark
    path: usa/reports/benchmark.json
    producer: usa/research/benchmark/run.py
    kind: benchmark
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, run_utc, portfolio]
    consumers: [usa/dashboard/frontend, usa/scripts/telegram_send]

  - name: winner_genome
    path: usa/reports/winner_genome.json
    producer: usa/research/winner_genome/run.py
    kind: learning
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, mode]
    consumers: [usa/dashboard/frontend]

  - name: decision_attribution
    path: usa/reports/decision_attribution.json
    producer: usa/research/decision_attribution/run.py
    kind: attribution
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_recommendations, subsystem_weights, per_recommendation]
    consumers: [usa/dashboard/frontend]

  - name: recommendation_lifecycle
    path: usa/reports/recommendation_lifecycle.json
    producer: usa/research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_total, by_ticker]
    consumers: [usa/dashboard/frontend]

  - name: recommendation_history
    path: usa/reports/recommendation_history.json
    producer: usa/research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [market, n_tickers, n_days_archived, tickers]
    consumers: [usa/dashboard/frontend]

  - name: missed_opportunities
    path: usa/reports/missed_opportunities.json
    producer: usa/research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_days_scanned, n_events]
    consumers: [usa/dashboard/frontend]

  - name: morning_latest_md
    path: usa/reports/morning_latest.md
    producer: usa/research/morning_report/run.py
    kind: report
    freshness_sla_trading_days: 1
    consumers: [usa/dashboard/frontend]

  - name: morning_latest_html
    path: usa/reports/morning_latest.html
    producer: usa/research/morning_report/run.py
    kind: report
    freshness_sla_trading_days: 1
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 2 · Market Intelligence + AI ─────────────────────────
  - name: market_intelligence
    path: usa/reports/market_intelligence.json
    producer: usa/research/market_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, composite_score, regime, signals]
    consumers: [usa/dashboard/frontend, backend/ai/market_analyst]

  - name: market_intelligence_summary
    path: usa/reports/market_intelligence_summary.json
    producer: usa/research/market_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, composite_score, regime, signals]
    consumers: [usa/dashboard/frontend, usa/scripts/usa_ops_check]

  - name: ai_market_narrative
    path: usa/reports/ai_market_narrative.json
    producer: usa/research/market_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, agents]
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 2.5 · Feature Store ──────────────────────────────────
  - name: feature_store_summary
    path: usa/reports/feature_store_summary.json
    producer: usa/research/feature_store/run.py
    kind: feature_store
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, verdict, n_rows, n_features, schema_fingerprint]
    consumers: [usa/dashboard/frontend]

  - name: ai_feature_narrative
    path: usa/reports/ai_feature_narrative.json
    producer: usa/research/feature_store/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, agents]
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 2.6 · Feature Intelligence + Research ────────────────
  - name: feature_intelligence
    path: usa/reports/feature_intelligence.json
    producer: usa/research/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, governance, quality, drift, importance, selection]
    consumers: [usa/dashboard/frontend]

  - name: feature_intelligence_summary
    path: usa/reports/feature_intelligence_summary.json
    producer: usa/research/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, governance_verdict, drift_verdict, n_selected]
    consumers: [usa/dashboard/frontend, usa/scripts/usa_ops_check]

  - name: selected_features
    path: usa/reports/selected_features.json
    producer: usa/research/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_selected, selected]
    consumers: [usa/dashboard/frontend, usa/research/recommendations (future)]
    notes: The subset of features downstream engines are allowed to consume. Sprint 3+ reads this.

  - name: ai_feature_research
    path: usa/reports/ai_feature_research.json
    producer: usa/research/feature_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 2.7 · Model Factory ──────────────────────────────────
  - name: model_factory
    path: usa/reports/model_factory.json
    producer: usa/research/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, run_utc, asof, n_models, models, predictions_summary]
    consumers: [usa/dashboard/frontend]

  - name: model_metrics
    path: usa/reports/model_metrics.json
    producer: usa/research/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_models, metrics]
    consumers: [usa/dashboard/frontend]

  - name: ensemble
    path: usa/reports/ensemble.json
    producer: usa/research/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, strategy, n_models, top_10]
    consumers: [usa/dashboard/frontend, usa/research/recommendations (Sprint 3+)]

  - name: ai_model_narrative
    path: usa/reports/ai_model_narrative.json
    producer: usa/research/model_factory/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 3 · Recommendation Intelligence v3 ───────────────────
  - name: recommendations_v3
    path: usa/reports/recommendations_v3.json
    producer: usa/research/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, currency, regime, n_tickers, distribution, recommendations, model_stamp]
    consumers: [usa/dashboard/frontend, usa/research/risk (Sprint 4+)]

  - name: recommendations_v3_summary
    path: usa/reports/recommendations_v3_summary.json
    producer: usa/research/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, regime, n_tickers, distribution, top_buys, top_sells, model_stamp]
    consumers: [usa/dashboard/frontend]

  - name: recommendations_v3_conflicts
    path: usa/reports/recommendations_v3_conflicts.json
    producer: usa/research/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_conflicts, conflicts]
    consumers: [usa/dashboard/frontend]

  - name: ai_recommendation_narrative
    path: usa/reports/ai_recommendation_narrative.json
    producer: usa/research/recommendation_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [usa/dashboard/frontend]

  # ── SPRINT 1B · INGESTION LAYER (all WIRED into usa_daily.py) ─────
  - name: fundamentals
    path: usa/reports/fundamentals.json
    producer: usa/research/fundamentals/run.py
    kind: fundamentals
    freshness_sla_trading_days: 5   # weekly rebuild ok
    schema:
      required_keys: [engine, version, market, run_utc, tickers]
    consumers: [usa/scripts/usa_daily (ingest_fundamentals)]
    notes: Sprint 1B · WAS FINDING 8 (not wired). Now scheduled daily.

  - name: news_sentiment
    path: usa/data/raw/us/news_sentiment.parquet
    producer: usa/research/news/run.py
    kind: news
    freshness_sla_trading_days: 2
    schema:
      required_columns: [asof, symbol, news_sent, pos, neg, n_headlines]
    consumers: [usa/scripts/usa_daily (ingest_news)]
    notes: Sprint 1B · Google News RSS + lexicon score. Optional FinBERT rescore later.

  - name: news_sentiment_summary
    path: usa/reports/news_sentiment_summary.json
    producer: usa/research/news/run.py
    kind: news
    freshness_sla_trading_days: 2
    schema:
      required_keys: [engine, run_utc, asof, n_tickers, avg_sentiment]
    consumers: [usa/scripts/usa_daily (ingest_news)]

  - name: earnings_calendar
    path: usa/data/raw/us/earnings.parquet
    producer: usa/research/earnings/run.py
    kind: earnings
    freshness_sla_trading_days: 2
    schema:
      required_columns: [ticker, ingested_utc, asof]
    consumers: [usa/scripts/usa_daily (ingest_earnings)]
    notes: Sprint 1B · next earnings date + last-quarter surprise from yfinance.

  - name: earnings_summary
    path: usa/reports/earnings_summary.json
    producer: usa/research/earnings/run.py
    kind: earnings
    freshness_sla_trading_days: 2
    schema:
      required_keys: [engine, run_utc, n_upcoming_30d]

  - name: insider_transactions
    path: usa/data/raw/us/insider_transactions.parquet
    producer: usa/research/insider/run.py
    kind: institutional_flows
    freshness_sla_trading_days: 3
    optional: true      # small universe may have few transactions in window
    schema:
      required_columns: [ticker, transaction, shares, ingested_utc]
    consumers: [usa/scripts/usa_daily (ingest_insider)]
    notes: Sprint 1B · Form 4 filings via yfinance insider_transactions accessor.

  - name: insider_summary
    path: usa/reports/insider_summary.json
    producer: usa/research/insider/run.py
    kind: institutional_flows
    freshness_sla_trading_days: 2
    schema:
      required_keys: [engine, run_utc, window_days, net_flow_usd, per_ticker]

  - name: etf_flows
    path: usa/data/raw/us/etf_flows.parquet
    producer: usa/research/etf_flows/run.py
    kind: flows
    freshness_sla_trading_days: 2
    schema:
      required_columns: [ticker, date, close, volume, dollar_volume]
    consumers: [usa/scripts/usa_daily (ingest_etf_flows)]
    notes: Sprint 1B · sector + broad-market ETF dollar-volume proxy for flow rotation.

  - name: etf_flows_summary
    path: usa/reports/etf_flows_summary.json
    producer: usa/research/etf_flows/run.py
    kind: flows
    freshness_sla_trading_days: 2
    schema:
      required_keys: [engine, run_utc, window_days, per_etf]

  - name: macro_indicators
    path: usa/data/raw/us/macro.parquet
    producer: usa/research/macro/run.py
    kind: macro
    freshness_sla_trading_days: 2
    schema:
      required_columns: [symbol, date, close, ingested_utc]
    consumers: [usa/scripts/usa_daily (ingest_macro)]
    notes: Sprint 1B · rates + DXY + gold + oil + VIX + MOVE from yfinance.

  - name: macro_summary
    path: usa/reports/macro_summary.json
    producer: usa/research/macro/run.py
    kind: macro
    freshness_sla_trading_days: 2
    schema:
      required_keys: [engine, run_utc, per_symbol]

  - name: corporate_actions
    path: usa/data/raw/us/corporate_actions.parquet
    producer: usa/research/corporate_actions/run.py
    kind: corporate_actions
    freshness_sla_trading_days: 5   # weekly cadence appropriate
    optional: true      # may be empty if no events in window
    schema:
      required_columns: [ticker, action_date, dividend_usd, split_ratio, ingested_utc]
    consumers: [usa/scripts/usa_daily (ingest_corporate_actions)]
    notes: Sprint 1B · yfinance actions accessor, trailing 365 days.

  - name: corporate_actions_summary
    path: usa/reports/corporate_actions_summary.json
    producer: usa/research/corporate_actions/run.py
    kind: corporate_actions
    freshness_sla_trading_days: 5
    schema:
      required_keys: [engine, run_utc, n_events, n_dividends, n_splits]

  - name: institutional_holders
    path: usa/data/raw/us/institutional_holders.parquet
    producer: usa/research/sec_13f/run.py
    kind: institutional_flows
    freshness_sla_trading_days: 30    # 13F cadence is quarterly, but the yfinance snapshot may not update daily
    optional: true
    schema:
      required_columns: [ticker, holder, ingested_utc]
    consumers: [usa/scripts/usa_daily (ingest_sec_13f)]
    notes: |
      Sprint 1B · yfinance institutional_holders view (top ~10 per ticker).
      Full SEC EDGAR 13F parse (all filers · position deltas quarter-over-quarter)
      deferred to a later sprint.

  - name: sec_13f_summary
    path: usa/reports/sec_13f_summary.json
    producer: usa/research/sec_13f/run.py
    kind: institutional_flows
    freshness_sla_trading_days: 30
    schema:
      required_keys: [engine, run_utc, n_tickers, avg_institutional_pct]
