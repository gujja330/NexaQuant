# AEGIS USA · Universe Configuration
#
# Starting universe: Dow Jones Industrial Average (30 tickers) as of
# 2026-07-18. Compact enough to iterate on, blue-chip enough to be
# credible day 1. Expand to S&P 500 / NASDAQ 100 / Russell 1000 in
# later phases by adding entries under `universes:`.
#
# ALL PRICES IN USD ($). Never ₹.

active_universe: dow30

