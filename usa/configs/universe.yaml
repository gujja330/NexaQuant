# Benchmark indices for the Continuous Benchmark engine (Phase 4)
benchmarks:
  primary:     {symbol: "^GSPC",  name: "S&P 500"}
  secondary:   {symbol: "^NDX",   name: "NASDAQ 100"}
  tertiary:    {symbol: "^DJI",   name: "Dow Jones Industrial Average"}
  volatility:  {symbol: "^VIX",   name: "CBOE Volatility Index"}

# Market calendar & timezone
market:
