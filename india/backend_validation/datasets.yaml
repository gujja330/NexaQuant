# AEGIS India · Backend Dataset Registry
#
# Sprint 1 canonical registry. Every dataset the India pipeline reads or
# writes appears here with freshness SLA + expected schema + quality rules.
#
# Paths are relative to the REPO ROOT.

market:
  profile: india
  currency: INR
  currency_symbol: "₹"
  timezone: Asia/Kolkata
  benchmark: "^NSEI"

datasets:

  # ── PRICE (LIVE) ──────────────────────────────────────────────────
  - name: nifty_index
    path: data/raw/india/NSEI_D1.parquet
    producer: india/refresh_data.py
    kind: price
    freshness_sla_trading_days: 1
    schema:
      required_columns: [open, high, low, close, tick_volume, spread]
    quality:
      no_negatives: [open, high, low, close]
      outlier_return_check: [close]
      outlier_sigma: 10.0
    consumers: [research/adaptive_rec_v2, research/benchmark, india/recommendation_generator]

  - name: indiavix
    path: data/raw/india/INDIAVIX_D1.parquet
    producer: india/refresh_data.py
    kind: price
    freshness_sla_trading_days: 1
    schema:
      required_columns: [open, high, low, close]
    consumers: [india/confidence_engine, research/global_intelligence]

  # ── FROZEN INTELLIGENCE TIER (should refresh but currently stale) ─
  - name: global_context
    path: reports/global_context.json
    producer: research/global_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [asof_utc, composites, classifications, published_at_utc]
    consumers:
      - research/risk_capital_v2 (LIVE DAILY reads this)
      - research/knowledge_graph (LIVE DAILY reads this)
      - research/institutional_memory (LIVE DAILY reads this)
      - research/morning_report (LIVE DAILY reads this)
      - research/decision_attribution (LIVE DAILY reads this)
      - ux/dashboard/frontend/index.html (SPA renders as live)
    notes: |
      CRITICAL: this file has been static since 2026-07-17 (see AEGIS_STAGE0_COMPLETION.md
      FINDING 2). Multiple LIVE daily steps read it as if current. Freshness validator
      will FAIL until the producer is wired into a scheduler.

  - name: sector_context
    path: reports/sector_context.json
    producer: research/sector_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [asof_utc, sectors]
    consumers: [research/company_intelligence, research/industry_intelligence]
    notes: FROZEN 2026-07-17 (FINDING 2)

  - name: industry_context
    path: reports/industry_context.json
    producer: research/industry_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [asof_utc]
    consumers: [research/company_intelligence]
    notes: FROZEN 2026-07-17 (FINDING 2)

  - name: company_context
    path: reports/company_context.json
    producer: research/company_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [asof_utc]
    consumers: []
    optional: true    # currently terminal — no live consumer
    notes: FROZEN 2026-07-17 (FINDING 2)

  # ── LEARNING CORPUS (FROZEN but hard-required by 4 live steps) ───
  - name: learning_corpus
    path: reports/learning.parquet
    producer: research/adaptive_learning/run.py
    kind: learning
    freshness_sla_trading_days: 2
    schema:
      required_columns: [ticker, entry_date, exit_date, return_pct, is_winner,
                         score_at_entry, confidence, dim_momentum, dim_trend,
                         dim_rs_nifty, dim_volatility, dim_drawdown, dim_position_52w]
    completeness:
      min_rows: 500
      ticker_column: ticker
    quality:
      no_negatives: []
    consumers:
      - research/adaptive_rec_v2 (LIVE DAILY hard-require)
      - research/validation_v2 (LIVE DAILY hard-require)
      - research/recommendation_dna (LIVE DAILY hard-require)
      - research/benchmark (LIVE DAILY hard-require)
    notes: |
      CRITICAL FINDING 1: this corpus is the ground truth for 4 live daily steps
      but was produced ONCE on 2026-07-17 and never rebuilt. Freshness validator
      will FAIL. Sprint N (TBD) must reconnect adaptive_learning to a schedule.

  # ── INSTITUTIONAL FLOWS (Sprint 1B · WIRED) ───────────────────────
  - name: fii_dii_flows
    path: data/raw/india/fii_dii.parquet
    producer: india/fii_dii.py
    kind: institutional_flows
    freshness_sla_trading_days: 2
    schema:
      required_columns: [ts]
    consumers: [india/run_arjuna, scripts/aegis_daily_v2 (ingest_fii_dii)]
    notes: |
      Sprint 1B: scheduled via ingest_fii_dii step in aegis_daily_v2.py.
      Was FINDING 3 (manual only). Now runs daily.

  # ── NEWS SENTIMENT (Sprint 1B · WIRED) ────────────────────────────
  - name: news_sentiment
    path: data/raw/india/news_sentiment.parquet
    producer: india/news_sentiment.py
    kind: news
    freshness_sla_trading_days: 2
    schema:
      required_columns: [asof, symbol, news_sent, pos, neg, neu]
    consumers: [india/run_arjuna, scripts/aegis_daily_v2 (ingest_news_sentiment)]
    notes: |
      Sprint 1B: scheduled via ingest_news_sentiment step in aegis_daily_v2.py.
      Was FINDING 3 (manual only). Now runs daily.

  # ── FUNDAMENTALS (Sprint 1B · WIRED) ──────────────────────────────
  - name: fundamentals_snapshot
    path: data/raw/india/fundamentals.parquet
    producer: india/fundamentals_nse.py
    kind: fundamentals
    freshness_sla_trading_days: 5   # weekly rebuild expected (yfinance snapshot is current)
    schema:
      required_columns: [returnOnEquity, profitMargins, earningsGrowth, debtToEquity,
                         trailingPE, priceToBook, quality_score]
    consumers: [scripts/aegis_daily_v2 (ingest_fundamentals)]
    notes: |
      Sprint 1B: scheduled via ingest_fundamentals step in aegis_daily_v2.py.
      Was FINDING 3 (zero callers). Now ingested daily; downstream engines pending.

  # ── CORPORATE ACTIONS (Sprint 1B · NEW) ───────────────────────────
  - name: corporate_actions
    path: data/raw/india/corporate_actions.parquet
    producer: india/corporate_actions.py
    kind: corporate_actions
    freshness_sla_trading_days: 5   # weekly cadence — events are point-in-time, not tick
    optional: true
    schema:
      required_columns: [ticker, action_date, dividend, split_ratio, ingested_utc]
    consumers: [scripts/aegis_daily_v2 (ingest_corporate_actions)]
    notes: Sprint 1B new module · dividends + splits from yfinance, trailing 365 days.

  # ── LIVE DAILY V2 OUTPUTS ─────────────────────────────────────────
  - name: recommendations
    path: reports/recommendations.json
    producer: research/adaptive_rec_v2/run.py
    kind: recommendations
    freshness_sla_trading_days: 1
    schema:
      required_keys: [run_utc, n_companies_evaluated, recommendations]
    completeness:
      required_non_empty_arrays: [recommendations]
    consumers:
      - research/validation_v2, research/risk_capital_v2, research/knowledge_graph
      - research/adaptive_rec_v2/run_fusion, research/decision_center
      - research/institutional_memory, research/winner_genome
      - research/decision_attribution, research/benchmark, research/morning_report

  - name: investment_intelligence
    path: reports/investment_intelligence.json
    producer: research/adaptive_rec_v2/run_fusion.py
    kind: fusion
    freshness_sla_trading_days: 1
    schema:
      required_keys: [reports]
    completeness:
      required_non_empty_arrays: [reports]
    consumers: [ux/dashboard, ux/telegram, research/morning_report]

  - name: risk_capital_v2_latest
    path: reports/risk_capital_v2_latest.json
    producer: research/risk_capital_v2/run.py
    kind: risk
    freshness_sla_trading_days: 1
    schema:
      required_keys: [run_utc, sizing, portfolio_risk]
    consumers: [ux/dashboard, ux/telegram]

  - name: validation_v2_latest
    path: reports/validation_v2_latest.json
    producer: research/validation_v2/run.py
    kind: validation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [run_utc]
    consumers: [scripts/aegis_ops_check]

  - name: stock_validation
    path: reports/stock_validation.json
    producer: research/validation_v2/run_stock_history.py
    kind: validation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [n_tickers, tickers]
    consumers: [ux/dashboard]

  - name: price_context
    path: reports/price_context.json
    producer: research/validation_v2/run_price_context.py
    kind: price_context
    freshness_sla_trading_days: 1
    schema:
      required_keys: [n_tickers, tickers]
    consumers: [ux/dashboard, research/morning_report]

  - name: benchmark
    path: reports/benchmark.json
    producer: research/benchmark/run.py
    kind: benchmark
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, run_utc, portfolio]
    consumers: [ux/dashboard, research/morning_report]

  - name: winner_genome
    path: reports/winner_genome.json
    producer: research/recommendation_dna/run_winner_genome.py
    kind: learning
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, mode]
    consumers: [ux/dashboard, research/morning_report]

  - name: decision_attribution
    path: reports/decision_attribution.json
    producer: research/decision_attribution/run.py
    kind: attribution
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_recommendations, subsystem_weights, per_recommendation]
    consumers: [ux/dashboard, research/morning_report]

  - name: recommendation_lifecycle
    path: reports/recommendation_lifecycle.json
    producer: research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_total, by_ticker]
    consumers: [ux/dashboard]

  - name: recommendation_history
    path: reports/recommendation_history.json
    producer: research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [n_tickers, n_days_archived, tickers]
    consumers: [ux/dashboard]

  - name: missed_opportunities
    path: reports/missed_opportunities.json
    producer: research/institutional_memory/run.py
    kind: memory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, n_days_scanned, n_events]
    consumers: [ux/dashboard]

  - name: morning_latest_md
    path: reports/morning_latest.md
    producer: research/morning_report/run.py
    kind: report
    freshness_sla_trading_days: 1
    consumers: [ux/dashboard]

  - name: morning_latest_html
    path: reports/morning_latest.html
    producer: research/morning_report/run.py
    kind: report
    freshness_sla_trading_days: 1
    consumers: [ux/dashboard]

  # ── SPRINT 2 · Market Intelligence + AI ─────────────────────────
  - name: market_intelligence
    path: reports/market_intelligence.json
    producer: india/market_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, composite_score, regime, signals]
    consumers: [ux/dashboard, research/morning_report, backend/ai/market_analyst]

  - name: market_intelligence_summary
    path: reports/market_intelligence_summary.json
    producer: india/market_intelligence/run.py
    kind: intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, composite_score, regime, signals]
    consumers: [ux/dashboard, scripts/aegis_ops_check]

  - name: ai_market_narrative
    path: reports/ai_market_narrative.json
    producer: india/market_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, agents]
    consumers: [ux/dashboard, research/morning_report]

  # ── SPRINT 2.5 · Feature Store ──────────────────────────────────
  - name: feature_store_summary
    path: reports/feature_store_summary.json
    producer: india/feature_store/run.py
    kind: feature_store
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, verdict, n_rows, n_features, schema_fingerprint]
    consumers: [ux/dashboard, backend/ai/feature_quality]

  - name: ai_feature_narrative
    path: reports/ai_feature_narrative.json
    producer: india/feature_store/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, agents]
    consumers: [ux/dashboard]

  # ── SPRINT 2.6 · Feature Intelligence + Research ────────────────
  - name: feature_intelligence
    path: reports/feature_intelligence.json
    producer: india/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, governance, quality, drift, importance, selection]
    consumers: [ux/dashboard]

  - name: feature_intelligence_summary
    path: reports/feature_intelligence_summary.json
    producer: india/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, governance_verdict, drift_verdict, n_selected]
    consumers: [ux/dashboard, scripts/aegis_ops_check]

  - name: selected_features
    path: reports/selected_features.json
    producer: india/feature_intelligence/run.py
    kind: feature_intelligence
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_selected, selected]
    consumers: [ux/dashboard, research/adaptive_rec_v2 (future)]
    notes: The subset of features downstream engines are allowed to consume. Sprint 3+ reads this.

  - name: ai_feature_research
    path: reports/ai_feature_research.json
    producer: india/feature_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [ux/dashboard]

  # ── SPRINT 2.7 · Model Factory ──────────────────────────────────
  - name: model_factory
    path: reports/model_factory.json
    producer: india/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, run_utc, asof, n_models, models, predictions_summary]
    consumers: [ux/dashboard]

  - name: model_metrics
    path: reports/model_metrics.json
    producer: india/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_models, metrics]
    consumers: [ux/dashboard, backend/ai/model_analyst]

  - name: ensemble
    path: reports/ensemble.json
    producer: india/model_factory/run.py
    kind: model_factory
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, strategy, n_models, top_10]
    consumers: [ux/dashboard, research/adaptive_rec_v2 (Sprint 3+)]

  - name: ai_model_narrative
    path: reports/ai_model_narrative.json
    producer: india/model_factory/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [ux/dashboard]

  # ── SPRINT 3 · Recommendation Intelligence v3 ───────────────────
  - name: recommendations_v3
    path: reports/recommendations_v3.json
    producer: india/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, currency, regime, n_tickers, distribution, recommendations, model_stamp]
    consumers: [ux/dashboard, research/risk (Sprint 4+), research/portfolio (Sprint 5+)]

  - name: recommendations_v3_summary
    path: reports/recommendations_v3_summary.json
    producer: india/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, regime, n_tickers, distribution, top_buys, top_sells, model_stamp]
    consumers: [ux/dashboard]

  - name: recommendations_v3_conflicts
    path: reports/recommendations_v3_conflicts.json
    producer: india/recommendation_intelligence/run.py
    kind: recommendation
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_conflicts, conflicts]
    consumers: [ux/dashboard]

  - name: ai_recommendation_narrative
    path: reports/ai_recommendation_narrative.json
    producer: india/recommendation_intelligence/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [ux/dashboard]

  # ── SPRINT 4 · Risk Engine ───────────────────────────────────────
  - name: sized_positions
    path: reports/sized_positions.json
    producer: india/risk_engine/run.py
    kind: risk
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, currency, regime,
                       n_positions, positions, model_stamp, budget_snapshot]
    consumers: [ux/dashboard, backend/portfolio (Sprint 5+)]

  - name: risk_report
    path: reports/risk_report.json
    producer: india/risk_engine/run.py
    kind: risk
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, verdict,
                       n_positions, gross_exposure_pct, hhi_concentration]
    consumers: [ux/dashboard]

  - name: ai_risk_narrative
    path: reports/ai_risk_narrative.json
    producer: india/risk_engine/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [ux/dashboard]

  # ── SPRINT 5 · Portfolio Engine ──────────────────────────────────
  - name: portfolio_v3
    path: reports/portfolio_v3.json
    producer: india/portfolio_engine/run.py
    kind: portfolio
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, asof, currency, regime,
                       config_snapshot, snapshot, model_stamp]
    consumers: [ux/dashboard, backend/learning (Sprint 6+), backend/execution (Sprint 7+)]

  - name: portfolio_diff
    path: reports/portfolio_diff.json
    producer: india/portfolio_engine/run.py
    kind: portfolio
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, market, asof, n_open, n_close, n_increase, n_decrease,
                       n_hold, turnover_pct, instructions]
    consumers: [ux/dashboard, backend/execution (Sprint 7+)]

  - name: portfolio_state
    path: reports/portfolio_state.json
    producer: india/portfolio_engine/run.py
    kind: portfolio
    freshness_sla_trading_days: 1
    schema:
      required_keys: [market, asof, n_positions, positions]
    consumers: [india/portfolio_engine (next-day prior state), backend/learning]

  - name: ai_portfolio_narrative
    path: reports/ai_portfolio_narrative.json
    producer: india/portfolio_engine/run.py
    kind: ai_narrative
    freshness_sla_trading_days: 1
    schema:
      required_keys: [engine, version, market, run_utc, output]
    consumers: [ux/dashboard]
