# AEGIS Research Lab — experiment registry (single source of truth).
# Production (AEGIS 1.x) changes ONLY when a LAB beats this baseline through the full pipeline.
# Edit the fields by hand as experiments progress; render with:
#   python india/ai_lab/lab_status.py          (console leaderboard)
#   python india/ai_lab/research_journal.py     (docs/RESEARCH_JOURNAL.md — one page per experiment)

baseline:
  name: AEGIS Production 1.3
  selection_rqs: 0.50          # current selection skill = a coin flip; the bar any LAB must beat OOS
  note: returns unpredictable on price alone; a LAB must move RQS off 0.50 out-of-sample.

# status: planned | acquiring | feature-eng | testing | forward-paper | promoted | rejected
# decision: pending | reject | promote
# numeric gates stay null until measured.
labs:
  - id: LAB-001
    name: Earnings Intelligence
    question: Do quarterly earnings surprises / guidance / revisions improve cross-sectional ranking?
    dataset: NSE quarterly earnings surprise, guidance, estimate revisions (point-in-time)
    gate_layer: earnings
    status: planned
    coverage: null
    missing_pct: null
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    decision: pending
    notes: Highest-ROI first dataset. Blocked only on data acquisition.

  - id: LAB-002
    name: Point-in-Time Fundamentals
    question: Do as-reported fundamentals and their acceleration rank winners better than price?
    dataset: PIT ROE / margins / debt / growth + acceleration (as-reported dates)
    gate_layer: fundamentals
    status: planned
    coverage: null
    missing_pct: null
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    decision: pending
    notes: Must be strictly point-in-time or the verdict is a lie.

  - id: LAB-003
    name: Corporate Actions / Events
    question: Do discrete events (orders, approvals, M&A, buybacks) carry rankable information?
    dataset: corporate-action / event feed with public announcement dates
    gate_layer: events
    status: planned
    coverage: null
    missing_pct: null
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    decision: pending
    notes: Prone to look-ahead/survivorship — be strict on announcement dates.

  - id: LAB-004
    name: Institutional Money
    question: Do FII / DII / MF / ETF flows and holdings changes lead or confirm moves?
    dataset: FII / DII net flows + fund holdings changes (disclosure-dated)
    gate_layer: flows
    status: planned
    coverage: null
    missing_pct: null
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    decision: pending
    notes: Aggregate flows may help the regime overlay; stock-level holdings are the per-name signal.

  - id: LAB-005
    name: Learning-to-Rank
    question: Does an ML ranker over richer features beat the hand-weighted suitability score?
    dataset: technicals + sector + KEPT LAB datasets -> relative ranking (never price)
    gate_layer: ltr
    status: harness-built
    coverage: 100
    missing_pct: 0
    ic: null
    lift: -0.006                  # price-only LtR RQS 0.504 vs baseline 0.510
    walk_forward: FAIL
    forward_paper: null
    decision: reject              # on PRICE-only features; revisit once LAB-001..004 contribute kept features
    notes: Runs LAST. Rejected on price alone (expected). Harness = india/ai_lab/rank_model.py (ai-lab branch).

  - id: LAB-006
    name: Exit Strategy
    question: Can any intra-cycle exit rule (score-drop / vol-spike / trailing stop / sentiment) beat hold-to-rebalance on risk-adjusted return?
    dataset: aegis_registry historical cycles + price panel + news_sentiment (LIVE-only) archive
    gate_layer: exit
    status: rejected
    trial_count: 28
    coverage: 100
    missing_pct: null
    ic: null
    lift: null
    walk_forward: FAIL
    forward_paper: null
    decision: reject
    notes: |
      Rule B (vol-spike): rejected on economic evidence (MaxDD unchanged, CAGR loss).
      Rule C (trailing stop 4x3): PBO 0.229 across 12 configs; no DSR>0.90 config.
      Rule C1 (regime-gated 5% P3 Weak): 2 of 6 gates pass. Mechanism works in Weak
      cycles but halves CAGR too. Rules A (score) & D (sentiment) forward-collect only.
    config_dir: india/ai_lab/LAB006_Exit_Strategy/

  - id: LAB-007
    name: Dynamic Exposure / Position Sizing
    question: Does any pre-registered alternative regime->exposure policy beat the current PRODUCTION dynamic exposure?
    dataset: aegis_registry historical cycles + PIT-reconstructed production exp series
    gate_layer: exposure
    status: rejected
    trial_count: 4
    coverage: 100
    missing_pct: null
    ic: null
    lift: null
    walk_forward: FAIL
    forward_paper: null
    decision: reject
    notes: |
      N0 (control) + 4 candidates (A milder India / B stronger India / C smooth VIX taper / D fixed 0.85).
      All fail DSR>0.90 (best 0.87). All fail Gate 5 (50bps cost). D shows best headline
      metrics but fails Gate 6 (no regime input). Full-matrix PBO 0.700 (cash=0%) / 0.871 (cash=6%) —
      config selection unstable. Confirmation era shows CAGR ~4-8% vs discovery ~22-25% — era effect
      dominates any exposure calibration signal. Production exposure remains frozen.
    config_dir: india/ai_lab/LAB007_Dynamic_Exposure/
    config_file: india/ai_lab/LAB007_Dynamic_Exposure/lab007.yaml
