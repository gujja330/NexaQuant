# AEGIS Research Lab — experiment registry (the single source of truth for LAB status).
# Production (AEGIS 1.x) changes ONLY when a LAB beats this baseline through the full pipeline.
# Update the status fields by hand as each experiment progresses; lab_status.py renders the dashboard.

baseline:
  name: AEGIS Production 1.3
  selection_rqs: 0.50          # current selection skill = a coin flip; the bar any LAB must beat
  note: returns unpredictable on price alone; a LAB must move RQS off 0.50 out-of-sample.

# status: planned | acquiring | feature-eng | testing | forward-paper | promoted | rejected
# pipeline gates (null until measured): ic, lift, walk_forward, forward_paper ; promotion: NO|YES
labs:
  - id: LAB-001
    name: Earnings Intelligence
    dataset: quarterly earnings surprise / guidance / estimate revisions
    gate_layer: earnings           # matches a column dropped in data/layers/earnings.parquet
    status: planned
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    promotion: NO

  - id: LAB-002
    name: Point-in-Time Fundamentals
    dataset: PIT ROE / margins / debt / growth + their acceleration (as-reported dates)
    gate_layer: fundamentals
    status: planned
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    promotion: NO

  - id: LAB-003
    name: Corporate Actions / Events
    dataset: orders, approvals, M&A, buybacks, management change (PIT announcement dates)
    gate_layer: events
    status: planned
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    promotion: NO

  - id: LAB-004
    name: Institutional Money
    dataset: FII / DII / mutual-fund / ETF flows and holdings changes
    gate_layer: flows
    status: planned
    ic: null
    lift: null
    walk_forward: null
    forward_paper: null
    promotion: NO

  - id: LAB-005
    name: Learning-to-Rank
    dataset: combined features (technicals + sector + the kept LAB datasets) -> relative ranking
    gate_layer: ltr
    status: harness-built          # india/ai_lab/rank_model.py exists; price-only run did NOT beat baseline
    ic: null
    lift: -0.006                    # price-only LtR RQS 0.504 vs baseline 0.510 (rejected on price alone)
    walk_forward: FAIL
    forward_paper: null
    promotion: NO
